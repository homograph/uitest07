<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>예약 유형 오선택 교정 · 프로토타입</title>
<style>
  :root{
    --navy:#19254d;
    --navy-dark:#9db1e6;
    --good:#0ca30c;
    --warning:#fab219;
    --critical:#d03b3b;
    --bg:#E6E9EF;
    /* Task 2에서 추가한 토큰. 위 값들은 재정의하지 않는다. */
    --card-bg:#ffffff;
    --input-bg:#F5F6F7;
    --ink:#171A24;
    --ink-sub:#8C93A6;
    /* v11: --nudge-*(bg/border/body-ink/accent) 토큰은 #nudge(인라인 넛지 카드)와 함께
       지웠다. 브리지(#bridge)는 값을 CSS에 직접 적었다(재사용할 다른 곳이 없다). */
    /* Task 5에서 추가한 토큰. 휠 선택 밴드 전용. */
    --wheel-band-bg:#F1F9FE;
    --wheel-band-ink:#0086EA;
  }
  html,body{margin:0;padding:0;background:var(--bg);color:#111;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;}
  /* 라이트 모드 앱 화면의 스크린샷이므로 다크모드에서도 폰 프레임 안쪽은 그대로 둔다(뒤집지 않는다). */
  html{color-scheme:light;}

  #selftest-out{
    white-space:pre-wrap;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:12px;
    padding:16px;
    margin:0;
    background:#fff;
  }

  /* ---- 폰 프레임 · 시간&경로 입력 화면 (Task 2) ---- */
  .rt-stage{
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:40px 16px;
    box-sizing:border-box;
  }
  .rt-phone{
    width:360px;
    height:800px;
    /* .rt-stage의 flex item이라 flex-shrink 기본값(1) 때문에 좁은 뷰포트에서 폭이
       줄어들 수 있다. 이 프로토의 최상위 제약은 "폰 프레임 안은 360×800"이므로 줄어드는
       대신 잘려서 가로 스크롤이 생기는 쪽을 택한다. */
    flex:0 0 auto;
    background:var(--bg);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    position:relative;
    box-shadow:0 8px 30px rgba(0,0,0,.18);
    font-variant-numeric: tabular-nums;
  }
  /* Task 6: 화면 전환(input/vehicle/preview) 컨테이너. 항상 하나만 보인다. */
  .rt-screen{
    flex:1 1 auto;
    min-height:0;
    display:flex;
    flex-direction:column;
  }
  .rt-screen[hidden]{display:none;}
  .rt-appbar{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:12px;
    padding:16px 20px 8px;
    box-sizing:border-box;
  }
  .rt-iconbtn{
    appearance:none;border:none;background:transparent;padding:0;margin:0;
    display:flex;align-items:center;justify-content:center;
    width:24px;height:24px;cursor:pointer;
  }
  /* Task 9: 입력 화면은 이 프로토의 첫 화면이라 뒤로가기가 갈 곳이 없다. 되돌아갈 화면을
     새로 만드는 대신 흐리게 비활성화해 "여기가 끝"임을 보여준다. */
  .rt-iconbtn:disabled{opacity:.35;cursor:default;}
  .rt-appbar-title{
    font-size:18px;font-weight:700;color:var(--ink);
  }
  /* v11(figma-spec-13339-85452.md §2): 새 시안은 칩 높이 38→44, 가운데→좌측 정렬,
     navy 단색→회색 오버레이+아이콘으로 바뀌었다. Figma는 두 레벨 프레임이다
     (chipselectertab_group: padding 20 16 / Frame 2085668393: display:flex, gap:8,
     좌측 정렬). 그대로 두 레벨로 마크업을 나눈다: .rt-seg(패딩만 갖는 바깥 그룹) 안에
     .rt-seg-row(패딩 없는 실제 flex 줄, gap 8, role="tablist")를 두고 그 안에 칩
     (.rt-seg-tab) 두 개를 넣는다.
     v13(§v13-2, 13339:84831 4배 렌더 실측): 칩 높이가 44→40으로 다시 줄었다(v11의 44는
     오독이었다). 40은 HIG 44 미만이라 v10 방식의 투명 ::after 터치 확장을 되살렸다(아래
     .rt-seg-tab::after, 위아래 2px씩 = 44).
     v14(스펙 §A, B안): v13은 "아이콘은 선택된 칩에만"이라 렌더 시점에 <img> 자체를 넣었다
     뺐다 했는데, 그러면 탭을 바꿀 때마다 칩 폭이 24px씩 흔들렸다(아이콘 20+gap 6만큼).
     디자이너가 제안한 B안으로 바꾼다: 아이콘을 양쪽 칩에 항상 두되, 선택 칩은 유형과
     무관한 공통 체크 배지(CHIP_ICON_CHECK)를, 비선택 칩은 그 칩의 유형 아이콘을 45%
     불투명도로 보여준다(renderTypeTab 참고). 아이콘이 항상 있으므로 선택/비선택 padding도
     이제 같아야 폭이 고정된다(아래 .rt-seg-tab 공통 규칙, §A-2). .rt-seg는 이제 칩 줄뿐
     아니라 리드 문구까지 담는 세로 스택이라(§B, chipselectertab_group) flex-direction:
     column, gap:12를 추가한다(마크업도 #type-lead를 .rt-scroll에서 이 안으로 옮겼다,
     HTML/renderInput 참고). */
  .rt-seg{
    flex:0 0 auto;
    padding:20px 16px;
    box-sizing:border-box;
    display:flex;flex-direction:column;gap:12px;   /* §B: 칩 그룹 padding 20 16, 칩→리드 간격 12 */
  }
  .rt-seg-row{
    display:flex;gap:8px;
    justify-content:flex-start;   /* Figma 실측(§2): 좌측 정렬. 가운데 아님(v10까지는 가운데였다) */
    align-items:center;
  }
  .rt-seg-tab{
    appearance:none;cursor:pointer;
    border:none;   /* v11: 오버레이 배경(합성 hex)으로만 상태를 구분한다. 테두리 없음 */
    position:relative;   /* v13: 아래 ::after 터치 확장의 기준점 */
    flex:0 0 auto;
    height:40px;   /* v13(§v13-2): 44→40, 4배 렌더 실측 */
    border-radius:9999px;
    padding:0 14px 0 12px;   /* v14(§A-2, B안): 이제 양쪽 다 아이콘이 있어 선택/비선택 padding이
                                같다(아이콘 쪽 좌측이 2px 좁음). 다르면 탭 전환 시 폭이 흔들린다 */
    gap:6px;   /* v13: 아이콘-라벨 간격, 4배 렌더 실측(§v13-2) */
    box-sizing:border-box;
    display:flex;align-items:center;justify-content:flex-start;
    font-size:15px;line-height:22px;
    font-weight:500;   /* v13: 칩 공통, 선택/비선택 모두 Medium(스펙 §v13-2 "칩 공통") */
    background:#E8EBF0;   /* 비선택: #E6E9EF + 흰 8% 오버레이의 합성값(스펙 §2), 계산된 hex를 그대로 씀 */
    color:#384F85;   /* v13: 비선택 라벨(스펙 §v13-2). CHIP_LABEL_ACCENT로 셀프테스트 강조색 스캔에 등록됨 */
    /* v13: 아래로 뜨는 그림자 + 위 가장자리 밝음(4배 렌더 픽셀 실측, audit엔 안 잡힘) */
    box-shadow:0 2px 5px rgba(23,26,36,.20), inset 0 1px 0 rgba(255,255,255,.7);
  }
  /* v13: 시각 높이는 40이지만 HIG 최소 터치 타깃 44를 채워야 한다. v10 방식(투명 ::after,
     위아래로 확장)을 되살린다. 좌우는 칩 사이 gap(8)이 이미 있어 확장하지 않는다. */
  .rt-seg-tab::after{
    content:'';
    position:absolute;
    top:-2px; bottom:-2px; left:0; right:0;
  }
  .rt-seg-icon{
    width:20px;height:20px;flex:0 0 auto;display:block;
    opacity:1;
  }
  /* v14(§A-1, B안): 비선택 칩의 유형 아이콘은 45% 불투명도. 선택 칩(체크 배지)은 100%
     그대로 둔다(아래 aria-selected="true"는 별도 opacity 규칙이 없으므로 기본값 1). */
  .rt-seg-tab[aria-selected="false"] .rt-seg-icon{
    opacity:.45;
  }
  .rt-seg-tab[aria-selected="true"]{
    background:#D1D4DB;   /* 선택: #E6E9EF + 검정 10% 오버레이의 합성값(스펙 §2) */
    color:#19254D;   /* v13: 선택 라벨. --navy와 같은 값이라 강조색 스캔에 새로 안 걸린다 */
    /* v13: 위에서 안쪽으로 눌린 느낌 + 아래 가장자리 흰 하이라이트(4배 렌더 픽셀 실측) */
    box-shadow:inset 0 2px 8px rgba(23,26,36,.20), inset 0 -1px 0 rgba(255,255,255,.5);
  }
  /* v11(스펙 §3): 리드 문구가 칩 줄 바로 아래에서 카드 목록 맨 아래로 옮겨졌다. 문구도
     "~때 사용해요"로 바뀌었다(구 문구는 "~때"에서 끝났다).
     v14(스펙 §B): Figma가 리드 문구를 카드 아래에서 다시 칩 그룹 안, 칩 바로 아래로
     되돌렸다. 마크업도 .rt-scroll의 마지막 자식에서 .rt-seg(칩 그룹)의 마지막 자식으로
     옮긴다(HTML/renderInput 참고). 칩과의 간격은 이제 #type-lead 자신의 padding이 아니라
     부모 .rt-seg의 gap:12가 담당하므로 위아래 padding을 지운다(안 지우면 12+10=22가 되어
     실측과 어긋난다). */
  #type-lead{
    flex:0 0 auto;
    display:flex;align-items:center;gap:4px;
    box-sizing:border-box;
    font-size:14px;font-weight:400;line-height:20px;color:#556895;
    text-align:left;
    word-break:keep-all;
  }
  /* Figma 에셋 미확보(btn_info_detail), 임시로 원 안에 i를 그리는 인라인 SVG를 쓴다.
     currentColor. v14(스펙 §B): 아이콘 색만 #556895→#7282A6로 옅어졌다(텍스트는 #556895
     유지라 #type-lead 자체의 color는 안 바꾸고 svg에만 override한다). */
  #type-lead svg{
    width:16px;height:16px;flex:0 0 auto;display:block;color:#7282A6;
  }
  .rt-scroll{
    flex:1 1 auto;
    overflow-y:auto;
    padding:0 16px 16px;
    box-sizing:border-box;
    display:flex;
    flex-direction:column;
    gap:10px;   /* Figma 실측(§5 카드 컨테이너): 카드 사이 간격 10 (기존 20은 오차) */
  }
  .rt-card{
    background:var(--card-bg);
    border-radius:12px;
    padding:20px;
    box-sizing:border-box;
    cursor:pointer;
  }
  .rt-card[hidden]{display:none;}
  /* 펼침 상태(Figma §6/§7, 입력 화면 전용): 카드 자체는 padding:0 이고, Head/Container가
     각자 패딩을 갖는다(아래 #screen-input 스코프 규칙). is-open 클래스는 입력 화면 카드에만
     붙으므로(renderInput 참고) 스코프 없이도 안전하지만, 명확히 하기 위해 스코프를 남긴다. */
  #screen-input .rt-card.is-open{padding:0;}
  .rt-card-head{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:12px;
  }
  .rt-card-title{font-size:18px;font-weight:700;color:var(--ink);}
  /* Figma 실측(§6/§7 펼침 Head). .rt-card-head/.rt-card-title은 미리보기 화면
     (#screen-preview)의 "경로"/"요금" 카드 헤더와 이름을 공유해서, 기본 규칙(위)은 건드리지
     않고 #screen-input으로 스코프한 override만 따로 둔다. 안 그러면 미리보기 화면까지
     같이 바뀐다. */
  #screen-input .rt-card-head{
    display:flex;align-items:center;gap:12px;
    justify-content:flex-start;
    padding:20px 20px 16px 20px;
    margin-bottom:0;
    box-sizing:border-box;
  }
  /* 픽업/대절 시간 카드 펼침 머리(Figma §7 Frame 2085667123): 세로 스택, gap 4.
     새 클래스라 다른 화면과 이름이 겹치지 않는다(스코프 불필요). */
  /* #screen-input으로 스코프해 위 #screen-input .rt-card-head(gap:12)보다 명시도를 같게
     맞춘다. 스코프 없이 .rt-card-head--col만 쓰면 명시도가 낮아 gap:12에 밀려 4px로
     안 줄어든다(픽업/대절 카드 머리가 88이 아니라 96으로 커지는 원인이었다, v7에서 발견). */
  #screen-input .rt-card-head--col{
    flex-direction:column;align-items:flex-start;gap:4px;
  }
  #screen-input .rt-card-title{flex:1 1 auto;font-size:20px;font-weight:700;line-height:28px;color:#171A24;}
  /* 픽업/대절 시간 헤더 제목은 경로 헤더와 색이 다르다(Figma 실측: #262A38). 새 클래스. */
  .rt-card-title--ink2{color:#262A38;}
  .rt-card-head-value{font-size:14px;font-weight:400;line-height:20px;color:#262A38;}
  /* v10(항목 3): 대절 시간 카드 전용. Figma에 없는 요소라 기존 보조 텍스트 톤(예:
     #screen-input .rt-route-tag과 같은 13px/줄높이 20/#60667A)을 그대로 쓴다. 좌우 padding은
     카드 머리(.rt-card-head, 20 20 16 20)와 맞추고, 아래 여백은 작게 둬(.rt-wheel 자신의
     padding-top:40이 이미 큰 간격을 주므로 여기서 또 크게 벌리면 두 배로 벌어진다) 겹치지
     않게 조정했다. 카드 전체 높이가 늘어나는 건 의도된 트레이드오프다(설명 참고).
     픽업 시간 카드에는 붙지 않는다(charterWheelHtml에서만 렌더). */
  .rt-card-hint{
    display:flex;flex-direction:column;gap:2px;
    padding:0 20px 8px 20px;
    box-sizing:border-box;
    font-size:13px;font-weight:400;line-height:20px;color:#60667A;
    word-break:keep-all;
  }
  .rt-via-btn{
    appearance:none;cursor:pointer;background:transparent;
    border:none;border-radius:6px;
    display:flex;align-items:center;gap:4px;
    padding:8px 10px;
    box-sizing:border-box;
    font-size:13px;font-weight:700;line-height:20px;color:#383D4F;
  }
  /* 새 클래스(입력 화면 경로 카드 전용, §6 Container). 다른 화면과 이름이 겹치지 않는다. */
  .rt-route-container{
    display:flex;flex-direction:column;gap:10px;
    padding:0 20px 24px 20px;
    box-sizing:border-box;
  }
  .rt-route-row{
    display:flex;align-items:center;gap:12px;
    background:var(--input-bg);
    border-radius:8px;
    padding:20px 16px;
    box-sizing:border-box;
  }
  /* 미리보기 화면(#screen-preview)의 경로 행은 .rt-route-container로 감싸지 않아 이
     형제-간격 규칙으로 계속 떨어뜨린다. 입력 화면은 .rt-route-container의 gap:10이
     대신하므로, 거기서는 이 규칙이 걸리지 않게(중복 간격 방지) 아래에서 gap:0으로 되돌린다. */
  .rt-route-row + .rt-route-row{margin-top:12px;}
  .rt-route-container .rt-route-row + .rt-route-row{margin-top:0;}
  /* v13(Figma 실측 figma-spec-13208-17747.md §6 펼침): 경유지 행만 테두리가 있고 앞에
     번호 배지가 붙는다. 왕복 경로는 출발지와 도착지가 같아서 이 행이 없으면 카드가
     '강남역 -> 강남역'으로만 보인다. */
  #screen-input .rt-route-row-via{
    border:1px solid #EFEFF1;
  }
  #screen-input .rt-via-no{
    flex:0 0 auto;
    display:inline-flex;align-items:center;justify-content:center;
    width:18px;height:18px;
    background:#0063C5;
    border:1px solid var(--navy);
    border-radius:2px;
    box-sizing:border-box;
    font-size:12px;font-weight:700;line-height:1;color:#fff;
  }
  .rt-route-tag{
    flex:0 0 auto;
    width:36px;
    font-size:15px;color:var(--ink-sub);
  }
  .rt-route-text{
    flex:1 1 auto;
    font-size:16px;color:var(--ink);
    font-variant-numeric: tabular-nums;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  /* Figma 실측(§6 펼침 route_input 라벨/값). .rt-route-tag/.rt-route-text도 미리보기 화면의
     경로 행과 이름을 공유해서 #screen-input으로 스코프한다. */
  #screen-input .rt-route-tag{
    width:auto;
    font-size:14px;font-weight:400;line-height:20px;color:#60667A;
  }
  #screen-input .rt-route-text{
    font-size:15px;font-weight:400;line-height:22px;color:#000000;
  }
  .rt-route-summary{
    display:flex;align-items:center;gap:16px;
  }
  .rt-route-summary-label{
    flex:0 0 auto;font-size:15px;font-weight:500;line-height:22px;color:#60667A;
  }
  .rt-route-summary-text{
    flex:1 1 auto;
    font-size:15px;font-weight:500;line-height:22px;color:#262A38;
    text-align:right;
    font-variant-numeric: tabular-nums;
  }
  /* v10(항목 7): 접힌 카드 값의 공통 오버플로 안전장치. 값 영역이 약 232px, 15px 한글로 15자
     남짓이다. 실제 주소(예: "인천광역시 중구 공항로 272 제2여객터미널")는 반드시 넘친다.
     우측 정렬 + 그냥 오버플로면 목적지가 잘린다(중요한 쪽이 사라진다). 그래서 경로 카드는
     넘칠 때 JS(fitRouteSummaryValue)가 도착지만 남기고, 그래도 넘치면 끝(건물명 등 식별
     정보가 대개 여기 있다)이 아니라 앞을 잘라 "…"을 붙인다. 여기 있는 CSS
     text-overflow:ellipsis는 그 JS가 못 미더울 때(예: 폰트 로드 전 측정)를 위한 안전장치일
     뿐이라 끝을 자른다(정상 경로에서는 JS가 이미 안 넘치게 만들어 두므로 걸리지 않는다).
     픽업/대절 카드
     (.rt-line-value)는 값이 짧아 실제로는 안 걸리지만 같은 안전장치를 걸어 둔다.
     min-width:0이 없으면 flex item이 텍스트의 min-content 폭(줄바꿈 없이 전체 폭)만큼
     늘어나 ellipsis가 무력화된다. */
  .rt-card-value{
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;
  }
  .rt-line-card{
    display:flex;align-items:center;
    gap:16px;
  }
  .rt-line-label{flex:0 0 auto;font-size:15px;font-weight:500;line-height:22px;color:#60667A;}
  .rt-line-value{flex:1 1 auto;text-align:right;font-size:15px;font-weight:500;line-height:22px;color:#262A38;font-variant-numeric: tabular-nums;}
  .rt-line-value.is-placeholder{color:var(--ink-sub);font-weight:500;}

  @keyframes rt-card-enter{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
  }
  .rt-card.rt-enter{animation: rt-card-enter .3s ease-out;}

  /* v11(figma-spec-13339-85452.md §4): AI 어시스트 라인(#assist)과 인라인 넛지 카드(#nudge)를
     전부 걷어내고, 입력 화면 위에 덮이는 전체 화면 오버레이 브리지(#bridge)로 대체한다.
     어시스트는 폐기 확정(Figma에도 0건, 사용자 확인 완료)이고, 넛지는 스크롤 안에 있어
     유저가 스크롤하지 않으면 안 보일 수 있었던 문제를 브리지(전체 화면 확인)로 해소한다.
     judgeNudge()의 판정 로직·반환값({dir,reason})은 그대로 두고(§2 JUDGE, 절대 안 건드림),
     이 블록은 그 결과를 "전체 화면으로 어떻게 보여주는가"만 바꾼다(openBridge/closeBridge,
     JS RENDER 섹션 참고). #phone은 이미 position:relative, overflow:hidden이라 #bridge를
     그 안에서 absolute inset:0으로 덮으면 프레임 밖으로 새지 않는다. */
  #bridge{
    position:absolute;
    inset:0;
    z-index:15;   /* .rt-sheet(10)/.rt-sheet-backdrop(9)보다 위. 두 오버레이가 겹칠 일은
                     없지만(바텀시트는 되돌리기용 코드로만 남았다) 방어적으로 더 높게 둔다 */
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    /* 스펙 실측: 위쪽 rgba(255,255,255,.506) → 50%(원본 프레임 380/760) 지점부터 순백.
       %를 쓰면 이 프로토의 실제 프레임 높이(800)에도 비례해 그대로 맞는다. */
    background:linear-gradient(to bottom, rgba(255,255,255,.506) 0%, #FFFFFF 50%);
    box-sizing:border-box;
  }
  /* display:flex가 hidden 속성의 기본 display:none을 덮어쓴다. 이걸 빼먹으면 브리지가 안 뜰
     때도(judgeNudge가 null인 경우) 빈 흰 판이 남는 회귀가 난다
     (전에 겪은 버그, v11 지시사항에도 명시). */
  #bridge[hidden]{display:none;}
  .rt-bridge-body{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:24px;
    padding:0 24px 200px;
    box-sizing:border-box;
  }
  #bridge-illust{
    width:120px;height:120px;
    object-fit:contain;
    display:block;
  }
  .rt-bridge-text{
    display:flex;flex-direction:column;gap:8px;
    align-self:stretch;   /* 부모(.rt-bridge-body)의 align-items:center를 이 자식만 stretch로
                             되돌려, 제목/본문이 일러스트처럼 hug폭이 아니라 카드 폭(312)을
                             채우게 한다. 그래야 word-break:keep-all이 실제로 줄바꿈을 한다 */
  }
  #bridge-title{
    margin:0;
    font-size:22px;font-weight:700;line-height:30px;color:#19254D;
    text-align:center;
    word-break:keep-all;
    /* v14(스펙 §D): 개행 위치가 바뀌었다(왕복/시외 "왕복이라면 시간대절이 ⏎ 더 편해요", 짧은 경로
       "{h}분이면 도착하는 ⏎ 경로예요"). U+2028/\n은 이 파일 규칙상 금지라 max-width로 그
       지점에서 word-break:keep-all이 접히게 한다(openBridge가 사유별 값을 인라인
       style.maxWidth로 준다, JS RENDER 참고). align-self:center로 줄어든 박스를 가운데에
       놓는다(부모 .rt-bridge-text는 align-items 기본값이 없어 stretch라 안 하면 312 폭을
       그대로 채워 접히지 않는다). */
    align-self:center;
  }
  #bridge-desc{
    margin:0;
    font-size:15px;font-weight:400;line-height:22px;color:#31487D;
    text-align:center;
    word-break:keep-all;
  }
  /* v14(스펙 §E): 짧은 경로 본문에서 "일반예약" 넉 자만 강조(#0086EA, inspect.js range override
     실측). 왕복/시외 본문에는 강조 span이 없다(COPY['round-trip']에 bodyHtml 필드 자체가 없다,
     openBridge 참고). */
  #bridge-desc span{color:#0086EA;}
  .rt-bridge-actions{
    display:flex;flex-direction:column;gap:10px;
    padding:20px 24px;
    box-sizing:border-box;
  }
  .rt-bridge-actions button{
    appearance:none;border:none;cursor:pointer;
    border-radius:4px;
    padding:14px 18px;
    font-size:16px;font-weight:700;
    height:52px;
    box-sizing:border-box;
    width:100%;
    font-variant-numeric: tabular-nums;
  }
  /* 버튼 위계는 스타일이 고정이고(주=navy, 보조=회색) 라벨·동작만 방향마다 뒤집힌다
     (openBridge 참고). 짧은 경로에서는 navy 버튼이 "이대로 계속하기"다. 헷갈리기
     쉬우니 주의(스펙 §4 "가장 중요"). */
  #bridge-primary{
    background:#19254D;
    color:#FFFFFF;
  }
  #bridge-secondary{
    background:#E6E9EF;
    color:#283873;
  }

  .rt-footer{
    flex:0 0 auto;
    box-sizing:border-box;
    display:flex;
    flex-direction:column;
  }
  /* Figma 실측(§9 reserv_button_group, 구판): padding 10 24 20 24. 버튼은 그 안을 채우므로
     폭 360 기준 x 24..336, 즉 312다. 카드(328, 좌우 16)보다 좁다. 좌우를 16으로 두면
     버튼이 카드와 같은 폭이 돼 Figma와 16px 어긋난다.
     v14(스펙 §C): 위 실측은 미리보기 화면(#screen-preview, #preview-cta)에는 그대로
     맞지만, 입력 화면(reserv_button_group, TADA-9913/9915 개편)은 padding이 10 24 20 24→
     20(네 방향 모두), CTA 폭이 312→320으로 바뀌었다. .rt-footer/.rt-cta는 두 화면이
     공유하는 클래스라 여기서 값을 바꾸면 미리보기 화면까지 같이 바뀌므로(건드리지 말 것
     대상), 기본 규칙은 그대로 두고 #screen-input 스코프 override(아래)만 새로 둔다. */
  .rt-footer > .rt-cta{
    display:block;
    width:calc(100% - 48px);
    margin:10px 24px 20px 24px;
  }
  /* v14(스펙 §C, 입력 화면 전용): padding 20(네 방향), CTA 폭 320(x 20..339.5). 카드(328)보다
     좁다는 관계는 유지된다(320 < 328). 배경은 단색(#E6E9EF)에서 위가 투명·아래가 #E6E9EF인
     세로 그라데이션으로 바뀌었다(스크롤 콘텐츠가 CTA 뒤로 지나갈 때 페이드시키는 용도). */
  #screen-input .rt-footer{
    padding:20px;
    background:linear-gradient(to bottom, rgba(230,233,239,0), rgba(230,233,239,1));
  }
  #screen-input .rt-footer > .rt-cta{
    width:100%;
    margin:0;
  }
  .rt-cta{
    width:100%;
    appearance:none;border:none;cursor:pointer;
    background:var(--navy);
    color:#ffffff;
    border-radius:4px;
    padding:14px 18px;
    font-size:17px;font-weight:700;
    box-sizing:border-box;
    font-variant-numeric: tabular-nums;
  }
  .rt-cta:disabled{opacity:.6;cursor:default;}
  /* Figma 실측(§9 reserv_button_group): 하단 CTA는 16 Bold, 높이 52(14+24+14). 기존 17px는
     오차였다. .rt-cta는 미리보기 화면(#preview-cta)과도 공유하는 클래스라 여기서 바꾸지
     않고 입력 화면 버튼(#cta)에만 스코프한다. */
  #cta{font-size:16px;line-height:24px;}
  .rt-icon-back{width:24px;height:24px;display:block;}
  .rt-icon-add{width:16px;height:16px;display:block;}
  .rt-icon-arrow{width:18px;height:18px;flex:0 0 auto;display:block;}

  /* ---- 왕복/시외 바텀시트 (Task 4): 일반예약 → 시간대절, "위험" 확인용 ---- */
  .rt-sheet-backdrop{
    position:absolute;
    inset:0;
    background:rgba(23,26,36,.4);
    z-index:9;
  }
  .rt-sheet-backdrop[hidden]{display:none;}
  .rt-sheet{
    position:absolute;
    left:0;right:0;bottom:0;
    background:var(--card-bg);
    border-radius:16px 16px 0 0;
    padding:24px 20px 20px;
    box-sizing:border-box;
    box-shadow:0 -8px 30px rgba(0,0,0,.18);
    z-index:10;
  }
  .rt-sheet[hidden]{display:none;}
  .rt-sheet-title{font-size:18px;font-weight:700;color:var(--ink);}
  .rt-sheet-body{
    font-size:15px;line-height:1.5;color:var(--ink);
    margin-top:8px;
    white-space:pre-line; /* textContent의 \n을 줄바꿈으로 보여준다(<br> 대신) */
  }
  .rt-sheet-actions{
    display:flex;flex-direction:column;gap:8px;
    margin-top:20px;
  }
  .rt-sheet-btn{
    appearance:none;border:none;cursor:pointer;
    border-radius:4px;
    padding:14px 18px;
    font-size:16px;font-weight:700;
    box-sizing:border-box;
    width:100%;
    font-variant-numeric: tabular-nums;
  }
  .rt-sheet-btn-primary{
    background:var(--navy);
    color:#ffffff;
  }
  .rt-sheet-btn-ghost{
    background:transparent;
    color:var(--ink-sub);
  }

  /* ---- 픽업 시간 / 대절 시간 휠 피커 (Task 5, Task 2에서 이관) ---- */
  .rt-wheel{
    /* 이 세 값은 JS 상수(WHEEL_ROW_H / WHEEL_PAD)와 같은 값이어야 한다. 따로 적어 두면
       한쪽만 고쳤을 때 밴드가 선택 행에서 어긋난다. 셀프테스트가 둘을 대조한다
       ('휠 선택 밴드가 JS 상수와 어긋나지 않는다'). */
    --wheel-row-h:44px;   /* = WHEEL_ROW_H */
    --wheel-pad:44px;     /* = WHEEL_PAD, (WHEEL_VISIBLE - WHEEL_ROW_H) / 2 */
    --wheel-inset:40px;   /* Figma 실측 §7: .rt-wheel padding-top */
    display:flex;
    gap:12px;
    padding:var(--wheel-inset) 24px;
    box-sizing:border-box;
    position:relative;   /* v8: 열 뒤에 깔리는 선택 밴드(.rt-wheel-band)의 포지셔닝 기준 */
  }
  /* v8(Figma 실측 §7 "선택 행 래퍼"): 선택 표시가 열마다 따로 칠해지면(.rt-wheel-item.is-selected의
     background) 열 사이 gap(12px)에 흰 틈이 보인다. Figma 원본은 행 전체가 하나의 밴드다. 이
     프로토의 휠은 열마다 따로 스크롤되는 구조라(각 .rt-wheel-col이 독립 overflow-y:auto) 밴드를
     열 "안"에 둘 수 없다. 대신 열들 뒤에 깔린 한 장짜리 배경 레이어로 만든다. 위치는 순수
     정적 값이다: top = --wheel-inset(.rt-wheel padding-top) + --wheel-pad(열 안 보이는 영역에서
     선택 행까지의 오프셋) = 84. absolute 자식의 기준은
     조상의 padding box라 .rt-wheel 자신의 padding은 이 84 계산에 이미 포함해야 한다(top:0이면
     padding을 무시하고 테두리 바로 안쪽에 붙는다). 휠 스크롤 로직(_wheelProgramTarget 등)은
     전혀 건드리지 않는다. 이 레이어는 순수 배경이고 pointer-events:none이라 클릭을 가로채지
     않는다. */
  .rt-wheel-band{
    position:absolute;
    left:24px; right:24px;
    top:calc(var(--wheel-inset) + var(--wheel-pad));
    height:var(--wheel-row-h);
    background:var(--wheel-band-bg);
    border-radius:4px;
    pointer-events:none;
    z-index:0;
  }
  .rt-wheel-col{
    flex:1 1 0;
    height:132px;   /* Figma 실측(§7): 행 44 x 3, 나머지는 위아래 padding(44)으로 흰 페이드 */
    overflow-y:auto;
    overflow-x:hidden;
    scroll-snap-type:y mandatory;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    position:relative;   /* v8: 밴드(z-index:0)보다 위에 그려지도록 자체 스태킹 컨텍스트를 만든다 */
    z-index:1;
    background:transparent;   /* Figma 실측: 열 자체는 배경 없음. 밴드가 뒤에서 보인다 */
  }
  .rt-wheel-col.is-wide{flex:1.6 1 0;}
  .rt-wheel-col::-webkit-scrollbar{display:none;}
  .rt-wheel-pad{height:44px;}
  .rt-wheel-item{
    height:44px;
    display:flex;align-items:center;justify-content:center;
    text-align:center;
    font-size:16px;font-weight:400;color:#7282A6;
    line-height:24px;
    font-variant-numeric:tabular-nums;
    scroll-snap-align:center;
    cursor:pointer;
    border-radius:4px;
    box-sizing:border-box;
    padding:10px 2px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
  }
  .rt-wheel-item.is-selected{
    /* v8: background 제거. 선택 표시는 이제 .rt-wheel-band(열 뒤 한 장 배경)가 맡는다.
       글자색·굵기는 그대로 열 안(아이템)에 남는다. */
    color:var(--wheel-band-ink);
    font-weight:500;   /* Medium, Figma 실측 */
  }
  /* ---- 차종 선택 브리지 (Task 6): Figma 2x 렌더 이미지 + 투명 히트 영역 ---- */
  .rt-vehicle-screen{background:#ffffff;}
  .rt-vehicle-scroll{
    flex:1 1 auto;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    position:relative;  /* Task 9: 뒤로가기 히트 영역을 렌더 이미지 위, 스크롤과 함께 움직이도록 얹는다 */
  }
  .rt-vehicle-img{display:block;width:100%;height:auto;}
  /* Task 9: 렌더 이미지(720×1480, 2x) 맨 위에 이미 그려진 뒤로가기 화살표 위에 얹는 히트 영역.
     원본 픽셀 좌표(≈44~75, 111~140)를 1x(÷2)로 환산해 여유를 두고 잡았다.
     좌표는 어림짐작이 아니라 scratchpad에서 이미지를 직접 열어 실측했다. */
  .rt-vehicle-back{
    appearance:none;border:none;background:transparent;padding:0;margin:0;cursor:pointer;
    position:absolute;
    left:8px;top:40px;width:44px;height:44px;
  }
  .rt-vehicle-footer{
    flex:0 0 auto;
    position:relative;
  }
  .rt-vehicle-hit{
    appearance:none;border:none;background:transparent;padding:0;margin:0;cursor:pointer;
    position:absolute;
    left:206px;top:48px;width:140px;height:62px;
  }

  /* ---- 미리보기(예약 신청) 화면 (Task 6) ---- */
  .rt-preview-head{padding:4px 0 0;}
  .rt-preview-title{font-size:22px;font-weight:700;color:var(--ink);}
  .rt-preview-sub{
    font-size:15px;color:var(--ink-sub);margin-top:8px;
    font-variant-numeric:tabular-nums;
  }
  .rt-chip-row{
    flex:0 0 auto;
    display:flex;gap:6px;
  }
  .rt-chip{
    background:var(--input-bg);color:var(--ink-sub);
    font-size:13px;font-weight:700;
    padding:6px 12px;border-radius:999px;
    white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  .rt-fare-row{
    display:flex;align-items:center;justify-content:space-between;
    font-size:15px;color:var(--ink);
    padding:4px 0;
    font-variant-numeric:tabular-nums;
  }
  .rt-fare-total{
    font-size:17px;font-weight:700;
    margin-top:8px;padding-top:12px;
    border-top:1px solid var(--input-bg);
  }
  .rt-preview-switch{
    font-size:14px;color:var(--ink-sub);text-align:center;
    padding:4px 0 8px;cursor:pointer;
    font-variant-numeric:tabular-nums;
  }
  .rt-preview-switch[hidden]{display:none;}

  /* ---- 하네스: 설정 패널 (Task 7). 폰 프레임 바깥, 기획자·디자이너용.
     시간&경로 입력 화면(폰 안)의 .rt-seg/.rt-seg-tab과는 별개 이름공간이다. ---- */
  .page{
    min-height:100vh;
    box-sizing:border-box;
    padding-top:58px;
  }
  .topbar{
    position:fixed;
    top:0;left:0;right:0;
    height:58px;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 20px;
    box-sizing:border-box;
    background:#ffffff;
    border-bottom:1px solid #E0E3E9;
    z-index:50;
  }
  .topbar-title{
    font-size:15px;font-weight:700;color:var(--ink);
  }
  .topbar-gear{
    appearance:none;cursor:pointer;
    border:1px solid #D8DCE4;background:#ffffff;
    border-radius:8px;
    padding:8px 14px;
    font-size:13px;font-weight:700;color:var(--ink);
  }
  .topbar-gear.is-active{
    border-color:var(--navy);color:var(--navy);background:#EEF1F8;
  }
  .panel{
    position:fixed;
    top:66px;right:20px;
    width:360px;max-width:calc(100vw - 40px);
    background:var(--card-bg);
    border:1px solid #E0E3E9;
    border-radius:12px;
    box-shadow:0 8px 30px rgba(0,0,0,.18);
    padding:16px;
    box-sizing:border-box;
    z-index:60;
    max-height:calc(100vh - 82px);
    overflow-y:auto;
  }
  .panel[hidden]{display:none;}
  .panel-head{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:8px;
  }
  .panel-head-title{font-size:15px;font-weight:700;color:var(--ink);}
  .panel-close{
    appearance:none;border:none;background:transparent;cursor:pointer;
    width:24px;height:24px;padding:0;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;color:var(--ink-sub);
  }
  .panel-row{
    display:flex;align-items:flex-start;gap:10px;
    padding:10px 0;
    box-sizing:border-box;
  }
  .panel-row + .panel-row{border-top:1px solid #EEF0F3;}
  .panel-label{
    flex:0 0 58px;
    font-size:13px;font-weight:700;color:var(--ink-sub);
    padding-top:7px;
    box-sizing:border-box;
  }
  /* 시나리오가 6개라 한 알약 안에 넣으면 줄바꿈에서 깨진다.
     여기서는 알약(.rt-seg)을 쓰지 않고 버튼마다 테두리를 주는 칩 묶음으로 만든다. */
  .panel-chips{
    flex:1 1 auto;
    display:flex;flex-wrap:wrap;gap:6px;
  }
  .panel-chip{
    appearance:none;cursor:pointer;
    border:1px solid #D8DCE4;background:#ffffff;
    border-radius:8px;
    padding:7px 12px;
    font-size:13px;font-weight:600;color:var(--ink);
    white-space:nowrap;
  }
  .panel-chip.is-active{
    border-color:var(--navy);color:var(--navy);
    background:#EEF1F8;font-weight:700;
  }
  .panel-reset{
    display:inline-block;
    margin-top:12px;
    font-size:13px;font-weight:700;
    color:var(--ink-sub);
    text-decoration:underline;
  }
  @media (max-width:720px){
    .page{
      padding-top:50px;
      padding-left:6px;padding-right:6px;
    }
    .topbar{height:50px;padding:0 6px;}
    .panel{
      top:auto;left:0;right:0;bottom:0;
      width:auto;max-width:none;
      border-radius:16px 16px 0 0;
      max-height:60vh;
    }
  }
</style>
</head>
<body>

<div class="page">
  <div class="topbar">
    <div class="topbar-title">예약 유형 오선택 교정</div>
    <button type="button" class="topbar-gear" id="gear">⚙ 설정</button>
  </div>

  <!-- 설정 패널(Task 7): 시나리오·시작 탭만 다룬다.
       경유지, 탄력요금, 요청사항은 없다.
       즉시 반영이라 적용/취소 버튼이 없다. 되돌리기는 아래 '처음으로' 링크가 맡는다. -->
  <div id="panel" class="panel" hidden>
    <div class="panel-head">
      <div class="panel-head-title">설정</div>
      <button type="button" class="panel-close" id="panel-close" aria-label="닫기">✕</button>
    </div>
    <div class="panel-row">
      <div class="panel-label">시나리오</div>
      <div class="panel-chips" id="panel-scenarios"><!-- SCENARIOS에서 JS로 채운다 --></div>
    </div>
    <div class="panel-row">
      <div class="panel-label">시작 탭</div>
      <div class="panel-chips" id="panel-types">
        <button type="button" class="panel-chip" data-type="normal">일반예약</button>
        <button type="button" class="panel-chip" data-type="charter">시간대절</button>
      </div>
    </div>
    <a class="panel-reset" href="?">처음으로</a>
  </div>

<div class="rt-stage">
  <div id="phone" class="rt-phone">
    <div id="screen-input" class="rt-screen">
      <div class="rt-appbar">
        <!-- Task 9: 이 프로토의 첫 화면이라 뒤로 갈 곳이 없다. disabled로 두고 흐리게 보여준다. -->
        <button type="button" class="rt-iconbtn" id="btn-back" aria-label="뒤로" disabled><svg class="rt-icon-back" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M29.6575 52.0003L50.829 73.1719L45.1722 78.8287L14.3438 48.0003L45.1722 17.1719L50.829 22.8287L29.6575 44.0003L80.0006 44.0003V52.0003L29.6575 52.0003Z" fill="black"/></svg></button>
        <div class="rt-appbar-title">예약하기</div>
      </div>

      <!-- v11(스펙 §2): 두 레벨 구조. .rt-seg는 패딩만 갖는 바깥 그룹, .rt-seg-row가 실제
           flex 줄(gap 8, 좌측 정렬, role=tablist)이다. 칩(.rt-seg-tab) 안 아이콘은 유형에
           고정(스펙 §7: Figma는 선택 상태를 따라 스왑하지만 그러면 탭할 때마다 아이콘이
           자리를 바꿔 유형을 식별할 수 없다. renderTypeTab이 버튼별로 고정 아이콘을 준다).
           v14(스펙 §A/B, B안): 아이콘은 다시 두 칩 모두에 항상 있다(선택=체크 배지 공통,
           비선택=유형 아이콘 45%, renderTypeTab이 매 렌더마다 src와 aria-selected만 갱신,
           <img> 자체는 첫 렌더 이후 계속 남는다). 여기 남는 건 항상 있는 라벨(span)뿐이다.
           또한 리드 문구(#type-lead)가 카드 목록 밖, 이 칩 그룹 안으로 다시 들어와 칩 줄
           바로 아래 마지막 자식으로 붙는다(renderInput이 내용만 채우고 DOM 위치는 안
           옮긴다. §B, v11 당시 .rt-scroll 맨 뒤로 옮겼던 걸 되돌린 것). -->
      <div class="rt-seg">
        <div class="rt-seg-row" role="tablist">
          <button type="button" id="seg-normal" class="rt-seg-tab" role="tab" aria-selected="true">
            <span class="rt-seg-label"></span>
          </button>
          <button type="button" id="seg-charter" class="rt-seg-tab" role="tab" aria-selected="false">
            <span class="rt-seg-label"></span>
          </button>
        </div>
        <div id="type-lead"></div>
      </div>

      <div class="rt-scroll">
        <div class="rt-card" id="card-route"></div>
        <div class="rt-card" id="card-pickup"></div>
        <div class="rt-card" id="card-charter" hidden></div>
      </div>

      <div class="rt-footer">
        <button type="button" id="cta" class="rt-cta"></button>
      </div>
    </div>

    <!-- ---- v11(스펙 §4): 브리지. 입력 화면 위에 덮이는 전체 화면 오버레이라 #screen-input
         안이 아니라 #phone의 직접 자식으로 둔다(#bridge는 absolute inset:0, CSS 참고).
         '설정 완료'를 누르면 openBridge()가 내용을 채우고 hidden을 푼다(RENDER 섹션 참고). ---- -->
    <div id="bridge" hidden>
      <div class="rt-bridge-body">
        <img id="bridge-illust" alt="">
        <div class="rt-bridge-text">
          <h2 id="bridge-title"></h2>
          <p id="bridge-desc"></p>
        </div>
      </div>
      <div class="rt-bridge-actions">
        <button type="button" id="bridge-primary"></button>
        <button type="button" id="bridge-secondary"></button>
      </div>
    </div>

    <!-- ---- Task 6: 차종 선택 브리지. 이번 안이 손대지 않는 화면이라 Figma 2x 렌더(nodeId 48558:155628)를
         깔고 투명한 히트 영역 하나만 얹는다. 렌더는 스크롤 본문/고정 푸터 두 장으로 나눠 실제 앱처럼
         "다음" 버튼이 항상 화면 하단에 보이게 했다(원본 프레임 높이가 360×868이라 800 프레임을 넘긴다). ---- -->

<script>
/* ==========================================================
   reservation-type.html · 예약 유형 오선택 교정 프로토타입
   섹션 순서: 1. STATE  2. JUDGE  3. ACTIONS  4. RENDER  5. HARNESS  6. SELFTEST
   1~3은 DOM을 만지지 않는 순수 로직.
   ========================================================== */

/* ---- 1. STATE ---- */
const MIN_CHARTER_HOURS = 1;   // 확인 필요 항목(스펙 §9). 확정되면 이 값만 바꾼다.

// route: 시나리오마다 출발/목적지를 다르게 둔다(수정 1). 전에는 fresh()가 route를 고정값으로
// 만들어 시나리오와 무관하게 화면에 항상 "인천공항 제 1터미널"이 떴다. golf/longDistance
// 시나리오가 공항 도착 화면에 골프장·장거리 카피를 띄우는 모순을 만들었다(스펙 §2 비목표:
// "공항 이동은 건드리지 않는다"). short는 "48분이면 갈 경로에 3시간 대절을 잡은 상황"을
// 노리는 시나리오라 공항처럼 먼 목적지가 아니라 normal과 같은 짧은 시내 이동 경로를 쓴다.
// 공항 목적지는 airport 시나리오에만 남는다. 아래 SELFTEST의
// '전환 · 시간대절에서 일반예약으로' 테스트는 지명 리터럴이 아니라 전환 전/후 값을 비교해
// "경로가 유지되는가"만 검사하므로 시나리오의 실제 지명이 바뀌어도 영향받지 않는다.
// v13(§v13-1): '복귀 불가 지역'(noReturn) 시나리오는 지운다. Figma에서 해당 variant·노드가
// 통째로 삭제됐고, 사용자 확정으로 복귀 불가 지역은 더 이상 트리거가 아니다(judgeNudge 참고).
// 대신 '왕복 경로'(roundTrip)를 새로 넣는다: 출발지=도착지 + 경유지 1개 이상인 경로다
// (13424:98112 실측: 강남역 2번 출구 → 남서울컨트리클럽 경유 → 강남역 2번 출구).
// flags에서 noReturnCall 키 자체도 지웠다(모든 시나리오가 영원히 false만 갖던 죽은 값이라
// 남겨 둘 이유가 없다. v13 보고서 참고).
const SCENARIOS = {
  normal:        { label:'정상',            etaMin:48, charterHours:1, flags:{airport:false,golf:false,longDistance:false},
                   route:{ from:'강남역 2번 출구', to:'광화문광장' } },
  short:         { label:'짧은 경로',        etaMin:48, charterHours:3, flags:{airport:false,golf:false,longDistance:false},
                   route:{ from:'강남역 2번 출구', to:'광화문광장' } },
  golf:          { label:'골프장 (수도권 밖)', etaMin:95, charterHours:3, flags:{airport:false,golf:true, longDistance:true },
                   route:{ from:'강남역 2번 출구', to:'제주 블랙스톤' } },
  golfMetro:     { label:'골프장 (수도권 안)', etaMin:65, charterHours:3, flags:{airport:false,golf:true, longDistance:false},
                   route:{ from:'강남역 2번 출구', to:'남서울컨트리클럽' } },
  roundTrip:     { label:'왕복 경로',        etaMin:65, charterHours:3, flags:{airport:false,golf:false,longDistance:false},
                   route:{ from:'강남역 2번 출구', to:'강남역 2번 출구', vias:['남서울컨트리클럽'] } },
  longDistance:  { label:'장거리',           etaMin:95, charterHours:3, flags:{airport:false,golf:false,longDistance:true },
                   route:{ from:'강남역 2번 출구', to:'부산 해운대해수욕장' } },
  airport:       { label:'공항 (넛지 없음)', etaMin:70, charterHours:3, flags:{airport:true, golf:false,longDistance:true },
                   route:{ from:'신세계백화점 강남점 정문', to:'인천공항 제 1터미널' } },
};

function fresh(scenarioKey, type){
  const sc = SCENARIOS[scenarioKey];
  return {
    scenario: scenarioKey,
    type: type || 'normal',          // 'normal' | 'charter'
    // v13: roundTrip처럼 시나리오가 vias를 미리 정해 둘 수 있다(경유지가 있어야 왕복으로
    // 판정된다, isRoundTrip 참고). 없으면 기존처럼 빈 배열. 배열을 복사해서 넣는다
    // (SCENARIOS의 원본 배열을 공유하면, 한 테스트가 S.route.vias를 옆으로 밀어 넣거나
    // 지운 게 다음 테스트의 시나리오 데이터까지 오염시킬 수 있다).
    route: { from:sc.route.from, to:sc.route.to, vias: sc.route.vias ? [...sc.route.vias] : [] },
    pickupAt: null,                  // Date | null
    charterHours: null,              // number | null  (charter에서 '설정 완료' 후에만 채워짐)
    charterHoursPreset: sc.charterHours,
    etaMin: sc.etaMin,
    flags: { ...sc.flags },
    convertedTo: null,               // 'normal' | 'charter' | null  (왕복 방지)
    screen: 'input',                 // 'input' | 'vehicle' | 'preview'
    openCard: null,                  // null | 'none' | 'route' | 'pickup' | 'charter'  (아코디언: 하나만 열림)
                                      // null=아직 안 고름(기본값, renderInput에서 'route'로 취급),
                                      // 'none'=명시적으로 모두 접힘(수정 4, 스펙 §5.4)
  };
}

// 기본 시작 상태는 중립이다. 시나리오와 시작 탭 선택은 설정 패널(Task 7)이 소유한다.
let S = fresh('normal', 'normal');

// 순수 함수: location.search 를 읽지 않고 URLSearchParams만 받는다. DOM을 만지지 않는다.
// 알 수 없는 값이 오면 조용히 중립(normal/normal)으로 떨어진다.
function stateFromQuery(params){
  const scenario = params.get('scenario');
  const type = params.get('type');
  return {
    scenario: Object.prototype.hasOwnProperty.call(SCENARIOS, scenario) ? scenario : 'normal',
    type: (type === 'normal' || type === 'charter') ? type : 'normal',
  };
}

/* ---- 2. JUDGE ---- */
// v13(§v13-1): 왕복 판정. 출발지와 도착지가 같고 경유지가 1개 이상이면 왕복 경로다
// (13424:98112 실측: 강남역 2번 출구 → 남서울컨트리클럽 경유 → 강남역 2번 출구).
// judgeNudge와 셀프테스트가 함께 부르므로 전역에 둔다.
// PRD(2026-09-23 요구 사항 1)는 왕복을 "출발지 = 도착지"로만 쓴다. 경유지 1개 이상은 이 프로토가
// 더 좁게 잡은 것이다(출발지=도착지인데 경유지가 없으면 제자리 예약이라 판정할 값이 없다).
// 핸드오프에 "PRD 에 없는 조건"으로 표시해 뒀다. 확정되면 여기만 고치면 된다.
function isRoundTrip(s){
  return !!s.route.to && !!s.route.from
      && s.route.to === s.route.from
      && s.route.vias.length > 0;
}
function judgeNudge(s){
  if (s.flags.airport) return null;              // 공항은 양방향 모두 제외
  if (s.convertedTo && s.convertedTo === s.type) return null;  // 왕복 방지
  // 수정 7: 경로 미입력 가드는 원래 normal 분기에만 있어, charter + charterHours=3 +
  // route.to=null이면 charter 분기를 그대로 통과해 short-trip을 반환했다(이 프로토에서는
  // 도달 불가한 조합이지만 judgeNudge는 스펙 §6 "경로 미입력 상태 → 두 방향 모두 판정 불가"의
  // 실행형이라 개발자가 그대로 옮겨 갈 코드다). 공항 가드·왕복 방지 가드 다음, 분기 갈림 전으로
  // 끌어올려 두 방향 모두에 적용되게 한다.
  if (!s.route.to) return null;                  // 경로 미입력 = 두 방향 모두 판정 불가
  if (s.type === 'charter'){
    if (s.charterHours == null) return null;     // 대절 시간 미입력 = 판정 불가
    if (s.route.vias.length > 0) return null;
    // PRD(2026-09-23 요구 사항 2)에는 최소 대절 시간 조건이 없다. 이것도 프로토가 더 좁게 잡은
    // 것이라 핸드오프에 확인 필요로 올려 뒀다.
    if (s.charterHours <= MIN_CHARTER_HOURS) return null;
    if (s.etaMin < s.charterHours * 60 * 0.5) return { dir:'to-normal', reason:'short-trip' };
    return null;
  }
  // v15(2026-09-23 PRD): 일반예약 -> 시간대절 트리거는 왕복과 시외 둘뿐이다. 2026-09-23 개정에서
  // 요구 사항 절이 다시 쓰이면서 골프장, 목적지가 타다가 잡히지 않는 지역, 경유지 2개 이상은
  // 요구 사항에서 빠지고 킥오프 메모에 취소선으로만 남았다. 그래서 flags.golf 는 판정에서 읽지 않는다.
  // 같은 개정에서 수도권의 기준이 "수도권(srt)"로 명시됐다. 다만 SRT 노선 기준인지 정차역 기준인지,
  // 어느 역까지 포함하는지는 여전히 없어서 longDistance 는 시나리오 플래그로 둔다.
  // 수도권 밖 골프장은 longDistance 로 걸리고(golf 시나리오), 수도권 안 골프장은
  // 걸리지 않는다(golfMetro 시나리오). 후자가 의도인지는 PRD 확인 필요 항목이다.
  // flags.golf 는 대절 시간 카드의 권장 시간 힌트에만 남아 있다(판정과 무관).
  if (s.flags.longDistance || isRoundTrip(s))
    return { dir:'to-charter', reason:'round-trip' };
  return null;
}

// v11: judgeSignature()는 AI 어시스트 상태기계(renderAssist) 전용이었다. 어시스트가 폐기
// 확정(Figma에도 0건)되며 그 유일한 호출자가 사라져 이 함수도 같이 지운다.
// (judgeNudge() 자체와 그 반환값 {dir,reason}은 절대 안 건드린다. 이제 "브리지를 띄울지"를
// 결정하는 오라클로 그대로 쓰인다, onCtaPress 참고.)

const COPY = {
  // title/body는 바텀시트(openSheet, 되돌리기용)와 전체 화면 브리지(#bridge, openBridge)
  // 둘 다가 쓴다. cta 필드는 이 리팩터 전부터 이미 죽은 코드였다(넛지 CTA는 방향 기반으로
  // 직접 텍스트를 만들었지 COPY[reason].cta를 읽지 않았다). 손대지 않고 그대로 둔다.
  'short-trip':    { title:s=>`${s.etaMin}분이면 도착하는 경로예요`,
                     body: s=>`${s.charterHours}시간을 빌리지 않아도 일반예약으로 갈 수 있어요`,
                     // v14(스펙 §E): 브리지 본문에서 "일반예약" 넉 자만 #0086EA로 강조한다.
                     // body()는 바텀시트(옛 openSheet, 지금은 죽은 경로)와 셀프테스트(§Task1
                     // '짧은 경로 브리지 카피가...')가 순수 텍스트로 그대로 기대하므로 손대지
                     // 않고, 브리지 전용 HTML만 별도 필드로 둔다(openBridge 참고). 왕복/시외에는
                     // 이런 강조가 없어 bodyHtml 필드 자체가 없다.
                     bodyHtml: s=>`${escapeHtml(String(s.charterHours))}시간을 빌리지 않아도 <span>일반예약</span>으로 갈 수 있어요`,
                     cta:'일반예약으로 바꾸기' },
  // v13(§v13-1): golf/no-return/long-distance 세 사유의 카피가 한 화면(왕복 카피 + 표지판
  // 일러스트)으로 통일됐다. 골프장 시나리오(13339)도 이제 골프 카피가 아니라 이 카피를 쓴다.
  'round-trip':    { title:()=>'왕복이라면 시간대절이 더 편해요',
                     body: ()=>'돌아올 차편까지 한 번에 확보할 수 있어요',
                     cta:'시간대절로 바꾸기' },
};

/* ---- 3. ACTIONS ---- */
function setType(next){
  if (S.type === next) return;
  S.type = next;
  if (next === 'normal') S.charterHours = null;
  // 수정 5: 스펙 §6의 왕복 방지는 "전환으로 진입한 유형"만 억제 대상이다. 유저가 세그먼트를
  // 직접 눌러 고른 유형은 대상이 아니므로 convertedTo를 비운다. 안 비우면 예전 전환 표식이
  // 세그먼트를 몇 번 오가도 계속 남아, 유저가 직접 고른 유형에서도 넛지가 영구히 억제된다.
  S.convertedTo = null;
  render();
}

function ctaLabel(s){
  if (!s.route.to) return '경로 입력하기';
  if (!s.pickupAt) return '픽업 시간 입력하기';
  if (s.type === 'charter' && s.charterHours == null) return '대절 시간 입력하기';
  return '설정 완료';
}

// 아코디언: 경로 / 픽업 시간 / 대절 시간 카드 중 하나만 연다.
function focusCard(name){
  const current = S.openCard || 'route';
  if (current === name) return;
  S.openCard = name;
  render();
}

// CTA를 누르면 아직 채워지지 않은 항목의 카드를 연다.
// Task 4부터 '설정 완료' 상태의 실제 화면 전환은 onCtaPress()가 맡는다(아래 참고).
// 이 함수 자체는 '입력 덜 됨 → 카드 포커스' 동작만 남아 onCtaPress()에서 재사용된다.
function onCtaClick(){
  if (!S.route.to){ focusCard('route'); return; }
  if (!S.pickupAt){ focusCard('pickup'); return; }
  if (S.type === 'charter' && S.charterHours == null){ focusCard('charter'); return; }
}

// CTA 버튼의 유일한 이벤트 핸들러(bindEvents 참고). onCtaClick()을 감싸
// '입력 미완료 → 카드 포커스'와 '설정 완료 → 화면 전환(+왕복/시외 바텀시트 확인)'을
// 한 경로로 합친다.
// 마스터 Figma에는 카드 안에 확정 버튼이 없다: 휠이 열린 화면에서도 버튼은 이 CTA
// 하나뿐이고, 그 CTA가 열린 휠의 값을 확정한다. 그래서 라벨 상태(ctaLabel)와 무관하게
// 열린 카드가 휠 카드(pickup/charter)면 그 확정 경로를 최우선으로 태운다. 확정되면
// confirmPickupWheel()/confirmCharterWheel()이 S.openCard를 null로 접으므로, 이후 같은
// CTA를 다시 누르면 자연히 ctaLabel 기반 분기(카드 포커스 이동 또는 설정 완료)로 넘어간다.
// 왕복/시외 바텀시트는 '설정 완료' 상태에서만 걸려야 하므로 휠 확정 경로는 그 아래 검사를
// 절대 거치지 않고 바로 return한다.
function onCtaPress(){
  if (S.openCard === 'pickup'){ confirmPickupWheelFromCard(); return; }
  if (S.openCard === 'charter'){ confirmCharterWheelFromCard(); return; }
  if (ctaLabel(S) !== '설정 완료'){ onCtaClick(); return; }
  // v11(스펙 §4 "트리거"): 브리지는 방향을 가리지 않는다. 왕복/시외(to-charter: 골프/복귀불가/
  // 장거리, 돌아갈 차가 없는 "위험")와 짧은 경로(to-normal, "요금" 문제) 모두 첫
  // '설정 완료'에서 전체 화면으로 한 번 확인시킨다. 강도 차이는 더 이상 "막는다/안 막는다"가
  // 아니라 브리지 버튼 위계(주버튼=navy)의 라벨·동작으로만 낸다(openBridge 참고. 짧은 경로에서는
  // navy 버튼이 오히려 "이대로 계속하기"다). v10의 "짧은 경로는 아예 안 막는다"는 이걸로 대체됐다.
  // v15: "한 예약에 한 번만"이 아니라 "조건이 맞으면 계속 뜬다"로 바뀌었다. 그래서
  // 한 번 봤는지를 기억하지 않는다. 브리지의 두 버튼이 각각 다음 화면으로 보내므로
  // 무한 루프가 되지는 않는다(설정 완료를 다시 누르면 다시 뜨는 것이 의도다).
  const n = judgeNudge(S);
  if (n){ openBridge(n); return; }
  S.screen = 'vehicle';
  render();
}

// v5부터 CTA 경로에서는 쓰이지 않는다. 바텀시트가 대체된 뒤(v6) 강조(flashNudge)를 거쳐
// 이제(v11) 전체 화면 브리지(openBridge)가 대체했다. 되돌리려면 onCtaPress의 브리지 분기를
// openSheet로 바꾸면 된다.
// 왕복/시외 방향(일반예약 → 시간대절)만 가로막는 확인 바텀시트.
// 요금이 아니라 '복귀 위험'을 확인시키는 절차라 인라인 카드로 그치지 않는다.
function openSheet(reason){
  const c = COPY[reason];
  document.getElementById('sheet-title').textContent = '돌아올 차편은 준비되셨나요?';
  document.getElementById('sheet-body').textContent  =
    c.title(S) + '\n' + '시간대절은 기사가 목적지에서 기다렸다가 함께 돌아와요.';
  document.getElementById('sheet-convert').textContent = '시간대절로 바꾸기';
  document.getElementById('sheet-go').textContent      = '그대로 진행';
  document.getElementById('sheet-convert').onclick = ()=>{ closeSheet(); convert('charter'); };
  document.getElementById('sheet-go').onclick      = dismissSheet;
  document.getElementById('sheet-backdrop').hidden = false;
  document.getElementById('sheet').hidden = false;
}
function closeSheet(){
  document.getElementById('sheet').hidden = true;
  document.getElementById('sheet-backdrop').hidden = true;
}
// '그대로 진행': 이 예약 세션 동안 다시 가로막지 않는다.
function dismissSheet(){
  closeSheet();
  S.screen = 'vehicle';
  render();
}

// 넛지 CTA로 전환. 유저가 세그먼트를 직접 누르는 setType()과 달리 convertedTo(왕복 방지 표식)를 남긴다.
function convert(to){
  S.type = to;
  if (to === 'normal') S.charterHours = null;
  S.convertedTo = to;          // 왕복 방지 표식
  if (to === 'charter') S.openCard = 'charter';   // 대절 시간 카드 열린 상태로 착지
  // 수정 4: 스펙 §5.4는 시간대절 → 일반예약 착지 상태를 "카드 모두 접힘"으로 요구한다.
  // null을 넣으면 renderInput()의 `S.openCard || 'route'` 폴백에 흡수돼 경로 카드가 열려
  // 버린다(null은 "아직 아무 것도 고르지 않은 기본값"과 "명시적으로 다 접음"을 구분하지
  // 못한다). 'none' sentinel로 명시해 폴백에 흡수되지 않게 한다.
  else S.openCard = 'none';
  render();
}

// ---- Task 5: 생명주기(재판정) ----
// judgeNudge(S)는 매번 그 자리에서 다시 계산되는 순수 함수라(따로 캐싱하지 않는다), 상태를
// 바꾸는 아래 두 함수는 render()만 호출하면 재판정이 저절로 된다. 판정 결과를 따로 들고
// 있는 변수를 만들지 않는다.
function setRoute(patch){
  Object.assign(S.route, patch);
  render();
}
function setCharterHours(h){
  S.charterHours = h;
  render();
}
// 픽업 시간 설정 경로. 아직 이 상태를 바꾸는 액션이 없었으므로 Task 5에서 새로 만든다.
function setPickupAt(d){
  S.pickupAt = d;
  render();
}

// ---- Task 5: 휠 피커 확정 ----
// 휠이 스스로 render()를 부르지 않는다. 반드시 기존 setCharterHours()/setPickupAt() 경로를
// 거치게 해, judgeNudge() 재판정이 render() 그 경로 하나로만 일어나게 한다.
function confirmPickupWheel(d){
  S.openCard = null;   // 확정되면 카드를 접는다(아코디언 규칙).
  setPickupAt(d);
}
function confirmCharterWheel(h){
  S.openCard = null;   // 위와 동일한 이유
  setCharterHours(h);
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[ch]));
}

// v13: 경유지를 출발과 도착 사이에 끼운다(Figma 13424:98112 실측 '강남역 2번 출구, 경유2,
// 강남역 2번 출구'). 왕복 경로는 출발지와 도착지가 같아서, 경유지를 빼면 요약이
// '강남역 2번 출구, 강남역 2번 출구'가 되어 정작 어디를 가는지가 사라진다.
function routeSummaryText(s){
  return [s.route.from, ...(s.route.vias || []), s.route.to].filter(Boolean).join(', ');
}

// ---- Task 6: 미리보기 문자열 규칙 ----
function previewTitle(s){
  return s.type === 'charter' ? `넥스트 ${s.charterHours}시간 대절` : '넥스트 일반 예약';
}
function previewSubtitle(s){
  // 실제 플로우에서는 preview 화면에 pickupAt 없이 도달할 수 없다(onCtaPress가 막는다).
  // 다만 Task 8 레이아웃 테스트처럼 screen만 직접 찍어 렌더를 검증하는 경우가 있어
  // renderPreview() 전체가 죽지 않도록 방어한다.
  if (!s.pickupAt) return '';
  const base = `${fmtDate(s.pickupAt)} ${fmtTime(s.pickupAt)}`;
  if (s.type !== 'charter') return base;
  const end = new Date(s.pickupAt.getTime() + s.charterHours*3600*1000);
  return `${base} ~ ${fmtTime(end)}`;
}
function routeChips(s){
  return s.type === 'charter'
    ? [`${s.charterHours}시간 이용`, `${s.etaMin}분 예상`]
    : [`${s.etaMin}분 예상`];
}
function fmtWon(n){
  const sign = n < 0 ? '-' : '';
  return `${sign}${Math.abs(n).toLocaleString('ko-KR')}원`;
}

// ---- Task 6: 시각 표기 정식 함수 ----
// 날짜만: "m월 n일 (요일)"
function fmtDate(d){
  const wd = ['일','월','화','수','목','금','토'][d.getDay()];
  return `${d.getMonth()+1}월 ${d.getDate()}일 (${wd})`;
}
// 시간만: "오전/오후 h시 m분", 0분이면 "정각". 오전 = 00:00~11:50, 오후 = 12:00~23:50.
function fmtTime(d){
  const h = d.getHours();
  const m = d.getMinutes();
  const ampm = h < 12 ? '오전' : '오후';
  const h12 = (h % 12 === 0) ? 12 : h % 12;
  const minPart = m === 0 ? '정각' : `${m}분`;
  return `${ampm} ${h12}시 ${minPart}`;
}
// 아래 둘은 Task 2/5부터 쓰인 기존 이름. 규칙을 두 벌 두지 않도록 fmtTime/fmtDate를 그대로 호출한다.
// (기존 셀프테스트가 fmtTimeLabel을 이름으로 검사하므로 이름은 남긴다.)
function fmtTimeLabel(d){
  return fmtTime(d);
}
function fmtPickup(d){
  return `${fmtDate(d)} ${fmtTime(d)}`;
}

function routeCardHtml(s, isOpen){
  if (!isOpen){
    // Figma 실측(§6 folded): 아이콘 없이 라벨+요약값 두 요소뿐이다(높이 20+22+20=62).
    // rt-card-value(항목 7): 실제 렌더 후 fitRouteSummaryValue()가 폭을 재서 넘치면 도착지만
    // 남긴다. 여기서는 우선 "출발, 도착" 전체를 채워 둔다(측정 전 기본값).
    return `<div class="rt-route-summary">

        <span class="rt-route-text">${escapeHtml(s.route.from || '')}</span>
        ${ICON_ARROW}
      </div>
      ${(s.route.vias || []).map((via, i) => `
      <div class="rt-route-row rt-route-row-via">
        <span class="rt-via-no">${i + 1}</span>
        <span class="rt-route-tag">경유</span>
        <span class="rt-route-text">${escapeHtml(via)}</span>
        ${ICON_ARROW}
      </div>`).join('')}
      <div class="rt-route-row">
        <span class="rt-route-tag">도착</span>
        <span class="rt-route-text">${escapeHtml(s.route.to || '')}</span>
        ${ICON_ARROW}
      </div>
    </div>`;
}

// ---- Task 5: 휠 피커 ----
// 프로토타입에 필요한 최소한의 휠. 관성 스크롤은 흉내 내지 않는다.
// 행 높이 44px(Figma 실측 §7), 보이는 영역 132px(3행) : 위아래 44px 패딩을 둬 첫/끝
// 항목도 가운데로 스크롤될 수 있게 한다. (기존 40px/5행은 Figma 실측과 달라 카드 전체
// 높이가 300에서 크게 벗어났다. v7에서 실측값으로 바꿨다.)
const WHEEL_ROW_H = 44;
const WHEEL_VISIBLE = 132;
const WHEEL_PAD = (WHEEL_VISIBLE - WHEEL_ROW_H) / 2; // 44

function wheelColumnHtml(id, items, selectedIndex, extraClass){
  const rows = items.map((label, i) =>
    `<div class="rt-wheel-item${i === selectedIndex ? ' is-selected' : ''}" data-i="${i}">${escapeHtml(String(label))}</div>`
  ).join('');
  return `<div class="rt-wheel-col${extraClass ? ' ' + extraClass : ''}" id="${id}" data-index="${selectedIndex}">
      <div class="rt-wheel-pad"></div>
      ${rows}
      <div class="rt-wheel-pad"></div>
    </div>`;
}

function pickupWheelDates(){
  const base = new Date(); base.setHours(0,0,0,0);
  const arr = [];
  for (let i=0;i<14;i++){ const d = new Date(base); d.setDate(base.getDate()+i); arr.push(d); }
  return arr;
}
function pickupWheelHours(){
  const arr = []; for (let h=0; h<24; h++) arr.push(h); return arr;
}
function pickupWheelMinutes(){
  return [0,10,20,30,40,50];   // 분은 10분 단위
}
function hourWheelLabel(h){
  const ampm = h < 12 ? '오전' : '오후';
  const h12 = (h % 12 === 0) ? 12 : h % 12;
  return `${ampm} ${h12}시`;
}
// 아직 값이 없을 때 휠이 처음 열릴 위치: 지금 시각을 다음 10분 단위로 올림.
function defaultPickupDraft(){
  if (S.pickupAt) return new Date(S.pickupAt);
  const d = new Date(); d.setSeconds(0,0);
  const roundedM = Math.ceil(d.getMinutes()/10)*10;
  if (roundedM === 60){ d.setHours(d.getHours()+1); d.setMinutes(0); }
  else d.setMinutes(roundedM);
  return d;
}
function pickupWheelHtml(){
  const draft = defaultPickupDraft();
  const dates = pickupWheelDates();
  const hours = pickupWheelHours();
  const minutes = pickupWheelMinutes();
  let dateIdx = dates.findIndex(d => d.toDateString() === new Date(draft.getFullYear(), draft.getMonth(), draft.getDate()).toDateString());
  if (dateIdx < 0) dateIdx = 0;
  // 시·분 인덱스는 함께 정규화한다: 분을 10분 단위로 반올림했을 때 60이 되면(분 55~59)
  // 시가 넘어간 것이므로 시 인덱스도 같이 굴려야 한다. 따로 계산하면 휠이 한 시간 뒤처져 보인다.
  let hourIdx = draft.getHours();
  let roundedMinutes = Math.round(draft.getMinutes()/10)*10;
  if (roundedMinutes === 60){ roundedMinutes = 0; hourIdx = (hourIdx + 1) % 24; }
  let minuteIdx = minutes.indexOf(roundedMinutes);
  if (minuteIdx < 0) minuteIdx = 0;
  // Figma 실측(§7 펼침 head, Frame 2085667123): 제목 아래 현재 드래프트 값이 한 줄 더 있다.
  const draftValue = fmtPickup(new Date(dates[dateIdx].getFullYear(), dates[dateIdx].getMonth(), dates[dateIdx].getDate(), hours[hourIdx], minutes[minuteIdx]));
  return `<div class="rt-card-head rt-card-head--col">
      <div class="rt-card-title rt-card-title--ink2">픽업 시간</div>
      <div class="rt-card-head-value">${escapeHtml(draftValue)}</div>
    </div>
    <div class="rt-wheel">
      <div class="rt-wheel-band"></div>
      ${wheelColumnHtml('wheel-pickup-date', dates.map(fmtDate), dateIdx, 'is-wide')}
      ${wheelColumnHtml('wheel-pickup-hour', hours.map(hourWheelLabel), hourIdx)}
      ${wheelColumnHtml('wheel-pickup-minute', minutes.map(m => m===0 ? '정각' : m+'분'), minuteIdx)}
    </div>`;
}

const CHARTER_MAX_HOURS = 12;
function charterWheelHours(){
  const arr = []; for (let h=MIN_CHARTER_HOURS; h<=CHARTER_MAX_HOURS; h++) arr.push(h); return arr;
}
// v10(항목 3): 대절 시간을 고르기 전에 판단 근거를 준다. 오선택을 사후에 교정하는 넛지(짧은 경로)는
// 이미 있지만, 정작 "몇 시간을 빌려야 하나"에는 아무 힌트가 없어 예방보다 교정에 기댔다.
// 사용자가 3시간을 고른 뒤에야 "3시간 안 빌려도 된다"고 말하면 sunk cost가 걸린다. 판정
// (judgeNudge)에는 영향이 없는, 순수한 표시용 문구라 여기 따로 둔다.
function charterCardHintHtml(s){
  const lines = [`이 경로는 편도 ${s.etaMin}분이에요`];
  if (s.flags.golf) lines.push('골프장은 보통 5~6시간 빌려요');
  return `<div class="rt-card-hint">${lines.map(t => `<div>${escapeHtml(t)}</div>`).join('')}</div>`;
}
function charterWheelHtml(){
  const hours = charterWheelHours();
  const draft = S.charterHours != null ? S.charterHours : S.charterHoursPreset;
  let idx = hours.indexOf(draft);
  if (idx < 0) idx = 0;
  // 픽업 시간 카드와 같은 머리 구조(제목 + 현재 드래프트 값)로 맞춘다. 힌트(rt-card-hint)는
  // 대절 시간 카드에만 붙는다(픽업 시간 카드는 pickupWheelHtml, 별도 함수라 여기 안 걸린다).
  return `<div class="rt-card-head rt-card-head--col">
      <div class="rt-card-title rt-card-title--ink2">대절 시간</div>
      <div class="rt-card-head-value">${hours[idx]}시간</div>
    </div>
    ${charterCardHintHtml(S)}
    <div class="rt-wheel">
      <div class="rt-wheel-band"></div>
      ${wheelColumnHtml('wheel-charter-hour', hours.map(h=>h+'시간'), idx)}
    </div>`;
}

// 선택된 인덱스는 colEl.dataset.index 라는 명시적 상태로만 산다. 확정 버튼은 이 값을
// 읽을 뿐, 스크롤 위치에서 다시 계산하지 않는다(재계산하면 아래 경쟁이 되살아난다).
//
// 코드로 휠을 smooth 스크롤시키면(행 클릭) 그 사이에도 브라우저가 여러 번 scroll 이벤트를
// 쏜다. 예전에는 "프로그램 스크롤 중"을 고정 360ms 타이머로 추측해 그동안 스크롤 리스너를
// 죽였는데, 시(24행) 열처럼 스크롤 거리가 길면 네이티브 smooth scroll이 360ms를 넘겨 애니메이션
// 도중 값이 풀리고, 그 사이 scroll 이벤트가 중간 scrollTop으로 dataset.index를 덮어썼다.
// 지금은 시간 대신 위치로 판정한다: 클릭한 행이 colEl._wheelProgramTarget(목표 scrollTop)에
// 저장되고, 실제 scrollTop이 그 목표에 충분히 가까워지면(또는 scrollend가 오면) 프로그램
// 스크롤이 끝난 것으로 보고 target을 비운다. target이 남아있는 동안의 scroll 이벤트는
// "유저가 직접 스크롤한 것"이 아니므로 선택 상태를 절대 갱신하지 않는다.
const WHEEL_SETTLE_EPS = 1; // px. scrollTop이 목표와 이 이하로 가까우면 도착으로 본다.

function wheelNearestIndex(colEl){
  const raw = Math.round(colEl.scrollTop / WHEEL_ROW_H);
  const count = colEl.querySelectorAll('.rt-wheel-item').length;
  return Math.max(0, Math.min(count - 1, raw));
}
function wheelSelectIndex(colEl, idx){
  colEl.dataset.index = String(idx);
  colEl.querySelectorAll('.rt-wheel-item').forEach((el, i) => {
    el.classList.toggle('is-selected', i === idx);
  });
}
function bindWheelColumn(colEl){
  // 렌더 시 이미 계산된 선택 인덱스에 스크롤 위치를 동기화(애니메이션 없이).
  colEl.scrollTop = Number(colEl.dataset.index || 0) * WHEEL_ROW_H;
  colEl._wheelProgramTarget = null; // 진행 중인 프로그램 스크롤의 목표 scrollTop(없으면 null)
  let debounceT = null;

  function settle(){
    const target = colEl._wheelProgramTarget;
    if (target != null){
      // 프로그램 스크롤 구간의 이벤트: 위치가 목표에 도달했으면 구간만 닫고, 선택 상태는
      // 손대지 않는다(이미 클릭 시점에 올바른 값으로 갱신돼 있다).
      if (Math.abs(colEl.scrollTop - target) <= WHEEL_SETTLE_EPS) colEl._wheelProgramTarget = null;
      return;
    }
    wheelSelectIndex(colEl, wheelNearestIndex(colEl)); // 유저가 직접 스크롤을 멈춘 경우에만 반영
  }

  colEl.addEventListener('scroll', () => {
    clearTimeout(debounceT);
    debounceT = setTimeout(settle, 120); // 스크롤이 멈출 때까지 기다렸다 한 번만 반영(디바운스)
  });
  // 지원 브라우저에서는 scrollend로 프로그램 스크롤 종료를 더 빨리 알아챈다. 없어도
  // 위 위치 기반 판정(settle)만으로 동작하므로 필수는 아니다.
  colEl.addEventListener('scrollend', () => { colEl._wheelProgramTarget = null; });

  colEl.querySelectorAll('.rt-wheel-item').forEach((item, idx) => {
    item.addEventListener('click', (e) => {
      e.stopPropagation();     // 카드 클릭(focusCard)으로 버블링되지 않게
      wheelSelectIndex(colEl, idx);                          // 값·UI는 즉시(애니메이션과 무관하게) 갱신
      colEl._wheelProgramTarget = idx * WHEEL_ROW_H;
      colEl.scrollTo({ top: colEl._wheelProgramTarget, behavior: 'smooth' });
    });
  });
}
function bindPickupWheelEvents(){
  ['wheel-pickup-date','wheel-pickup-hour','wheel-pickup-minute'].forEach(id => {
    const el = document.getElementById(id);
    if (el) bindWheelColumn(el);
  });
}
function bindCharterWheelEvents(){
  const el = document.getElementById('wheel-charter-hour');
  if (el) bindWheelColumn(el);
}

// 마스터 Figma에는 카드 안 확정 버튼이 없다. 휠이 열린 채로 눌리는 버튼은 하단 전역
// CTA 하나뿐이라, 그 값 읽기·확정 호출을 카드 안 버튼 핸들러에서 여기로 옮겼다.
// confirmPickupWheel()/confirmCharterWheel() 자체는 그대로 두고 호출부만 onCtaPress()로 옮긴다.
function confirmPickupWheelFromCard(){
  const dateEl = document.getElementById('wheel-pickup-date');
  const hourEl = document.getElementById('wheel-pickup-hour');
  const minEl  = document.getElementById('wheel-pickup-minute');
  if (!dateEl || !hourEl || !minEl) return;   // 카드가 열려 있지 않으면 아무것도 안 함
  const dates = pickupWheelDates();
  const hours = pickupWheelHours();
  const minutes = pickupWheelMinutes();
  const d = new Date(dates[Number(dateEl.dataset.index)]);
  d.setHours(hours[Number(hourEl.dataset.index)]);
  d.setMinutes(minutes[Number(minEl.dataset.index)]);
  d.setSeconds(0,0);
  confirmPickupWheel(d);
}
function confirmCharterWheelFromCard(){
  const hourEl = document.getElementById('wheel-charter-hour');
  if (!hourEl) return;
  const hours = charterWheelHours();
  confirmCharterWheel(hours[Number(hourEl.dataset.index)]);
}

function pickupCardHtml(s, isOpen){
  if (isOpen) return pickupWheelHtml();
  const hasValue = !!s.pickupAt;
  // rt-card-value(항목 7): 값이 짧아 실제로는 안 걸리는 안전장치다.
  return `<div class="rt-line-card">
      <span class="rt-line-label">픽업 시간</span>
      <span class="rt-line-value rt-card-value${hasValue ? '' : ' is-placeholder'}">${hasValue ? escapeHtml(fmtPickup(s.pickupAt)) : '언제 출발하세요?'}</span>
    </div>`;
}

function charterCardHtml(s, isOpen){
  if (isOpen) return charterWheelHtml();
  const hasValue = s.charterHours != null;
  // rt-card-value(항목 7): 값이 짧아 실제로는 안 걸리는 안전장치다.
  return `<div class="rt-line-card">
      <span class="rt-line-label">대절 시간</span>
      <span class="rt-line-value rt-card-value${hasValue ? '' : ' is-placeholder'}">${hasValue ? escapeHtml(s.charterHours + '시간') : '얼마나 이용하세요?'}</span>
    </div>`;
}

// v11(스펙 §2): 선택 표시는 칩 배경·굵기(CSS의 [aria-selected="true"] 룰)가 맡고, 여기서는
// aria-selected·라벨 텍스트에 더해 아이콘도 채운다. 아이콘은 버튼(유형) 하나당 고정값이라
// isActive와 무관하게 매번 같은 iconSrc를 준다(스펙 §7: Figma는 선택 상태를 따라 스왑하지만
// 프로토는 유형에 고정한다).
// v13(스펙 §v13-2): "아이콘은 유형에 고정 + 선택된 칩에만 보인다"였다. isActive가 false면
// <img> 엘리먼트를 DOM에서 아예 뗐다(CSS display:none이 아니라 진짜 제거).
// v14(스펙 §A, B안): 탭을 바꿀 때마다 아이콘이 붙었다 떨어지며 칩 폭이 24px(아이콘 20 +
// gap 6) 흔들리는 게 문제였다. 이제 <img>는 첫 렌더에서 만들어지면 계속 남고(더 이상
// remove하지 않는다), src와 opacity(CSS, aria-selected 기반)만 매번 갱신한다. typeIconSrc는
// "이 칩이 비선택일 때" 보여줄 유형 아이콘이고, 선택일 때는 유형과 무관하게 항상
// CHIP_ICON_CHECK(공통 체크 배지)를 보여준다.
function renderTypeTab(btn, title, isActive, typeIconSrc){
  btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
  let icon = btn.querySelector('.rt-seg-icon');
  if (!icon){
    icon = document.createElement('img');
    icon.className = 'rt-seg-icon';
    icon.alt = '';
    btn.insertBefore(icon, btn.firstChild);
  }
  const src = isActive ? CHIP_ICON_CHECK : typeIconSrc;
  if (icon.getAttribute('src') !== src) icon.src = src;
  btn.querySelector('.rt-seg-label').textContent = title;
}

// 선택된 유형의 보조 문구. 칩을 누르면 이 줄이 바뀐다(컨트롤은 칩, 결과는 #type-lead).
// v11(스펙 §3): 문구가 "~때"에서 "~때 사용해요"로 바뀌었다.
const TYPE_LEAD = {
  normal:  '목적지까지 한 번에 이동할 때 사용해요',
  charter: '이동해서 기다리거나 왕복할 때 사용해요',
};

// v10(항목 7): 접힌 경로 카드는 Figma의 한 줄 우측 정렬 레이아웃을 유지하되, 값이 실제로
// 넘치면 도착지만 남긴다(우측 정렬 + 그냥 잘리면 도착지가 사라지는데, 정작 중요한 쪽이
// 사라지는 셈이라 최악이다). scrollWidth/clientWidth는 실제 레이아웃이 잡힌 뒤에만 믿을 수
// 있어 routeCardHtml(문자열 생성)이 아니라 여기서, DOM에 붙인 뒤 잰다.
// 도착지만으로도 넘치면(실제 주소는 반드시 넘친다) 문자열 자체를 줄인다. CSS
// text-overflow:ellipsis(.rt-card-value에 안전장치로 남아 있다)에 맡기지 않는 이유는 두
// 가지다. (1) 그 규칙은 끝을 자르는데, 한국 주소는 건물명 같은 식별 정보가 대개 맨 끝에
// 있어(예: "...공항로 272 제2여객터미널") 끝을 자르면 정작 중요한 조각이 사라진다. 그래서
// 여기서는 앞을 잘라 "…"을 붙인다. (2) overflow:hidden 상태에서도 scrollWidth 자체는 줄지
// 않는다(시각적으로 가려질 뿐 "잘린" 게 아니다). 그래서 실제로 문자열 길이를 줄여야
// scrollWidth가 clientWidth 밑으로 내려간다.
function fitRouteSummaryValue(el, s){
  if (!el) return;
  const full = routeSummaryText(s);
  el.textContent = full;
  if (el.scrollWidth <= el.clientWidth + 1) return;          // 전체가 들어간다
  // v13: 축약해서 남길 한 곳을 고른다. 보통은 도착지지만, 왕복은 출발지와 도착지가 같아서
  // 도착지만 남기면 '강남역 2번 출구'가 되어 어디를 가는지가 사라진다. 왕복에서는
  // 경유지가 사실상 목적지다.
  const dest = (isRoundTrip(s) ? s.route.vias[0] : s.route.to) || s.route.to || '';
  el.textContent = dest;
  if (el.scrollWidth <= el.clientWidth + 1) return;          // 그 한 곳만으로 들어간다
  let cut = dest;
  while (cut.length > 1 && el.scrollWidth > el.clientWidth + 1){
    cut = cut.slice(1);           // 앞에서부터 잘라 뒤(건물명 등)를 살린다
    el.textContent = '…' + cut;
  }
}

function renderInput(){
  const openName = S.openCard || 'route';

  // v14(스펙 §A, B안): 비선택일 때 보여줄 유형 아이콘. 일반예약=위치 핀(CHIP_ICON_DESTINATION,
  // 신규), 시간대절=파란 원(CHIP_ICON_NODE_CALL, 기존 재사용). 선택일 때는 renderTypeTab이
  // 이 값을 무시하고 항상 CHIP_ICON_CHECK를 그린다.
  renderTypeTab(document.getElementById('seg-normal'), '일반예약', S.type === 'normal', CHIP_ICON_DESTINATION);
  renderTypeTab(document.getElementById('seg-charter'), '시간대절', S.type === 'charter', CHIP_ICON_NODE_CALL);
  // v11(스펙 §3): 아이콘(ICON_INFO, 임시) + 텍스트. innerHTML을 쓰지만 텍스트는 이 파일의
  // escapeHtml을 거치지 않아도 안전하다(TYPE_LEAD는 상수 리터럴이라 사용자 입력이 아니다).
  document.getElementById('type-lead').innerHTML = ICON_INFO + `<span>${TYPE_LEAD[S.type]}</span>`;

  const routeEl = document.getElementById('card-route');
  const isRouteOpen = openName === 'route';
  routeEl.classList.toggle('is-open', isRouteOpen);
  routeEl.innerHTML = routeCardHtml(S, isRouteOpen);
  if (!isRouteOpen) fitRouteSummaryValue(routeEl.querySelector('.rt-card-value'), S);

  const pickupEl = document.getElementById('card-pickup');
  const isPickupOpen = openName === 'pickup';
  pickupEl.classList.toggle('is-open', isPickupOpen);
  pickupEl.innerHTML = pickupCardHtml(S, isPickupOpen);
  if (isPickupOpen) bindPickupWheelEvents();

  const charterEl = document.getElementById('card-charter');
  const showCharter = S.type === 'charter';
  const wasHidden = charterEl.hidden;
  const isCharterOpen = openName === 'charter';
  charterEl.hidden = !showCharter;
  charterEl.classList.toggle('is-open', isCharterOpen);
  if (showCharter){
    charterEl.innerHTML = charterCardHtml(S, isCharterOpen);
    if (isCharterOpen) bindCharterWheelEvents();
    if (wasHidden){
      // 새 카드 등장: translateY(20px)->0 + opacity, 300ms. 사라짐은 즉시(hidden 속성으로 바로 사라짐).
      charterEl.classList.remove('rt-enter');
      void charterEl.offsetWidth; // 애니메이션 재시작을 위한 리플로우
      charterEl.classList.add('rt-enter');
    }
  }

  document.getElementById('cta').textContent = ctaLabel(S);
}

// ---- v11: 브리지(Figma §4) ----
// 입력 화면 위를 전체 화면으로 덮는 오버레이. AI 어시스트 상태기계(체크중->완료 애니메이션)와
// 인라인 넛지 카드를 통째로 대체한다. judgeNudge()는 절대 건드리지 않는다: 이 두 함수는 그
// 결과를 어떻게 "전체 화면으로" 보여줄지, 그리고 어떤 버튼이 어떤 동작을 할지만 정한다.
function closeBridge(){
  document.getElementById('bridge').hidden = true;
}

// 버튼 위계는 스타일이 고정(주버튼=navy, 보조버튼=회색)이고 라벨·동작만 방향마다 뒤집힌다
// (스펙 §4 "핵심"). to-charter(왕복/시외, 골프/복귀불가/장거리, 돌아갈 차가 없는 "위험")는 주버튼이
// 전환을 권하고, to-normal(짧은 경로, 짧은 경로, "요금" 문제)은 주버튼이 오히려 "이대로 계속하기"다.
// v14(스펙 §D): 제목 개행 위치가 바뀌었다(왕복/시외 "왕복이라면 시간대절이 ⏎ 더 편해요", 짧은 경로
// "{h}분이면 도착하는 ⏎ 경로예요"). 이 파일은 U+2028/\n으로 강제 개행을 넣지 않는 규칙이라
// (title()이 순수 텍스트를 돌려줘야 하는 셀프테스트·바텀시트 쪽 사용도 있다), 대신
// #bridge-title의 max-width를 사유별로 좁혀 기존 word-break:keep-all이 그 지점에서 접히게
// 한다. 값은 실제 폰트(22px Bold, 시스템 산세리프)로 각 줄 조각의 캔버스 픽셀 폭을 재서
// 정했다(v14 보고서 §D 참고). 짧은 경로(short-trip)은 etaMin이 1~999분 어느 값이어도 같은
// 지점("도착하는" 뒤)에서 접히도록 폭에 여유를 뒀다.
const BRIDGE_TITLE_MAXW = { 'round-trip': 210, 'short-trip': 200 };
function openBridge(n){
  const c = COPY[n.reason];
  document.getElementById('bridge-illust').src = BRIDGE_ILLUST[n.reason];
  const titleEl = document.getElementById('bridge-title');
  titleEl.textContent = c.title(S);
  titleEl.style.maxWidth = BRIDGE_TITLE_MAXW[n.reason] + 'px';
  // v14(스펙 §E): 짧은 경로 본문은 "일반예약"만 강조하는 HTML(c.bodyHtml)을 쓴다. c.body()는
  // 상수 리터럴 문자열이라(스펙 §E 지시대로) escapeHtml 없이 innerHTML에 넣어도 안전하지만,
  // bodyHtml이 없는 사유(왕복/시외)는 값을 담을 수 있으니 습관적으로 escapeHtml을 거친다.
  document.getElementById('bridge-desc').innerHTML = c.bodyHtml ? c.bodyHtml(S) : escapeHtml(c.body(S));
  const primary = document.getElementById('bridge-primary');
  const secondary = document.getElementById('bridge-secondary');
  if (n.dir === 'to-charter'){
    primary.textContent = '시간대절로 변경하기';
    primary.onclick = ()=>{ convert('charter'); closeBridge(); };
    secondary.textContent = '이대로 계속하기';
    secondary.onclick = ()=>{ closeBridge(); S.screen = 'vehicle'; render(); };
  } else {
    primary.textContent = '이대로 계속하기';
    primary.onclick = ()=>{ closeBridge(); S.screen = 'vehicle'; render(); };
    secondary.textContent = '일반예약으로 변경하기';
    secondary.onclick = ()=>{ convert('normal'); closeBridge(); };
  }
  document.getElementById('bridge').hidden = false;
}

// 프로토타입용 목업 요금. 실제 값은 서버 계산이라 이 태스크 범위 밖이다.
// 줄 순서: 기본요금 → 통행료 → 서비스이용료 → (시간대절만) 시간 추가요금 → 거리 추가요금 → 할인 → 총 예상요금.
function fareRowsHtml(s){
  const rows = [
    ['기본요금', 95000],
    ['통행료', 2000],
    ['서비스이용료', 3000],
  ];
  if (s.type === 'charter'){
    rows.push(['시간 추가요금', 15000]);
    rows.push(['거리 추가요금', 10000]);
  }
  rows.push(['할인', -5000]);
  const total = rows.reduce((sum, [, v]) => sum + v, 0);
  const rowsHtml = rows.map(([label, v]) => `<div class="rt-fare-row">
      <span class="rt-fare-label">${escapeHtml(label)}</span>
      <span class="rt-fare-value">${fmtWon(v)}</span>
    </div>`).join('');
  return rowsHtml + `<div class="rt-fare-row rt-fare-total">
      <span class="rt-fare-label">총 예상요금</span>
      <span class="rt-fare-value">${fmtWon(total)}</span>
    </div>`;
}

// 쿼리 파라미터(?scenario=&type=)로 초기 상태를 정한다(Task 3에서 이관).
// 파라미터가 없으면 stateFromQuery()가 중립을 돌려주므로 전역 기본값(fresh('normal','normal'))과 동일하다.
function applyQueryToState(){
  const params = new URLSearchParams(location.search);
  const q = stateFromQuery(params);
  S = primeForHarness(fresh(q.scenario, q.type));

  // ---- Task 6: ?screen=vehicle|preview로 바로 열기(QA·스크린샷 전용) ----
  const screen = params.get('screen');
  if (screen === 'vehicle' || screen === 'preview'){
    S.screen = screen;
    // 실제 플로우라면 입력 화면에서 CTA가 '설정 완료'가 될 때까지 픽업 시간(과 시간대절이면
    // 대절 시간)이 이미 채워져 있다. 쿼리로 두 화면을 바로 열 때도 같은 전제를 맞춰 둔다
    // (scenario=normal은 위 분기에서 pickupAt을 안 채우므로 여기서 보정하지 않으면 미리보기가
    // null Date를 만나 그린다).
    if (!S.pickupAt) S.pickupAt = new Date();
    if (S.type === 'charter' && S.charterHours == null) S.charterHours = S.charterHoursPreset;
  }
}

/* ---- 5. HARNESS ---- */
// 하네스 전용 프라이밍: 시나리오를 고르자마자(패널 클릭이든 ?scenario= 쿼리든) 그 시나리오가
// 노리는 넛지 경로를 바로 볼 수 있도록, 유저가 아직 고르지 않았을 픽업 시간을 하네스가
// 미리 채워 넣는다. fresh()는 pickupAt: null로 "아직 안 고름"을 표현하는 게 계약인데,
// 이 함수는 그 계약을 의도적으로 건너뛴다. 실제 플로우라면 픽업 화면에서 시간을 넣어야
// 넛지·시트가 뜨지만(판정과 렌더 모두 S.pickupAt를 요구한다), 시나리오 전환만으로 그
// 상태를 재현하기 위한 지름길이다.
// 조건은 정상(normal)을 제외한 모든 시나리오다. 짧은 경로(short), 왕복/시외 계열(golf/noReturn/
// longDistance)뿐 아니라 airport도 포함한다. airport는 judgeNudge가 항상 null을 돌려주므로
// 채워도 넛지가 뜨지는 않지만, 채워 두는 것 자체는 무해하고 "정상만 예외"가 조건을 가장
// 단순하게 표현하므로 굳이 시나리오별로 갈라 적지 않는다.
// 수정 9: 그냥 new Date()를 넣으면 "오후 4시 36분"처럼 휠(10분 단위)이 표현 못 하는 값이
// 화면에 뜬다. 기획자가 캡처해 돌려 보는 화면이라 픽업 시간도 10분 단위여야 한다.
// 규칙(스펙): 초 버림 → +30분 → 10분 올림.
function roundedPickupNow(){
  const d = new Date();
  d.setSeconds(0, 0);                              // 초 버림
  d.setMinutes(d.getMinutes() + 30);                // +30분
  const roundedM = Math.ceil(d.getMinutes() / 10) * 10;  // 10분 올림
  if (roundedM === 60){ d.setHours(d.getHours() + 1); d.setMinutes(0); }
  else d.setMinutes(roundedM);
  return d;
}
function primeForHarness(s){
  if (s.scenario !== 'normal') s.pickupAt = roundedPickupNow();
  return s;
}

// 설정 패널: 폰 프레임 바깥, 기획자·디자이너가 시나리오를 갈아 끼우며 보는 용도.
// 즉시 반영(적용 버튼 없음), 스크림 없음(패널을 열어 둔 채로 폰 조작 가능),
// ⚙ 토글 / ✕ / 바깥 클릭 / Esc로 닫는다. 되돌리기는 '처음으로' 링크(href="?")가 맡는다.
let panelOpen = false;

// SCENARIOS의 키·라벨을 그대로 써서 칩을 만든다(라벨을 여기 다시 적지 않는다).
function buildPanel(){
  const wrap = document.getElementById('panel-scenarios');
  Object.keys(SCENARIOS).forEach(function(key){
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'panel-chip';
    btn.dataset.scenario = key;
    btn.textContent = SCENARIOS[key].label;
    wrap.appendChild(btn);
  });
}

// 현재 S를 기준으로 칩의 is-active만 갱신한다(패널 자체 상태는 이것뿐).
function renderPanel(){
  document.querySelectorAll('#panel [data-scenario]').forEach(function(btn){
    btn.classList.toggle('is-active', btn.dataset.scenario === S.scenario);
  });
  document.querySelectorAll('#panel [data-type]').forEach(function(btn){
    btn.classList.toggle('is-active', btn.dataset.type === S.type);
  });
}

function openPanel(){
  panelOpen = true;
  document.getElementById('panel').hidden = false;
  document.getElementById('gear').classList.add('is-active');
}
function closePanel(){
  panelOpen = false;
  document.getElementById('panel').hidden = true;
  document.getElementById('gear').classList.remove('is-active');
}
function togglePanel(){
  if (panelOpen) closePanel(); else openPanel();
}

// 시나리오를 바꾸면 그 시나리오로 상태를 새로 만든다(fresh(key, S.type)). 유저가 고른
// 시작 탭은 유지한다. primeForHarness()가 applyQueryToState()와 같은 이유로 픽업 시간을
// 채워, 패널에서 시나리오만 눌러도 넛지·시트를 바로 볼 수 있게 한다.
function panelSelectScenario(key){
  S = primeForHarness(fresh(key, S.type));
  render();
  renderPanel();
}
// 시작 탭을 바꾸면 시나리오는 유지한 채 그 탭으로 상태를 새로 만든다(fresh(S.scenario, type)).
// 시나리오와 시작 탭은 서로의 값을 건드리지 않는다(대칭).
function panelSelectType(type){
  S = primeForHarness(fresh(S.scenario, type));
  render();
  renderPanel();
}

function bindPanelEvents(){
  const gear = document.getElementById('gear');
  const panel = document.getElementById('panel');
  const phone = document.getElementById('phone');
  gear.addEventListener('click', function(e){
    e.stopPropagation();
    togglePanel();
  });
  document.getElementById('panel-close').addEventListener('click', closePanel);
  panel.addEventListener('click', function(e){
    const scBtn = e.target.closest('[data-scenario]');
    if (scBtn){ panelSelectScenario(scBtn.dataset.scenario); return; }
    const typeBtn = e.target.closest('[data-type]');
    if (typeBtn){ panelSelectType(typeBtn.dataset.type); return; }
  });
  // 스크림이 없으므로 "바깥 클릭으로 닫기"는 문서 전체 클릭을 듣는다. 여기서 "바깥"은
  // 패널과 폰 프레임을 뺀 나머지다. 폰을 클릭해도 패널이 닫히면 안 된다(패널을 열어
  // 둔 채로 폰을 여러 번 조작하며 비교하는 것이 이 하네스의 존재 이유다).
  document.addEventListener('click', function(e){
    if (!panelOpen) return;
    if (panel.contains(e.target) || e.target === gear || phone.contains(e.target)) return;
    closePanel();
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && panelOpen) closePanel();
  });
}

/* ---- 6. SELFTEST ---- */
const T = [];
// 테스트끼리 전역 S / #sheet DOM 상태를 공유하므로, 앞 테스트가 열어 둔 시트나
// 넛지가 뒤 테스트로 새지 않도록 매 테스트 실행 전에 초기 상태로 되돌린다.
function resetForTest(){
  closeSheet();
  closeBridge();   // v11: 앞 테스트가 열어 둔 브리지가 뒤 테스트로 새지 않게 한다.
  // 휠의 "프로그램 스크롤 진행 중" 표식(열마다 colEl._wheelProgramTarget)도 초기화한다.
  // 남아 있으면 앞 테스트가 만든 표식이 뒤 테스트의 스크롤 판정에 새어 들어갈 수 있다.
  document.querySelectorAll('.rt-wheel-col').forEach(el => { el._wheelProgramTarget = null; });
  // 설정 패널(Task 7)도 열린 채로 새면 안 된다. 앞 테스트가 열어 둔 패널이 뒤 테스트의
  // "바깥 클릭으로 닫힘" 판정이나 DOM 탐색에 섞여 들어갈 수 있다.
  closePanel();
}
function test(name, fn){
  try { resetForTest(); fn(); T.push('PASS ' + name); }
  catch(e){ T.push('FAIL ' + name + ' :: ' + e.message); }
}
function eq(actual, expected, what){
  if (actual !== expected) throw new Error(`${what||''} expected ${JSON.stringify(expected)} got ${JSON.stringify(actual)}`);
}
function runJudgeTests(){
  test('공항이면 넛지 없음', ()=>{
    const s = fresh('airport','normal'); eq(judgeNudge(s), null);
  });
  test('일반예약 · 골프장이면 시간대절 권유', ()=>{
    // v13(§v13-1): 사유가 'golf'에서 통합 사유 'round-trip'으로 바뀌었다.
    const s = fresh('golf','normal'); eq(judgeNudge(s).reason, 'round-trip');
  });
  // v13: "조건 우선순위는 골프 > 복귀불가 > 장거리"는 세 사유가 하나(round-trip)로 합쳐지며
  // 전제 자체가 없어졌다(더 이상 가릴 우선순위가 없다). 지우고 아래 새 필수 테스트
  // '왕복/시외 사유가 round-trip 하나로 합쳐졌다'· '복귀 불가 지역은 더 이상 트리거가 아니다'로
  // 대체한다(selftest() 마지막에서 함께 돈다).
  test('시간대절 · 대절 시간 미입력이면 판정 불가', ()=>{
    const s = fresh('short','charter'); eq(judgeNudge(s), null);
  });
  test('시간대절 · 48분 경로에 3시간이면 일반예약 권유', ()=>{
    const s = fresh('short','charter'); s.charterHours = 3;
    eq(judgeNudge(s).reason, 'short-trip');
  });
  test('시간대절 · 경유지가 있으면 발동 안 함', ()=>{
    const s = fresh('short','charter'); s.charterHours = 3; s.route.vias = ['강남역'];
    eq(judgeNudge(s), null);
  });
  test('시간대절 · 최소 단위면 발동 안 함', ()=>{
    const s = fresh('short','charter'); s.charterHours = MIN_CHARTER_HOURS;
    eq(judgeNudge(s), null);
  });
  test('시간대절 · 예상 소요가 절반 이상이면 발동 안 함', ()=>{
    const s = fresh('short','charter'); s.charterHours = 3; s.etaMin = 90;
    eq(judgeNudge(s), null);
  });
  test('왕복 방지 · 전환으로 들어온 유형에선 반대 넛지 없음', ()=>{
    const s = fresh('golf','charter'); s.charterHours = 3; s.convertedTo = 'charter';
    eq(judgeNudge(s), null);
  });
  test('카피에 실제 값이 들어감', ()=>{
    const s = fresh('short','charter'); s.charterHours = 3;
    eq(COPY['short-trip'].title(s), '48분이면 도착하는 경로예요');
    eq(COPY['short-trip'].body(s),  '3시간을 빌리지 않아도 일반예약으로 갈 수 있어요');
  });
  // 수정 7: 경로 미입력 가드가 원래 normal 분기에만 있어, charter + charterHours=3 +

  // 이 하한선 검사는 지운다(중복이자, "38 이상"은 이제 44라는 사실을 가려서 오히려 약하다).
  test('aria-selected 가 선택 상태를 따라간다', ()=>{

  // 으로 바뀌었다. 값만 갱신하고 의도("선택된 쪽만 다르게 채워짐")는 그대로 검사한다.

    eq(bg('seg-charter'), 'rgb(232, 235, 240)');  // #E8EBF0, 비선택

  // 하나를 골라야 하고, 그냥 닫아서 판정을 무시할 길이 없다는 게 이 UI의 의도다).
  test('브리지에는 닫기 버튼이 없다(주/보조 둘 뿐)', ()=>{
    for (const [sc, tp, hrs] of [['golf','normal',null], ['short','charter',3]]) {
      S = fresh(sc, tp); S.pickupAt = new Date(); if (hrs) S.charterHours = hrs;
      S.openCard = 'none'; render(); onCtaPress();
      const bridgeEl = document.getElementById('bridge');
      const buttons = [...bridgeEl.querySelectorAll('button')];
      eq(buttons.length, 2, sc + ': 브리지 안 버튼 개수(주/보조 둘이어야 함)');
      const closeWord = /닫기|close/i;
      buttons.forEach(b => {
        const label = ((b.getAttribute('aria-label') || '') + ' ' + b.textContent).trim();
        const isCloseSymbol = /^[×✕xX]$/.test(label);
        if (closeWord.test(label) || isCloseSymbol) throw new Error(sc + ': close-like button found: ' + label);
      });
    }
  });
}

/* ---- Task 8: 레이아웃 실측 ----
   보이는 프레임(.rt-phone)에 transform:scale이 걸리면 getBoundingClientRect가 축소된
   값을 준다. 아래 테스트는 getComputedStyle 기반(px)이라 scale의 영향을 받지 않지만,
   측정 전 CSS transition을 꺼서 진입 애니메이션 중간값을 재는 사고를 막는다. */
function ensureNoTransitionForMeasurement(){
  if (document.getElementById('rt-measure-style')) return;
  const style = document.createElement('style');
  style.id = 'rt-measure-style';
  style.textContent = '*{transition:none !important;}';
  document.head.appendChild(style);
}
function px(el, prop){ return Math.round(parseFloat(getComputedStyle(el)[prop])); }

       Math.round(chips[1].getBoundingClientRect().top), 'chips on same line');
  });
  test('폰 프레임 안이 가로로 넘치지 않는다', ()=>{
    const p = document.getElementById('phone');
    if (p.scrollWidth > p.clientWidth) throw new Error(`scrollWidth ${p.scrollWidth} > ${p.clientWidth}`);
  });
  // 수정 8: 원래 테스트는 backgroundColor만 봤다. 실제 비-navy 강조(넛지 CTA, 휠 선택밴드
  // 글자)는 전부 color(글자색)로 들어가 있어 배경만 보는 검사로는 절대 안 걸렸다. 게다가
  // 예외 셀렉터가 '.wheel'인데 실제 클래스는 '.rt-wheel-col'이라 이중으로 죽어 있었다.
  // 이제 color·backgroundColor 둘 다 보고, 이 프로젝트가 문서화한 강조색만 각자의 자리에서만
  // 허용한다. 그 밖에 채도가 높은(무채색이 아닌) rgb 색이 나오면 잡는다.
  // v11: 칩 선택 배경이 navy 단색(#31487D)에서 회색 오버레이 합성값(#D1D4DB/#E8EBF0)으로
  // 바뀌어 .rt-seg 안에는 이제 새로 허용할 강조색이 없다(둘 다 채도 30 이하라 무채색 검사를
  // 그냥 통과한다). #assist가 없어져 ASSIST_ACCENT(#32A2FA)도 함께 지운다. PILL_ACCENT
  // (#31487D)는 이제 #bridge(본문 글자) 안에서만 나온다. 새로 생긴 강조색 둘을 추가한다:
  // 리드 문구(#type-lead) 글자 #556895(LEAD_ACCENT), 브리지 보조버튼 글자 #283873
  // (SECONDARY_ACCENT). 스캔 함수로 만들어 휠 열림 상태와 브리지 열림 상태 둘 다에 돌린다
  // (한 렌더에서는 두 오버레이가 동시에 안 열리므로 각각 확인해야 브리지 안 색까지 잡는다).
  // v13(§v13-2): 비선택 칩 라벨이 #384F85로 바뀌었다(선택 라벨 #19254D는 NAVY와 같은 값이라
  // 이미 통과한다). 채도(133-56=77)가 30을 넘어 그냥 두면 일반 규칙에 걸리므로, 다른
  // 강조색처럼 .rt-seg-tab 안에서만 허용하는 CHIP_LABEL_ACCENT로 등록한다.
  // v14(스펙 §E): 짧은 경로 브리지 본문의 "일반예약" 강조가 ACCENT_0086EA(#0086EA)를 #bridge
  // 안에서도 쓴다. 원래 .rt-wheel-col 전용이었던 예외를 #bridge까지 넓힌다.
  // v14(스펙 §B): 리드 문구 아이콘 색이 #556895→#7282A6로 바뀌면서(텍스트는 그대로) 이제
  // WHEEL_MUTED(#7282A6)가 #type-lead 안에서도 나온다. 원래 .rt-wheel-col 전용이었던 예외를
  // #type-lead까지 넓힌다.
  function scanAccents(){
    const NAVY = 'rgb(25, 37, 77)';          // --navy #19254d, 유일한 전역 강조색
    const ACCENT_0086EA = 'rgb(0, 134, 234)'; // --wheel-band-ink #0086EA, .rt-wheel-col·#bridge 안에서만 허용
    const PILL_ACCENT = 'rgb(49, 72, 125)';  // #31487D, #bridge(본문 글자) 안에서만 허용
    const WHEEL_MUTED = 'rgb(114, 130, 166)'; // #7282A6. 휠 미선택 행 글자색과 리드 아이콘. 휠 컬럼과 #type-lead 안에서만 허용
    const LEAD_ACCENT = 'rgb(85, 104, 149)'; // #556895, #type-lead(아이콘+글자) 안에서만 허용
    const SECONDARY_ACCENT = 'rgb(40, 56, 115)'; // #283873, #bridge(보조버튼 글자) 안에서만 허용
    const CHIP_LABEL_ACCENT = 'rgb(56, 79, 133)'; // v13: #384F85, 비선택 칩 라벨. .rt-seg-tab 안에서만 허용
    const rgbRe = /^rgb\((\d+), (\d+), (\d+)\)$/;
    const els = document.querySelectorAll('#phone *');
    for (const el of els){
      const cs = getComputedStyle(el);
      for (const prop of ['color', 'backgroundColor']){
        const v = cs[prop];
        if (v === NAVY) continue;
        if (v === ACCENT_0086EA){
          if (el.closest('.rt-wheel-col') || el.closest('#bridge')) continue;
          throw new Error(`unexpected accent ${prop}=${v} outside .rt-wheel-col/#bridge`);
        }
        if (v === PILL_ACCENT){
          if (el.closest('#bridge')) continue;
          throw new Error(`unexpected accent ${prop}=${v} outside #bridge`);
        }
        if (v === LEAD_ACCENT){
          if (el.closest('#type-lead')) continue;
          throw new Error(`unexpected accent ${prop}=${v} outside #type-lead`);
        }
        if (v === SECONDARY_ACCENT){
          if (el.closest('#bridge')) continue;
          throw new Error(`unexpected accent ${prop}=${v} outside #bridge`);
        }
        if (v === CHIP_LABEL_ACCENT){
          if (el.closest('.rt-seg-tab')) continue;
          throw new Error(`unexpected accent ${prop}=${v} outside .rt-seg-tab`);
        }
        if (v === WHEEL_MUTED){
          if (el.closest('.rt-wheel-col') || el.closest('#type-lead')) continue;
          throw new Error(`unexpected accent ${prop}=${v} outside wheel column/#type-lead`);
        }
        const m = v.match(rgbRe);
        if (!m) continue;   // transparent, rgba(...) 등은 강조색 검사 대상이 아니다
        const [r,g,b] = m.slice(1).map(Number);
        const saturation = Math.max(r,g,b) - Math.min(r,g,b);   // 무채색(회색 계열)은 낮다
        if (saturation > 30) throw new Error(`unexpected accent ${prop}=${v}`);
      }
    }
  }
  test('강조색은 navy 하나뿐 (폰 프레임 안, 휠 열림)', ()=>{
    S = fresh('golf','normal'); S.pickupAt = new Date(); S.openCard = 'pickup'; render();
    scanAccents();
