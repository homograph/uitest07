  });
  test('전환 후 같은 방향 넛지가 다시 뜨지 않음', ()=>{
    S = fresh('short','charter'); S.charterHours = 3; convert('normal');
    eq(judgeNudge(S), null);
  });
  // 수정 4: 스펙 §5.4 "일반예약 탭, 카드 모두 접힘, CTA 활성". openCard가 null이면
  // renderInput()의 `S.openCard || 'route'` 폴백에 흡수돼 경로 카드가 열려 버렸다.
  // 'none' sentinel이 실제로 세 카드를 모두 접는지 DOM에서 직접 확인한다.
  test('시간대절 → 일반예약 전환 직후는 카드 모두 접힘, CTA 활성', ()=>{
    S = fresh('short','charter'); S.pickupAt = new Date(); S.charterHours = 3;
    convert('normal');
    eq(S.openCard, 'none');
    eq(document.getElementById('card-route').classList.contains('is-open'), false);
    eq(document.getElementById('card-pickup').classList.contains('is-open'), false);
    eq(document.getElementById('card-charter').classList.contains('is-open'), false);
    eq(ctaLabel(S), '설정 완료');
  });
  test('9913 넛지가 대절 시간 입력 전에는 안 보임', ()=>{
    S = fresh('short','charter'); S.pickupAt = new Date(); S.charterHours = null; render();
    const n = document.getElementById('nudge');
    eq(n.hidden, true);
    // hidden 속성만 보면 CSS 의 display 가 그걸 덮어써도 통과한다. 실제로 안 그려지는지 본다.
    eq(getComputedStyle(n).display, 'none');
    if (n.getBoundingClientRect().height !== 0) throw new Error('hidden nudge still occupies space');
  });
  test('9913 넛지 카피가 화면에 그려짐', ()=>{
    S = fresh('short','charter'); S.pickupAt = new Date(); S.charterHours = 3; render();
    eq(document.getElementById('nudge').hidden, false);
    eq(document.getElementById('nudge-title').textContent, '48분이면 도착하는 경로예요');
    eq(document.getElementById('nudge-body').textContent, '3시간을 빌리지 않아도 일반예약으로 갈 수 있어요');
    eq(document.getElementById('nudge-cta').textContent, '일반예약으로 변경하기');
  });
  test('넛지가 제목과 본문 두 줄을 보여 준다', ()=>{
    S = fresh('golf','normal'); S.pickupAt = new Date(); render();
    eq(document.getElementById('nudge-title').textContent, '라운딩 끝나고 돌아올 차가 없을 수 있어요');
    eq(document.getElementById('nudge-body').textContent, '시간대절은 기사가 기다렸다가 함께 돌아와요');
    eq(document.getElementById('nudge-cta').textContent, '시간대절로 변경하기');
  });
  test('변경 버튼 터치 타깃이 44 이상이다', ()=>{
    S = fresh('golf','normal'); S.pickupAt = new Date(); render();
    const r = document.getElementById('nudge-cta').getBoundingClientRect();
    if (r.height < 44 || r.width < 44) throw new Error(`${r.width}x${r.height}`);
  });
  // 수정 8: 원래 테스트는 코드에 존재하지도 않는 [data-role="close"] 속성을 찾아, 진짜
  // 닫기 버튼을 추가해도 영원히 통과하는 tautology였다. #nudge 안 버튼 개수(CTA 하나여야
  // 함)와, 버튼의 라벨·문구가 "닫기/close/×/✕"류가 아닌지를 실제로 본다.
  test('9913 넛지에는 닫기 버튼이 없다', ()=>{
    S = fresh('short','charter'); S.charterHours = 3; render();
    const nudgeEl = document.getElementById('nudge');
    const buttons = [...nudgeEl.querySelectorAll('button')];
    eq(buttons.length, 1, '넛지 안 버튼 개수(CTA 하나만 있어야 함)');
    const closeWord = /닫기|close/i;
    buttons.forEach(b => {
      const label = ((b.getAttribute('aria-label') || '') + ' ' + b.textContent).trim();
      const isCloseSymbol = /^[×✕xX]$/.test(label);   // 아이콘만 있는 닫기 버튼(텍스트가 기호 하나뿐)
      if (closeWord.test(label) || isCloseSymbol) throw new Error('close-like button found: ' + label);
    });
  });
}

  // 시간대절로 전환(convertedTo='charter') → 유저가 일반예약 세그먼트 탭 → 다시 시간대절
  // 세그먼트 탭 → 대절 시간 확정. setType()이 convertedTo를 비우지 않으면 여기서 왕복 방지가
  // 영구히 남아 9913 넛지가 뜨지 않는다.
  test('시트 전환 후 세그먼트를 오가면 왕복 방지가 풀린다', ()=>{
    S = fresh('golf','normal'); S.pickupAt = new Date(); render();
    convert('charter');                 // 9915 넛지 CTA로 전환한 것과 동일한 경로(convertedTo='charter')
    eq(S.convertedTo, 'charter');
    setType('normal');                  // 유저가 세그먼트를 직접 탭
    setType('charter');                 // 다시 세그먼트를 직접 탭
    eq(S.convertedTo, null);
    S.charterHours = 3;                 // 대절 3시간 확정 (golf 시나리오 etaMin=65 < 3*60*0.5=90)
    eq(judgeNudge(S).reason, 'short-trip');   // 9913 넛지가 정상적으로 뜬다
  });
  test('넛지로 전환한 경우에만 반대 넛지가 억제된다', ()=>{
    S = fresh('golf','charter'); S.charterHours = 3; S.pickupAt = new Date();

    eq(fmtTimeLabel(new Date(2026,11,12,0,0)),   '오전 12시 정각');

  // 헤드리스에서는 실제 스와이프 타이밍 경쟁을 재현할 수 없으므로, 대신 선택 상태가

  // 수정 9: 카드 안 확정 버튼(#pickup-wheel-confirm)이 마스터 Figma에 없어 제거됐다.
  // 확정은 이제 하단 전역 CTA(#cta)가 맡으므로 그걸 누르는 걸로 바꾼다.
  test('휠 확정값은 스크롤 위치에 오염되지 않는다', ()=>{
    S = fresh('normal','normal'); S.openCard = 'pickup'; render();
    const hourEl = document.getElementById('wheel-pickup-hour');
    const items = hourEl.querySelectorAll('.rt-wheel-item');
    const pickIdx = 5;
    items[pickIdx].dispatchEvent(new MouseEvent('click', { bubbles: true }));
    eq(Number(hourEl.dataset.index), pickIdx, '클릭 직후 선택 인덱스');
    // 프로그램 스무스 스크롤이 아직 목표에 도달하지 않은 도중의 scrollTop을 흉내낸다.
    // 방금 고른 값(5)과 무관한 중간 위치로 강제로 바꾸고 scroll 이벤트를 디스패치한다.
    hourEl.scrollTop = 2 * WHEEL_ROW_H;

    document.getElementById('cta').click();
    eq(S.pickupAt.getHours(), pickupWheelHours()[pickIdx], '휠 확정값');
  });

  // 항상 하단 CTA 하나뿐이고 time card 안에는 chip_button만 있을 뿐 Solid 버튼이 없다.
  // 카드 안 확정 버튼을 없애고 하단 CTA가 열린 휠을 확정하도록 바꾼 게 이 세 테스트다.

    S = fresh('short','charter'); S.pickupAt = new Date(); S.openCard = 'charter'; render();
    for (const id of ['card-pickup','card-charter']) {

      const solid = [...card.querySelectorAll('button')].filter(b => (b.textContent||'').indexOf('설정 완료') >= 0);
      if (solid.length) throw new Error(id + ' 안에 설정 완료 버튼이 ' + solid.length + '개 있다');

  test('화면에 설정 완료 버튼은 하나뿐이다', ()=>{

/* ---- Task 8: 레이아웃 실측 ----
   보이는 프레임(.rt-phone)에 transform:scale이 걸리면 getBoundingClientRect가 축소된
   값을 준다. 아래 테스트는 getComputedStyle 기반(px)이라 scale의 영향을 받지 않지만,
   측정 전 CSS transition을 꺼서 진입 애니메이션 중간값을 재는 사고를 막는다. */
function ensureNoTransitionForMeasurement(){
  if (document.getElementById('rt-measure-style')) return;
  const style = document.createElement('style');
  style.id = 'rt-measure-style';
  style.textContent = '*{transition:none !important;}';
  document.head.appendChild(style);
}
function px(el, prop){ return Math.round(parseFloat(getComputedStyle(el)[prop])); }

  // .rt-seg 밖 #nudge 안에서도 나온다. 예외를 '.rt-seg 또는 #nudge'로 넓힌다.
  // v7(Figma 실측 §7): 휠 선택 행 글자색이 --wheel-band-ink #0094F9 → #0086EA로 바뀌었는데,
  // 이 값이 기존 --nudge-accent(#0086EA, 그동안 실제로는 쓰이지 않던 토큰)와 우연히 같은
  // hex다. 두 예외를 ACCENT_0086EA 하나로 합치고 '#nudge 또는 .rt-wheel-col 안'을 둘 다
  // 허용한다(따로 두면 먼저 매칭되는 쪽의 조건만 걸려 죽은 분기가 된다).
  // 휠 미선택 행 글자색 #7282A6(Figma 실측 §7)도 채도 30을 넘는 새 값이라 예외로 추가한다.
  // v8: 어시스트 라인(#assist)이 판정 완료 상태에서 새 강조색 두 개를 쓴다. 별 색 #32A2FA는
  // 기존 어떤 예외와도 다른 새 hex라 ASSIST_ACCENT로 따로 추가하고, 글자색 #31487D는
  // #nudge(본문)가 이미 쓰던 PILL_ACCENT와 같은 값이라 그 예외 범위를 #assist까지 넓힌다.

    S = fresh('golf','normal'); S.pickupAt = new Date(); S.openCard = 'pickup'; render();
    const NAVY = 'rgb(25, 37, 77)';          // --navy #19254d, 유일한 전역 강조색
    const ACCENT_0086EA = 'rgb(0, 134, 234)'; // --nudge-accent / --wheel-band-ink #0086EA, #nudge 또는 .rt-wheel-col 안에서만 허용
    const PILL_ACCENT = 'rgb(49, 72, 125)';  // #31487D, .rt-seg(선택된 칩 배경)/#nudge(본문 글자)/#assist(판정 완료 글자) 안에서만 허용
    const WHEEL_MUTED = 'rgb(114, 130, 166)'; // #7282A6, 휠 미선택 행 글자색. 휠 컬럼 안에서만 허용
    const ASSIST_ACCENT = 'rgb(50, 162, 250)'; // #32A2FA, #assist(판정 완료 별 색) 안에서만 허용
    const rgbRe = /^rgb\((\d+), (\d+), (\d+)\)$/;
    const els = document.querySelectorAll('#phone *');
    for (const el of els){
      const cs = getComputedStyle(el);
      for (const prop of ['color', 'backgroundColor']){
        const v = cs[prop];
        if (v === NAVY) continue;
        if (v === ACCENT_0086EA){
          if (el.closest('#nudge') || el.closest('.rt-wheel-col')) continue;
          throw new Error(`unexpected accent ${prop}=${v} outside #nudge/.rt-wheel-col`);
        }
        if (v === PILL_ACCENT){
          if (el.closest('.rt-seg') || el.closest('#nudge') || el.closest('#assist')) continue;
          throw new Error(`unexpected accent ${prop}=${v} outside .rt-seg/#nudge/#assist`);
        }
        if (v === ASSIST_ACCENT){
          if (el.closest('#assist')) continue;
          throw new Error(`unexpected accent ${prop}=${v} outside #assist`);
        }
        if (v === WHEEL_MUTED){
          if (el.closest('.rt-wheel-col')) continue;
          throw new Error(`unexpected accent ${prop}=${v} outside wheel column`);
        }
        const m = v.match(rgbRe);
        if (!m) continue;   // transparent, rgba(...) 등은 강조색 검사 대상이 아니다
        const [r,g,b] = m.slice(1).map(Number);
        const saturation = Math.max(r,g,b) - Math.min(r,g,b);   // 무채색(회색 계열)은 낮다
        if (saturation > 30) throw new Error(`unexpected accent ${prop}=${v}`);
      }
    }
  });

  // 옮겨가지 않으므로(고정 영역엔 CTA만 남는다) 그 전제가 사라졌다. 같은 번호(9915)·같은 시나리오
  // (fresh('golf','normal'))를 유지하되, 9913 테스트와 대응하는 '스크롤 맨 뒤' 검사로 대체한다.

    eq(getComputedStyle(lead).textAlign, 'center');
  });
  test('넛지 버튼이 가운데 정렬이다', ()=>{
    S = fresh('golf','normal'); S.pickupAt = new Date(); render();
    const n = document.getElementById('nudge'), b = document.getElementById('nudge-cta');
    const nr = n.getBoundingClientRect(), br = b.getBoundingClientRect();
    if (Math.abs((nr.left+nr.right)/2 - (br.left+br.right)/2) > 1.5)
      throw new Error('nudge cta not centered');
  });
  test('넛지 일러스트가 64x64 로 들어간다', ()=>{
    for (const [sc, tp, hrs, key] of [['golf','normal',null,'golf'], ['short','charter',3,'shorttrip']]) {
      S = fresh(sc, tp); S.pickupAt = new Date(); if (hrs) S.charterHours = hrs; render();
      const img = document.querySelector('#nudge img');
      if (!img) throw new Error(sc + ': no illustration');
      if (!img.src.startsWith('data:image/')) throw new Error(sc + ': illustration not inlined');
      const r = img.getBoundingClientRect();
      eq(Math.round(r.width), 64); eq(Math.round(r.height), 64);
    }
  });
  // v7(Figma 실측 §5): 카드 컨테이너 gap이 10이다. #type-lead를 .rt-scroll 밖(칩 줄과 같은
  // 고정 영역)으로 옮겨, .rt-scroll에는 이제 카드/넛지만 남는다. 그래서 과제 지시문 그대로
  // .rt-scroll의 rowGap을 바로 잰다(별도 셀렉터 조정 없이 통과한다).
  test('카드 사이 간격이 10 이다', ()=>{
    S = fresh('golf','normal'); S.pickupAt = new Date(); S.openCard = 'none'; render();
    const s = document.querySelector('#screen-input .rt-scroll');
    eq(getComputedStyle(s).rowGap, '10px');
  });
}
// ---- Task 9(v8): AI 어시스트 라인 ----
// ?selftest=1에서는 assistSkipAnim()이 true라 render() 한 번으로 최종 상태(판정 완료, 글자
// 전체, 넛지 등장)까지 동기적으로 끝난다. 타이머를 기다리지 않는다.
function runAssistTests(){
  // v10(항목 5): 문구가 결론(dir 기반: "시간대절이 필요해보여요"/"일반예약으로도 충분해보여요")
  // 에서 발견(reason 기반: ASSIST_DISCOVERY)으로 바뀌었다. 여기서는 "판정 결과가 있으면 라인이
  // 보인다"는 원래 의도만 남기고, 정확한 문구 검사는 아래 '어시스트 문구는 결론이 아니라
  // 발견을 말한다'(runV10Tests)로 옮겼다.
  test('판정 결과가 있으면 어시스트 라인이 결과 문구를 보여준다', ()=>{
    for (const [sc, tp, hrs, want] of [
      ['golf','normal',null,'목적지가 골프장이에요'],
      ['short','charter',3,'대절 시간이 경로보다 길어요']]) {
      S = fresh(sc, tp); S.pickupAt = new Date(); if (hrs) S.charterHours = hrs; render();
      const a = document.getElementById('assist');
      eq(a.hidden, false);
      eq(document.getElementById('assist-text').textContent, want);
      if (getComputedStyle(a).display === 'none') throw new Error(sc + ': assist collapsed');
    }
  });
  test('판정 결과가 없으면 어시스트 라인이 사라진다', ()=>{
    S = fresh('normal','normal'); S.pickupAt = new Date(); render();
    eq(judgeNudge(S), null);
    const a = document.getElementById('assist');
    eq(a.hidden, true);
    eq(getComputedStyle(a).display, 'none');
  });
  // v10(항목 1): 원래 이름은 '어시스트 라인은 넛지 바로 위에 붙는다'였다(#nudge-wrap이 둘을
  // 간격 0으로 묶어 두던 시절). 픽업 카드가 펼쳐지면 그 자리가 실기기 화면 밖이라 어시스트를
  // 카드 컨테이너 맨 위로 옮기며 그 인접성을 포기했다(전용 테스트는 아래 '어시스트는 카드
  // 위, 넛지는 스크롤 맨 뒤' 참고). 대신 시각적 연결을 상호작용으로 옮겼으므로, 여기서는
  // "둘 사이가 붙어 있다"가 아니라 "어시스트를 누르면 넛지로 스크롤해 강조한다"를 검사한다.
  test('어시스트를 누르면 넛지가 강조된다(끊긴 인접성을 상호작용으로 대신한다)', ()=>{
    S = fresh('golf','normal'); S.pickupAt = new Date(); render();
    const a = document.getElementById('assist'), n = document.getElementById('nudge');
    eq(a.getAttribute('role'), 'button');
    n.classList.remove('rt-flash');
    a.click();
    if (!n.classList.contains('rt-flash')) throw new Error('assist click did not flash the nudge');
  });
  test('별 아이콘은 16x16 이고 Figma 원본 path 를 쓴다', ()=>{
    S = fresh('golf','normal'); S.pickupAt = new Date(); render();
    const p = document.querySelector('#assist-star path');
    if (!p) throw new Error('no star path');
    if (p.getAttribute('d').indexOf('M24 0L31.1276 16.8724L48 24') !== 0)
      throw new Error('star path is not the Figma original');
    const r = document.getElementById('assist-star').getBoundingClientRect();
    eq(Math.round(r.width), 16); eq(Math.round(r.height), 16);
  });
  // 밴드 위치는 CSS 변수(--wheel-inset/--wheel-pad/--wheel-row-h)에, 스크롤 계산은 JS 상수
  // (WHEEL_PAD/WHEEL_ROW_H)에 적혀 있다. 한쪽만 고치면 밴드가 선택 행에서 조용히 어긋난다.
  // 둘을 대조해 둔다.
  test('휠 선택 밴드가 JS 상수와 어긋나지 않는다', ()=>{
    S = fresh('golf','normal'); S.openCard = 'pickup'; render();
    const band = document.querySelector('#screen-input .rt-wheel-band');
    if (!band) throw new Error('no wheel band');
    const wheel = band.parentElement;
    const inset = parseFloat(getComputedStyle(wheel).paddingTop);
    eq(band.offsetTop, inset + WHEEL_PAD);
    eq(band.offsetHeight, WHEEL_ROW_H);
    // 밴드는 선택 행과 같은 자리에 있어야 한다. 선택된 항목의 화면 위치와 대조한다.
    const sel = document.querySelector('#screen-input .rt-wheel-col .rt-wheel-item.is-selected');
    if (sel){
      const br = band.getBoundingClientRect(), sr = sel.getBoundingClientRect();
      if (Math.abs(br.top - sr.top) > 1)
        throw new Error('band top ' + br.top + ' != selected row top ' + sr.top);
    }
  });
}

// ---- v10: 디자인 비평 개선 8건 ----
function runV10Tests(){
  test('어시스트는 카드 위, 넛지는 스크롤 맨 뒤', ()=>{
    S = fresh('golf','normal'); S.pickupAt = new Date(); render();
    const s = document.querySelector('#screen-input .rt-scroll');
    const a = document.getElementById('assist'), n = document.getElementById('nudge');
    eq(s.firstElementChild, a);
    eq(s.lastElementChild, n);
    if (document.getElementById('nudge-wrap')) throw new Error('nudge-wrap should be gone');
    const ar = a.getBoundingClientRect(), rr = document.getElementById('card-route').getBoundingClientRect();
    if (ar.bottom > rr.top) throw new Error('assist must sit above the route card');
  });
  test('판정 결과가 있으면 어시스트를 눌러 넛지로 갈 수 있다', ()=>{
    S = fresh('golf','normal'); S.pickupAt = new Date(); render();
    const a = document.getElementById('assist');
    eq(a.getAttribute('role'), 'button');
    eq(a.getAttribute('tabindex'), '0');
    S = fresh('normal','normal'); S.pickupAt = new Date(); render();
    eq(document.getElementById('assist').getAttribute('role'), null);
  });
  test('9913 은 설정 완료를 가로막지 않는다', ()=>{
    S = fresh('short','charter'); S.pickupAt = new Date(); S.charterHours = 3; S.openCard = 'none'; render();
    eq(judgeNudge(S).dir, 'to-normal');
    eq(ctaLabel(S), '설정 완료');
    onCtaPress();
    eq(S.screen, 'vehicle');            // 바로 넘어간다
    eq(S.nudgeAcked, false);
  });
  test('9915 는 첫 설정 완료를 한 번 가로막는다', ()=>{
    S = fresh('golf','normal'); S.pickupAt = new Date(); S.openCard = 'none'; render();
    onCtaPress();
    eq(S.screen, 'input');
    onCtaPress();
    eq(S.screen, 'vehicle');
  });
  test('대절 시간 카드가 판단 근거를 보여 준다', ()=>{
    S = fresh('golf','charter'); S.pickupAt = new Date(); S.openCard = 'charter'; render();
    const hint = document.querySelector('#card-charter .rt-card-hint');
    if (!hint) throw new Error('no charter hint');
    if (hint.textContent.indexOf('편도') < 0) throw new Error('hint must state the one-way time');
    if (hint.textContent.indexOf('골프장') < 0) throw new Error('golf destination should get a duration hint');
  });
  test('픽업 시간만 바뀌면 어시스트가 다시 판정하지 않는다', ()=>{
    S = fresh('golf','normal'); S.pickupAt = new Date(); render();
    const sig1 = judgeSignature(S);
    S.pickupAt = new Date(Date.now() + 3600000); render();
    eq(judgeSignature(S), sig1);
    S.route.to = null; render();
    if (judgeSignature(S) === sig1) throw new Error('route change must change the signature');
  });
  // 원안의 want 키는 'noreturn'/'long'이었으나 이 코드베이스의 SCENARIOS 키는 'noReturn'/
  // 'longDistance'다(다른 값은 fresh()가 sc.route를 읽다 던진다). 실제 키에 맞게 조정했다.
  test('어시스트 문구는 결론이 아니라 발견을 말한다', ()=>{
    const want = { golf:'목적지가 골프장이에요', noReturn:'복귀 차량이 드문 지역이에요',
                   longDistance:'장거리 경로예요' };
    for (const sc in want){
      S = fresh(sc,'normal'); S.pickupAt = new Date(); render();
      eq(document.getElementById('assist-text').textContent, want[sc]);
    }
    S = fresh('short','charter'); S.pickupAt = new Date(); S.charterHours = 3; render();
    eq(document.getElementById('assist-text').textContent, '대절 시간이 경로보다 길어요');
  });
  // 원안은 render() 직후 최종(is-done) 상태의 별 색이 옛 #868B9C가 아닌지만 봤다. 하지만
  // ?selftest=1은 assistSkipAnim()이 항상 참이라 "확인 중" -> "완료"가 같은 틱에 끝나, 렌더
  // 직후엔 이미 is-done(파란 #32A2FA)이라 그 단언은 애초에 우리가 뭘 하든 항상 참이었다
  // (뮤테이션을 못 잡는 죽은 테스트). is-checking 클래스를 직접 걸어 CSS 규칙 자체를
  // 검사하도록 조정했다. 상태기계 타이밍과 무관하게 회귀를 잡는다.
  test('판정 중 별 색이 비텍스트 대비 3:1 을 넘는다', ()=>{
    // #6E7385 on #E6E9EF = 3.88:1
    const assistEl = document.getElementById('assist');
    assistEl.hidden = false;
    assistEl.classList.remove('is-done');
    assistEl.classList.add('is-checking');
    const st = document.getElementById('assist-star');
    const c = getComputedStyle(st).color;
    if (c === 'rgb(134, 139, 156)') throw new Error('still the old #868B9C (2.79:1)');
    eq(c, 'rgb(110, 115, 133)');   // #6E7385
  });
  test('긴 목적지가 접힌 경로 카드에서 잘리지 않는다', ()=>{
    S = fresh('golf','normal'); S.pickupAt = new Date(); S.openCard = 'none';
    S.route.from = '서울특별시 강남구 테헤란로 152 강남파이낸스센터';
    S.route.to   = '인천광역시 중구 공항로 272 제2여객터미널';
    render();
    const v = document.querySelector('#card-route .rt-card-value');
    if (!v) throw new Error('no collapsed value');
    if (v.textContent.indexOf('제2여객터미널') < 0)
      throw new Error('destination must survive: ' + v.textContent);
    if (v.scrollWidth > v.clientWidth + 1)
      throw new Error('value overflows: ' + v.scrollWidth + ' > ' + v.clientWidth);
  });
  // 원안 셀렉터는 '#screen-input .rt-seg'(칩 두 개를 담은 컨테이너)였다. 그 컨테이너는
  // padding:16이 있어 높이가 38이 아니라 ~70이라 eq(...,38)이 항상 실패한다. 항목 8의 CSS도
  // 실제로는 칩 하나하나(.rt-seg-tab)에 ::after를 건다(컨테이너 전체에 걸면 칩 두 개의
  // 터치 영역이 하나로 뭉친다). 셀렉터를 실제로 38인 개별 칩으로 조정했다.
  test('칩은 보이기엔 38 이지만 터치 영역은 44 다', ()=>{
    S = fresh('golf','normal'); render();
    const chip = document.querySelector('#screen-input .rt-seg .rt-seg-tab');
    eq(Math.round(chip.getBoundingClientRect().height), 38);
    eq(getComputedStyle(chip, '::after').height, '44px');
  });
}

function selftest(){
  T.length = 0;
  runJudgeTests();          // Task 1
  runInputTests();          // Task 2
  runConvertTests();        // Task 3
  runSheetTests();          // Task 4
  runLifecycleTests();      // Task 5
  runPreviewTests();        // Task 6
  runPanelTests();          // Task 7
  runLayoutTests();         // Task 8
  runAssistTests();         // Task 9 (v8)
  runV10Tests();            // v10: 디자인 비평 개선 8건
  const out = document.getElementById('selftest-out');
  const fail = T.filter(l=>l.startsWith('FAIL'));
  out.hidden = false;
  out.textContent = `SELFTEST ${T.length - fail.length}/${T.length} ${fail.length ? 'FAILED' : 'OK'}\n` + T.join('\n');
}
if (new URLSearchParams(location.search).has('selftest')) {
  window.addEventListener('load', selftest);
}
</script>
