  test('강조색은 navy 하나뿐 (폰 프레임 안, 브리지 열림)', ()=>{
    S = fresh('golf','normal'); S.pickupAt = new Date(); S.openCard = 'none'; render();
    onCtaPress();
    eq(document.getElementById('bridge').hidden, false);
    scanAccents();
  });
  // 수정 2: .rt-phone이 .rt-stage의 flex item이라 flex-shrink 기본값 때문에 좁은 뷰포트에서
  // 폭이 줄어들 수 있었다(390px 뷰포트에서 346px까지). offsetWidth는 transform:scale의 영향을
  // 받지 않으므로(지금은 scale을 안 쓰지만) getBoundingClientRect().width보다 안전하다.
  test('폰 프레임은 항상 360px 폭이다', ()=>{
    eq(document.getElementById('phone').offsetWidth, 360);
  });
  // v11: #nudge가 스크롤 맨 뒤에 있는지 보던 네 개 테스트('넛지가 스크롤 영역 안 카드들
  // 뒤에 있다', '짧은 경로/왕복/시외 넛지는 스크롤 영역 맨 뒤에 있다', '방향이 바뀌어도 넛지 자리는
  // 그대로다')는 전부 지운다. #nudge 자체가 없어졌고, 그 자리를 이제 #type-lead가 차지했다
  // (당시 스펙 §3: 카드 목록 맨 아래).
  // v14(스펙 §B): Figma가 리드 문구를 카드 목록 맨 아래에서 칩 그룹(.rt-seg) 안, 칩 줄
  // 바로 아래로 되돌렸다. "고정된 자리, 방향과 무관"이라는 의도 자체는 그대로라 이 테스트는
  // 남기되, 확인하는 자리를 .rt-scroll 맨 뒤에서 .rt-seg 맨 뒤로 바꾼다(신규 필수 테스트
  // '리드 문구가 칩 바로 아래에 있다'는 golf 시나리오 하나만 보므로, 이 테스트가
  // short/charter까지 함께 확인한다).
  test('리드 문구는 방향과 무관하게 칩 그룹 맨 뒤에 있다', ()=>{
    for (const [sc, tp, hrs] of [['golf','normal',null], ['short','charter',3]]) {
      S = fresh(sc, tp); S.pickupAt = new Date(); if (hrs) S.charterHours = hrs; render();
      const lead = document.getElementById('type-lead');
      const seg = document.querySelector('#screen-input .rt-seg');
      if (!seg.contains(lead)) throw new Error(sc + ': type-lead not in .rt-seg');
      eq(seg.lastElementChild, lead);
    }
  });
  // COPY[key].banner가 없어져(브리지도 title+body를 쓴다) title+body 조합이 reason 별로
  // 다른지로 검사한다. v11: 이름을 "배너"에서 "브리지"로 바꿨다(로직은 COPY 값만 보므로
  // #nudge/#bridge 어느 쪽이든 안 바뀐다).
  // v13(§v13-1): COPY 키가 golf/no-return/long-distance 셋에서 round-trip 하나로 줄어
  // 이제 키는 short-trip/round-trip 둘뿐이다. 검사 자체(서로 다른 카피인가)는 그대로 두고
  // 목록만 줄인다.
  test('브리지 문구가 reason 별로 다르다', ()=>{
    const seen = {};
    for (const key of ['short-trip','round-trip']) {
      const s = fresh('normal','normal'); s.etaMin = 48; s.charterHours = 3;
      const line = COPY[key].title(s) + '|' + COPY[key].body(s);
      if (seen[line]) throw new Error('duplicate copy: ' + line);
      seen[line] = 1;
    }
  });
  // v11: "배너 버튼 라벨이 방향을 말한다"는 지운다. 새 필수 테스트 '브리지 버튼 위계가
  // 방향마다 뒤집힌다'가 이미 두 방향의 주/보조 라벨을 정확히 검사한다.
  // v11: "넛지에 테두리와 radius 12가 있다"도 지운다. 브리지는 카드가 아니라 전체 화면
  // 오버레이라 테두리·radius 개념 자체가 없다(Figma 실측에도 없다, 스펙 §4).
  // v11(스펙 §2): 칩 묶음과 리드 문구가 가운데에서 좌측 정렬로 바뀌었다. .rt-seg가 패딩만
  // 갖는 바깥 그룹으로 쪼개지면서(HTML/CSS 참고) 실제 flex 정렬은 .rt-seg-row가 갖는다.
  test('칩 묶음과 리드 문구가 좌측 정렬이다', ()=>{
    S = fresh('golf','normal'); render();
    const row = document.querySelector('#screen-input .rt-seg-row');
    eq(getComputedStyle(row).justifyContent, 'flex-start');
    const lead = document.getElementById('type-lead');
    eq(getComputedStyle(lead).textAlign, 'left');
  });
  // v11: "넛지 버튼이 가운데 정렬이다"는 지운다. 브리지 버튼은 항상 폭 100%(.rt-bridge-actions
  // 안 버튼)라 "가운데 정렬"이라는 별도 개념이 없다(가운데든 아니든 카드 전체 폭을 채운다).
  // v11: "넛지 일러스트가 64x64로 들어간다"를 브리지 일러스트 120x120 검사로 옮긴다. 신규
  // 필수 테스트 '브리지 치수가 Figma 실측과 맞는다'는 golf 하나만 보므로, 여기서는 golf·
  // short-trip 둘 다(구 테스트가 하던 대로) 확인해 사유별 매핑(BRIDGE_ILLUST)까지 커버한다.
  // v12: naturalWidth도 같이 본다. 120 박스에 그리는 것만 보면 192px짜리를 1.6배로 늘려
  // 써도 통과해 버린다(v11까지 no-return이 실제로 그랬다). 원본이 최소 2배(240px)는 되는지
  // 확인해, 저해상도 임시 에셋이 조용히 다시 들어오는 걸 막는다.
  // v13: noReturn 시나리오는 지워지고 roundTrip이 그 자리를 대신한다. golf/longDistance/
  // roundTrip 셋 다 같은 BRIDGE_ILLUST['round-trip']를 가리키므로 사실상 중복 확인이지만,
  // 세 트리거 전부가 실제로 이 일러스트로 렌더되는지를 남겨 둔다.
  test('브리지 일러스트가 120x120 로 들어간다(사유별)', ()=>{
    for (const [sc, tp, hrs] of [['golf','normal',null], ['longDistance','normal',null],
                                 ['roundTrip','normal',null], ['short','charter',3]]) {
      S = fresh(sc, tp); S.pickupAt = new Date(); if (hrs) S.charterHours = hrs;
      S.openCard = 'none'; render(); onCtaPress();
      const img = document.getElementById('bridge-illust');
      if (!img.src.startsWith('data:image/')) throw new Error(sc + ': illustration not inlined');
      const r = img.getBoundingClientRect();
      eq(Math.round(r.width), 120); eq(Math.round(r.height), 120);
      // naturalWidth는 쓰지 않는다. data URI를 막 넣은 직후라 아직 디코드 전이면 0이고,
      // 0을 예외로 빼 두면 저해상도 에셋을 심어도 테스트가 그냥 통과한다(실제로 겪었다).
      // PNG 헤더(IHDR)의 width를 직접 읽는다. base64 앞 64자 = 48바이트면 충분하다.
      const bin = atob(img.src.split(',')[1].slice(0, 64));
      const w = (bin.charCodeAt(16) << 24) | (bin.charCodeAt(17) << 16)
              | (bin.charCodeAt(18) << 8)  |  bin.charCodeAt(19);
      if (w < 240)
        throw new Error(sc + ': illustration source is only ' + w + 'px for a 120 box');
    }
  });
  // v7(Figma 실측 §5): 카드 컨테이너 gap이 10이다. .rt-scroll의 rowGap을 바로 잰다(카드뿐

  test('카드 사이 간격이 10 이다', ()=>{

    const s = document.querySelector('#screen-input .rt-scroll');

  });

// ---- v11: 휠 선택 밴드 ----
// runAssistTests()였다. AI 어시스트 라인이 폐기 확정되며(사용자 확인 완료, Figma에도 0건)
// 그 테스트 네 개('판정 결과가 있으면/없으면 어시스트 라인이...', '어시스트를 누르면 넛지가
// 강조된다', '별 아이콘은 16x16...')는 지웠다. 남기는 이유가 있는 건 휠 선택 밴드 검사
// 하나뿐이라(어시스트와 무관한 로직인데 같은 함수에 얹혀 있었다) 이름을 바꿔 계속 돌린다.
function runWheelTests(){
  // 밴드 위치는 CSS 변수(--wheel-inset/--wheel-pad/--wheel-row-h)에, 스크롤 계산은 JS 상수
  // (WHEEL_PAD/WHEEL_ROW_H)에 적혀 있다. 한쪽만 고치면 밴드가 선택 행에서 조용히 어긋난다.
  // 둘을 대조해 둔다.
  test('휠 선택 밴드가 JS 상수와 어긋나지 않는다', ()=>{
    S = fresh('golf','normal'); S.openCard = 'pickup'; render();
    const band = document.querySelector('#screen-input .rt-wheel-band');
    if (!band) throw new Error('no wheel band');
    const wheel = band.parentElement;
    const inset = parseFloat(getComputedStyle(wheel).paddingTop);
    eq(band.offsetTop, inset + WHEEL_PAD);
    eq(band.offsetHeight, WHEEL_ROW_H);
    // 밴드는 선택 행과 같은 자리에 있어야 한다. 선택된 항목의 화면 위치와 대조한다.
    const sel = document.querySelector('#screen-input .rt-wheel-col .rt-wheel-item.is-selected');
    if (sel){
      const br = band.getBoundingClientRect(), sr = sel.getBoundingClientRect();
      if (Math.abs(br.top - sr.top) > 1)
        throw new Error('band top ' + br.top + ' != selected row top ' + sr.top);
    }
  });
}

// ---- v10 잔존분(디자인 비평 개선 8건 중 어시스트/넛지와 무관하게 아직 유효한 것) ----
// 원래 이름은 runV10Tests. 지운 것: '어시스트는 카드 위, 넛지는 스크롤 맨 뒤'·'판정 결과가
// 있으면 어시스트를 눌러 넛지로 갈 수 있다'(둘 다 #assist/#nudge DOM 자체가 없어짐),
// '짧은 경로는 설정 완료를 가로막지 않는다'(v11에서 전제가 뒤집혔다. 이제 짧은 경로도 브리지로
// 막는다, runSheetTests 주석 참고), '픽업 시간만 바뀌면 어시스트가 다시 판정하지 않는다'
// (judgeSignature() 자체를 지웠다), '어시스트 문구는 결론이 아니라 발견을 말한다'·'판정 중
// 별 색이 비텍스트 대비 3:1을 넘는다'(#assist 전용), '칩은 보이기엔 38이지만 터치 영역은
// 44다'(::after 터치 확장을 지웠다. 이제 실제 높이가 44라 그 자체가 터치 영역이다).
function runV10Tests(){
  test('왕복/시외는 조건이 맞는 한 설정 완료를 계속 가로막는다', ()=>{
    S = fresh('golf','normal'); S.pickupAt = new Date(); S.openCard = 'none'; render();
    onCtaPress();
    eq(S.screen, 'input');
    document.getElementById('bridge-secondary').click();   // 이대로 계속하기
    eq(S.screen, 'vehicle');
  });
  test('대절 시간 카드가 판단 근거를 보여 준다', ()=>{
    S = fresh('golf','charter'); S.pickupAt = new Date(); S.openCard = 'charter'; render();
    const hint = document.querySelector('#card-charter .rt-card-hint');
    if (!hint) throw new Error('no charter hint');
    if (hint.textContent.indexOf('편도') < 0) throw new Error('hint must state the one-way time');
    if (hint.textContent.indexOf('골프장') < 0) throw new Error('golf destination should get a duration hint');
  });
  test('긴 목적지가 접힌 경로 카드에서 잘리지 않는다', ()=>{
    S = fresh('golf','normal'); S.pickupAt = new Date(); S.openCard = 'none';
    S.route.from = '서울특별시 강남구 테헤란로 152 강남파이낸스센터';
    S.route.to   = '인천광역시 중구 공항로 272 제2여객터미널';
    render();
    const v = document.querySelector('#card-route .rt-card-value');
    if (!v) throw new Error('no collapsed value');
    if (v.textContent.indexOf('제2여객터미널') < 0)
      throw new Error('destination must survive: ' + v.textContent);
    if (v.scrollWidth > v.clientWidth + 1)
      throw new Error('value overflows: ' + v.scrollWidth + ' > ' + v.clientWidth);
  });
  // v13: 왕복은 출발지와 도착지가 같다. 경유지를 요약에서 빼면 '강남역 2번 출구, 강남역
  // 2번 출구'가 되어 정작 어디를 가는지가 사라진다(Figma 도 '출발, 경유, 도착' 순으로
  // 적는다). 축약이 걸려 출발지를 버리더라도 경유지는 남아야 한다.
  // v13: 펼친 경로 카드도 경유지 행을 그려야 한다. 안 그리면 왕복 시나리오가
  // '출발 강남역 / 도착 강남역'으로만 보여 화면이 고장난 것처럼 읽힌다.
  test('펼친 경로 카드가 경유지 행을 그린다', ()=>{
    S = fresh('roundTrip','normal'); S.openCard = 'route'; render();
    const rows = [...document.querySelectorAll('#card-route .rt-route-row')];
    eq(rows.length, 3);                                   // 출발 + 경유 1 + 도착
    const via = document.querySelector('#card-route .rt-route-row-via');
    if (!via) throw new Error('경유지 행이 없다');
    if (via.textContent.indexOf('남서울컨트리클럽') < 0)
      throw new Error('경유지 이름이 없다: ' + via.textContent);
    eq(via.querySelector('.rt-via-no').textContent, '1');
    // 순서: 출발 -> 경유 -> 도착
    eq(rows[1], via);
    S = fresh('golf','normal'); S.openCard = 'route'; render();
    eq(document.querySelectorAll('#card-route .rt-route-row').length, 2);   // 경유지 없으면 두 줄
  });
  test('왕복 경로 요약에 경유지가 들어간다', ()=>{
    S = fresh('roundTrip','normal'); S.pickupAt = new Date(); S.openCard = 'none'; render();
    const v = document.querySelector('#card-route .rt-card-value');
    if (v.textContent.indexOf('남서울컨트리클럽') < 0)
      throw new Error('경유지가 빠졌다: ' + v.textContent);
    if (v.scrollWidth > v.clientWidth + 1)
      throw new Error('value overflows: ' + v.scrollWidth + ' > ' + v.clientWidth);
  });
}

// ---- v11: 브리지(스펙 §4) ----
function runBridgeTests(){
  test('설정 완료를 누르면 브리지가 뜬다', ()=>{
    for (const [sc, tp, hrs] of [['golf','normal',null], ['short','charter',3]]) {
      S = fresh(sc, tp); S.pickupAt = new Date(); if (hrs) S.charterHours = hrs;
      S.openCard = 'none'; render();
      eq(ctaLabel(S), '설정 완료');
      onCtaPress();
      const b = document.getElementById('bridge');
      eq(b.hidden, false);
      eq(S.screen, 'input');
      if (getComputedStyle(b).display === 'none') throw new Error(sc + ': bridge collapsed');
    }
  });
  test('브리지 버튼 위계가 방향마다 뒤집힌다', ()=>{
    S = fresh('golf','normal'); S.pickupAt = new Date(); S.openCard='none'; render(); onCtaPress();
    eq(document.getElementById('bridge-primary').textContent, '시간대절로 변경하기');
    eq(document.getElementById('bridge-secondary').textContent, '이대로 계속하기');
    S = fresh('short','charter'); S.pickupAt = new Date(); S.charterHours = 3; S.openCard='none'; render(); onCtaPress();
    eq(document.getElementById('bridge-primary').textContent, '이대로 계속하기');
    eq(document.getElementById('bridge-secondary').textContent, '일반예약으로 변경하기');
  });
  test('주버튼은 언제나 navy, 보조는 언제나 회색', ()=>{
    for (const [sc, tp, hrs] of [['golf','normal',null], ['short','charter',3]]) {
      S = fresh(sc, tp); S.pickupAt = new Date(); if (hrs) S.charterHours = hrs;
      S.openCard='none'; render(); onCtaPress();
      eq(getComputedStyle(document.getElementById('bridge-primary')).backgroundColor, 'rgb(25, 37, 77)');
      eq(getComputedStyle(document.getElementById('bridge-secondary')).backgroundColor, 'rgb(230, 233, 239)');
    }
  });
  test('짧은 경로에서 navy 버튼은 그대로 진행이다', ()=>{
    S = fresh('short','charter'); S.pickupAt = new Date(); S.charterHours = 3; S.openCard='none';
    render(); onCtaPress();
    document.getElementById('bridge-primary').click();
    eq(S.screen, 'vehicle');
    eq(S.type, 'charter');                 // 전환되지 않았다
    eq(document.getElementById('bridge').hidden, true);
  });
  test('왕복/시외에서 navy 버튼은 시간대절로 전환한다', ()=>{
    S = fresh('golf','normal'); S.pickupAt = new Date(); S.openCard='none';
    render(); onCtaPress();
    document.getElementById('bridge-primary').click();
    eq(S.type, 'charter');
    eq(S.convertedTo, 'charter');
    eq(document.getElementById('bridge').hidden, true);
  });
  test('이대로 계속하기를 누르면 그대로 진행한다', ()=>{
    S = fresh('golf','normal'); S.pickupAt = new Date(); S.openCard='none'; render();
    onCtaPress();
    document.getElementById('bridge-secondary').click();
    eq(S.screen, 'vehicle');
    eq(S.type, 'normal');
    eq(document.getElementById('bridge').hidden, true);
  });
  test('판정이 없으면 브리지 없이 바로 넘어간다', ()=>{
    S = fresh('normal','normal'); S.pickupAt = new Date(); S.openCard='none'; render();
    eq(judgeNudge(S), null);
    onCtaPress();
    eq(S.screen, 'vehicle');
    eq(document.getElementById('bridge').hidden, true);
  });
  test('브리지 치수가 Figma 실측과 맞는다', ()=>{
    S = fresh('golf','normal'); S.pickupAt = new Date(); S.openCard='none'; render(); onCtaPress();
    const img = document.getElementById('bridge-illust').getBoundingClientRect();
    eq(Math.round(img.width), 120); eq(Math.round(img.height), 120);
    const t = getComputedStyle(document.getElementById('bridge-title'));
    eq(t.fontSize, '22px'); eq(t.textAlign, 'center');
    for (const id of ['bridge-primary','bridge-secondary'])
      eq(Math.round(document.getElementById(id).getBoundingClientRect().height), 52);
  });
  // 원안 셀렉터는 '#screen-input .rt-seg'(칩 두 개를 감싸는 바깥 그룹)였다. v11에서 .rt-seg를
  // 패딩만 갖는 바깥 그룹과 실제 flex 줄(.rt-seg-row)로 나눠서(HTML/CSS 참고), '.rt-seg'로
  // querySelectorAll하면 칩이 아니라 그룹 하나만 잡혀 chips.length가 2가 아니라 1이 된다.
  // 개별 칩 클래스 '.rt-seg-tab'으로 바꿨다.
  // v13(§v13-2): "칩은 높이 44에... 아이콘이 유형에 고정된다"는 지운다. 높이가 40으로
  // 바뀌었고, 무엇보다 "아이콘이 유형에 고정된다"의 검증 방식(선택이 바뀌어도 같은 버튼의
  // img.src가 그대로인지)이 이제 성립하지 않는다. 비선택 칩엔 아예 <img>가 없어지므로
  // (스펙 §v13-2) 선택이 바뀌면 그 버튼의 img 자체가 사라진다. 좌측 정렬은 아래 '칩 묶음과
  // 리드 문구가 좌측 정렬이다'가 이미 보고, 높이/아이콘 유무/라벨색은 아래 runV13Tests의
  // '칩은 높이 40, 선택에만 아이콘...'과 '칩 아이콘이 유형에 맞게 붙는다'가 대신한다.
  // v14(스펙 §B): v11이 리드 문구를 칩 줄 아래에서 카드 목록 맨 아래로 옮겼던 걸, Figma가
  // 다시 칩 그룹(.rt-seg) 안, 칩 바로 아래로 되돌렸다. "카드 아래에 있다"는 전제가
  // 뒤집혀서(이제 카드보다 위에 있다) 이 테스트는 지우고, 대신 "칩 그룹 안, 칩 바로
  // 아래"를 검사하는 테스트로 바꾼다. 원 셀렉터는 사용자 제공 새 테스트가 '.rt-seg-row'의
  // parentElement로 그룹을 찾는 방식이라 그대로 따른다(= .rt-seg).
  test('리드 문구가 칩 바로 아래에 있다', ()=>{
    S = fresh('golf','normal'); S.pickupAt = new Date(); S.openCard='none'; render();
    const lead = document.getElementById('type-lead');
    const row = document.querySelector('#screen-input .rt-seg-row');
    const group = row.parentElement;
    eq(lead.parentElement, group);                       // 칩 그룹 안
    eq(group.lastElementChild, lead);
    eq(getComputedStyle(group).rowGap, '12px');
    eq(lead.textContent.indexOf('사용해요') >= 0, true);
    const card = document.getElementById('card-route').getBoundingClientRect();
    if (lead.getBoundingClientRect().bottom > card.top)
      throw new Error('리드가 카드 위에 있어야 한다');
  });
  test('어시스트와 넛지는 완전히 사라졌다', ()=>{
    for (const id of ['assist','assist-star','assist-text','nudge','nudge-cta','nudge-wrap'])
      if (document.getElementById(id)) throw new Error(id + ' still exists');
    if (typeof window.flashNudge === 'function') throw new Error('flashNudge should be gone');
  });
}

// ---- v13: 트리거 2종 통합(§v13-1) + 유형 탭 재설계(§v13-2) ----
function runV13Tests(){
  test('왕복/시외 사유가 round-trip 하나로 합쳐졌다', ()=>{
    for (const sc of ['golf','longDistance','roundTrip']) {
      S = fresh(sc,'normal'); S.pickupAt = new Date();
      const n = judgeNudge(S);
      if (!n) throw new Error(sc + ': 판정이 없다');
      eq(n.dir, 'to-charter');
      eq(n.reason, 'round-trip');
    }
  });
  // v15(2026-09-22 PRD): 골프장은 트리거에서 빠지고 시외 시나리오로 흡수됐다.
  // 그래서 수도권 밖 골프장은 longDistance 로 걸리고, 수도권 안 골프장은 안 걸린다.
  test('골프장은 그 자체로 트리거가 아니다. 수도권 밖일 때만 걸린다', ()=>{
    S = fresh('golfMetro','normal'); S.pickupAt = new Date();
    eq(S.flags.golf, true);
    eq(S.flags.longDistance, false);
    eq(judgeNudge(S), null);                       // 수도권 안 골프장 = 트리거 아님
    S = fresh('golf','normal'); S.pickupAt = new Date();
    eq(S.flags.golf, true);
    eq(S.flags.longDistance, true);
    eq(judgeNudge(S).reason, 'round-trip');        // 수도권 밖 = 시외로 걸린다
  });
  test('복귀 불가 지역은 더 이상 트리거가 아니다', ()=>{
    if (SCENARIOS.noReturn) throw new Error('noReturn 시나리오가 남아 있다');
    S = fresh('normal','normal'); S.pickupAt = new Date();
    S.flags.noReturnCall = true; render();
    eq(judgeNudge(S), null);
  });
  test('왕복 판정은 출발지=도착지 + 경유지 1개 이상', ()=>{
    S = fresh('roundTrip','normal');
    eq(isRoundTrip(S), true);
    S.route.vias = [];
    eq(isRoundTrip(S), false);
    S = fresh('normal','normal');
    eq(isRoundTrip(S), false);
  });
  test('골프 일러스트는 더 이상 번들에 없다', ()=>{
    if (typeof ILLUST_BRIDGE_GOLF !== 'undefined') throw new Error('ILLUST_BRIDGE_GOLF 가 남아 있다');
  });
  // v13(§v13-2, 13339:84831 4배 렌더 실측): 칩 높이 40, 배경·라벨색은 audit(REST) 실측.
  // v14(스펙 §A, B안): "선택에만 아이콘" 전제가 뒤집혔다(이제 양쪽 다 아이콘이 있다). 그
  // 부분 단언은 지우고, 아이콘 유무와 불투명도, 매핑은 아래 새 테스트들로 옮긴다.
  // 이 테스트는 높이·배경, 라벨색만 남긴다.
  test('칩은 높이 40, 배경과 라벨색이 Figma 실측과 맞는다', ()=>{
    S = fresh('golf','normal'); render();
    let chips = [...document.querySelectorAll('#screen-input .rt-seg-tab')];
    eq(chips.length, 2);
    eq(Math.round(chips[0].getBoundingClientRect().height), 40);
    eq(getComputedStyle(chips[0]).backgroundColor, 'rgb(209, 212, 219)');   // #D1D4DB
    eq(getComputedStyle(chips[1]).backgroundColor, 'rgb(232, 235, 240)');   // #E8EBF0
    const lab = chips.map(c => getComputedStyle(c.querySelector('.rt-seg-label') || c).color);
    eq(lab[0], 'rgb(25, 37, 77)');    // #19254D
    eq(lab[1], 'rgb(56, 79, 133)');   // #384F85
  });
  // v14(스펙 §A, B안): 선택 칩은 유형과 무관하게 항상 공통 체크 배지(CHIP_ICON_CHECK)이고,
  // 비선택 칩은 그 칩의 유형 아이콘(일반예약=CHIP_ICON_DESTINATION 위치 핀, 시간대절=
  // CHIP_ICON_NODE_CALL 파란 원)을 45% 불투명도로 보여준다. 사용자 제공 필수 테스트를
  // 그대로 쓴다(셀렉터는 실제 마크업 '#screen-input .rt-seg-tab'과 일치해 변경 없음).
  // opacity는 getComputedStyle로 실제 렌더된 값을 읽는다(과거 naturalWidth를 data URI
  // 디코드 전에 읽어 0으로 통과해 버린 함정과 같은 종류 실수를 피하려면, "존재 여부"가
  // 아니라 "계산된 스타일값"을 봐야 한다).
  test('칩은 선택에 체크 배지, 비선택에 유형 아이콘 45%', ()=>{
    S = fresh('golf','normal'); render();
    let tabs = [...document.querySelectorAll('#screen-input .rt-seg-tab')];
    eq(tabs.length, 2);
    const selImg = tabs[0].querySelector('img'), unselImg = tabs[1].querySelector('img');
    if (!selImg || !unselImg) throw new Error('양쪽 칩 모두 아이콘이 있어야 한다');
    eq(Math.round(parseFloat(getComputedStyle(selImg).opacity) * 100), 100);
    eq(Math.round(parseFloat(getComputedStyle(unselImg).opacity) * 100), 45);
    const checkSrc = selImg.src;
    S = fresh('short','charter'); S.charterHours = 3; render();
    tabs = [...document.querySelectorAll('#screen-input .rt-seg-tab')];
    eq(tabs[1].querySelector('img').src, checkSrc);   // 선택 아이콘은 유형과 무관하게 같다
    if (tabs[0].querySelector('img').src === checkSrc)
      throw new Error('비선택은 체크 배지가 아니라 유형 아이콘이어야 한다');
  });
  // v14(스펙 §A-2, B안): 탭 전환 시 아이콘이 붙었다 떨어지며 칩 폭이 흔들리던 문제(A안)를
  // B안(양쪽 다 아이콘)으로 고쳤다. 실제로 폭이 고정됐는지 직접 잰다.
  test('탭을 전환해도 칩 폭이 그대로다', ()=>{
    S = fresh('golf','normal'); render();
    const a = [...document.querySelectorAll('#screen-input .rt-seg-tab')]
      .map(c => Math.round(c.getBoundingClientRect().width));
    S = fresh('golf','charter'); S.charterHours = 3; render();
    const b = [...document.querySelectorAll('#screen-input .rt-seg-tab')]
      .map(c => Math.round(c.getBoundingClientRect().width));
    if (Math.abs(a[0]-b[0]) > 1 || Math.abs(a[1]-b[1]) > 1)
      throw new Error('폭이 흔들린다: ' + a + ' -> ' + b);
  });
  // v13: "아이콘은 유형에 고정이지 선택 상태에 스왑되지 않는다"를 검사하던 자리다.
  // v14(스펙 §A): 이제 "유형에 고정"인 건 비선택일 때 보여주는 아이콘뿐이다(선택일 때는
  // 유형 무관 공통 체크 배지, 위 테스트가 이미 확인한다). 여기서는 비선택 아이콘이
  // CHIP_ICON_NODE_CHARTER(더 이상 존재하지 않음)가 아니라 올바른 신규 상수와 맞는지,
  // 그리고 "서로 다르기만 하면"이 아니라 어느 쪽이 어느 상수인지까지 직접 대조한다(매핑이
  // 통째로 뒤집혀도 잡도록: 일반예약=CHIP_ICON_DESTINATION, 시간대절=CHIP_ICON_NODE_CALL).
  test('비선택 칩 아이콘이 유형에 맞게 붙는다', ()=>{
    S = fresh('golf','normal'); render();
    let tabs = [...document.querySelectorAll('#screen-input .rt-seg-tab')];
    // golf/normal: seg-normal(0)이 선택, seg-charter(1)이 비선택 -> 파란 원(CHIP_ICON_NODE_CALL)
    eq(tabs[1].querySelector('img').src, CHIP_ICON_NODE_CALL, '비선택 시간대절은 NODE_CALL(파란 원)이어야 한다');
    S = fresh('short','charter'); S.charterHours = 3; render();
    tabs = [...document.querySelectorAll('#screen-input .rt-seg-tab')];
    // short/charter: seg-normal(0)이 비선택 -> 위치 핀(CHIP_ICON_DESTINATION)
    eq(tabs[0].querySelector('img').src, CHIP_ICON_DESTINATION, '비선택 일반예약은 CHIP_ICON_DESTINATION(위치 핀)이어야 한다');
    if (CHIP_ICON_DESTINATION === CHIP_ICON_NODE_CALL) throw new Error('두 유형 아이콘이 같은 값이다');
  });
  test('선택 칩은 눌리고 비선택 칩은 떠 있다', ()=>{
    S = fresh('golf','normal'); render();
    const chips = [...document.querySelectorAll('#screen-input .rt-seg-tab')];
    const sel = getComputedStyle(chips[0]).boxShadow;
    const unsel = getComputedStyle(chips[1]).boxShadow;
    if (sel.indexOf('inset') < 0) throw new Error('선택 칩에 inset 그림자가 없다');
    if (unsel.indexOf('inset') === 0) throw new Error('비선택 칩의 첫 그림자가 inset 이면 안 된다');
    if (sel === unsel) throw new Error('선택/비선택 그림자가 같다');
  });
  // v13(§B-4): 시각 높이는 40이지만 HIG 최소 터치 타깃 44는 지켜야 한다. ::after는 DOM에
  // 없어 getBoundingClientRect로 못 재므로, getComputedStyle(el, '::after')로 위/아래
  // 오프셋과 계산된 높이를 읽는다.
  test('칩 시각 높이는 40, 터치 타깃은 44로 확장된다', ()=>{
    S = fresh('golf','normal'); render();
    const chip = document.getElementById('seg-normal');
    eq(Math.round(chip.getBoundingClientRect().height), 40);
    const after = getComputedStyle(chip, '::after');
    eq(after.position, 'absolute');
    eq(Math.round(parseFloat(after.top)), -2);
    eq(Math.round(parseFloat(after.bottom)), -2);
    eq(Math.round(parseFloat(after.height)), 44);
  });
}

// ---- v14: 유형 칩 B안(§A) + 리드 문구 위치 복귀(§B) + CTA 여백(§C) + 브리지 개행/강조(§D·E) ----
function runV14Tests(){
  // §D: 개행 위치가 "왕복이라면 시간대절이" / "더 편해요"로 접혀야 한다. max-width로
  // word-break:keep-all이 그 지점에서 접히게 했으므로(openBridge/BRIDGE_TITLE_MAXW),
  // 정확히 두 줄(line-height 30 x2 = 60)인지로 확인한다.
  test('브리지 제목이 Figma 지점에서 접힌다', ()=>{
    S = fresh('golf','normal'); S.pickupAt = new Date(); S.openCard='none'; render(); onCtaPress();
    const t = document.getElementById('bridge-title');
    eq(getComputedStyle(t).fontSize, '22px');
    eq(getComputedStyle(t).lineHeight, '30px');
    eq(Math.round(t.getBoundingClientRect().height), 60);   // 정확히 2줄
    const d = document.getElementById('bridge-desc');
    eq(getComputedStyle(d).lineHeight, '22px');
  });
  // §D(짧은 경로): "{h}분이면 도착하는" / "경로예요"로 접혀야 한다. etaMin=48인 short 시나리오로
  // 확인한다(측정한 max-width는 1~999분 범위에서 같은 지점에 접히도록 잡았다, v14 보고서 참고).
  test('짧은 경로 브리지 제목도 Figma 지점에서 접힌다', ()=>{
    S = fresh('short','charter'); S.pickupAt = new Date(); S.charterHours = 3; S.openCard='none';
    render(); onCtaPress();
    const t = document.getElementById('bridge-title');
    eq(Math.round(t.getBoundingClientRect().height), 60);   // 정확히 2줄
  });
  // §E: 짧은 경로 본문에서 "일반예약" 넉 자만 #0086EA로 강조. 왕복/시외에는 강조가 없다(bodyHtml
  // 필드 자체가 COPY['round-trip']에 없다).
  test('짧은 경로 본문에서 일반예약만 강조된다', ()=>{
    S = fresh('short','charter'); S.pickupAt = new Date(); S.charterHours = 3;
    S.openCard='none'; render(); onCtaPress();
    const d = document.getElementById('bridge-desc');
    const em = d.querySelector('span');
    if (!em) throw new Error('강조 span 이 없다');
    eq(em.textContent, '일반예약');
    eq(getComputedStyle(em).color, 'rgb(0, 134, 234)');      // #0086EA
    eq(getComputedStyle(d).color, 'rgb(49, 72, 125)');       // #31487D
    // 왕복/시외 에는 강조가 없다
    S = fresh('golf','normal'); S.pickupAt = new Date(); S.openCard='none'; render(); onCtaPress();
    if (document.getElementById('bridge-desc').querySelector('span'))
      throw new Error('왕복/시외 본문에는 강조가 없어야 한다');
  });
}

function selftest(){
  T.length = 0;
  runJudgeTests();          // Task 1
  runInputTests();          // Task 2
  runConvertTests();        // Task 3
  runSheetTests();          // Task 4
  runLifecycleTests();      // Task 5
  runPreviewTests();        // Task 6
  runPanelTests();          // Task 7
  runLayoutTests();         // Task 8
  runWheelTests();          // 원 Task 9(v8) 중 휠 선택 밴드만 남은 것(어시스트 나머지는 폐기)
  runV10Tests();            // v10 잔존분(어시스트/넛지와 무관하게 아직 유효한 것)
  runBridgeTests();         // v11: 브리지(스펙 §4)
  runV13Tests();            // v13: 트리거 2종 통합(§v13-1) + 유형 탭 재설계(§v13-2)
  runV14Tests();            // v14: 유형 칩 B안 + 리드 문구 위치 복귀 + CTA 여백 + 브리지 개행/강조
  const out = document.getElementById('selftest-out');
  const fail = T.filter(l=>l.startsWith('FAIL'));
  out.hidden = false;
  out.textContent = `SELFTEST ${T.length - fail.length}/${T.length} ${fail.length ? 'FAILED' : 'OK'}\n` + T.join('\n');
}
if (new URLSearchParams(location.search).has('selftest')) {
  window.addEventListener('load', selftest);
}
</script>
