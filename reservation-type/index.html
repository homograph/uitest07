<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>예약 유형 오선택 교정 · 프로토타입</title>
<style>
  :root{
    --navy:#19254d;
    --navy-dark:#9db1e6;
    --good:#0ca30c;
    --warning:#fab219;
    --critical:#d03b3b;
    --bg:#E6E9EF;
    /* Task 2에서 추가한 토큰. 위 값들은 재정의하지 않는다. */
    --card-bg:#ffffff;
    --input-bg:#F5F6F7;
    --ink:#171A24;
    --ink-sub:#8C93A6;
    --nudge-bg:#F1F9FE;
    --nudge-border:#E3E4E8;
    --nudge-body-ink:#31487D;
    --nudge-accent:#0086EA;
    /* Task 5에서 추가한 토큰. 휠 선택 밴드 전용. */
    --wheel-band-bg:#F1F9FE;
    --wheel-band-ink:#0086EA;
  }
  html,body{margin:0;padding:0;background:var(--bg);color:#111;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;}
  /* 라이트 모드 앱 화면의 스크린샷이므로 다크모드에서도 폰 프레임 안쪽은 그대로 둔다(뒤집지 않는다). */
  html{color-scheme:light;}

  #selftest-out{
    white-space:pre-wrap;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:12px;
    padding:16px;
    margin:0;
    background:#fff;
  }

  /* ---- 폰 프레임 · 시간&경로 입력 화면 (Task 2) ---- */
  .rt-stage{
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:40px 16px;
    box-sizing:border-box;
  }
  .rt-phone{
    width:360px;
    height:800px;
    /* .rt-stage의 flex item이라 flex-shrink 기본값(1) 때문에 좁은 뷰포트에서 폭이
       줄어들 수 있다. 이 프로토의 최상위 제약은 "폰 프레임 안은 360×800"이므로 줄어드는
       대신 잘려서 가로 스크롤이 생기는 쪽을 택한다. */
    flex:0 0 auto;
    background:var(--bg);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    position:relative;
    box-shadow:0 8px 30px rgba(0,0,0,.18);
    font-variant-numeric: tabular-nums;
  }
  /* Task 6: 화면 전환(input/vehicle/preview) 컨테이너. 항상 하나만 보인다. */
  .rt-screen{
    flex:1 1 auto;
    min-height:0;
    display:flex;
    flex-direction:column;
  }
  .rt-screen[hidden]{display:none;}
  .rt-appbar{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:12px;
    padding:16px 20px 8px;
    box-sizing:border-box;
  }
  .rt-iconbtn{
    appearance:none;border:none;background:transparent;padding:0;margin:0;
    display:flex;align-items:center;justify-content:center;
    width:24px;height:24px;cursor:pointer;
  }
  /* Task 9: 입력 화면은 이 프로토의 첫 화면이라 뒤로가기가 갈 곳이 없다. 되돌아갈 화면을
     새로 만드는 대신 흐리게 비활성화해 "여기가 끝"임을 보여준다. */
  .rt-iconbtn:disabled{opacity:.35;cursor:default;}
  .rt-appbar-title{
    font-size:18px;font-weight:700;color:var(--ink);
  }
  /* Task: 예약 유형 오선택 교정 → Figma 최종판: 언더라인 탭이 다시 pill 칩으로 바뀌었다.
     탭 줄(.rt-seg)은 배경 없이 칩 두 개를 가로로 늘어놓는다(가로 gap 8, 상하좌우 패딩 16
     사방, 전부 Figma 실측). 칩은 높이 38, radius 999, 상하 패딩 8, 좌우 패딩 14, 폭은 글자에
     맞춰(hug) 늘어나지 않는다. 선택된 유형의 설명은 이 줄에 있지 않다(#type-lead, 스크롤
     영역 맨 위로 이동, 아래 참고). */
  .rt-seg{
    flex:0 0 auto;
    display:flex;gap:8px;
    padding:16px;
    justify-content:center;   /* Figma 실측(§3): 가운데 정렬. 좌측 정렬이 아니다 */
    align-items:center;
    box-sizing:border-box;
  }
  .rt-seg-tab{
    appearance:none;cursor:pointer;
    border:1px solid #E3E4E8;     /* 기본(미선택) 칩 테두리, Figma 실측 */
    flex:0 0 auto;
    height:38px;
    border-radius:999px;
    padding:8px 14px;
    box-sizing:border-box;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;line-height:22px;
    background:#FFFFFF;
    color:#383D4F;
    font-weight:500;   /* Medium, Figma 실측 */
    position:relative;   /* v10(항목 8): 아래 ::after(터치 영역 44)의 기준 */
  }
  /* v10(항목 8): 시각 높이 38(Figma 실측, 바꾸지 않는다)은 iOS HIG 44 / Material 48에 못
     미친다. 보이는 알약은 그대로 두고, 투명 ::after로 세로로만 44까지 넓힌다(가로는 칩
     자신의 폭 그대로라 gap:8인 옆 칩과 겹치지 않는다). position:absolute라 flex 레이아웃
     (hug 폭)에는 영향이 없다. */
  .rt-seg-tab::after{
    content:'';
    position:absolute;
    left:0;right:0;
    top:50%;
    height:44px;
    transform:translateY(-50%);
  }
  .rt-seg-tab[aria-selected="true"]{
    border-color:transparent;
    background:#31487D;
    color:#FFFFFF;
    font-weight:700;   /* Bold, Figma 실측(선택 칩만 Bold) */
  }
  /* 보조 문구(구 #type-headline, 20px)를 대신한다. 칩 줄 바로 아래, 카드 스크롤 영역과는
     별개의 고정 영역이다(Figma §4: 리드 문구 프레임 자체가 padding 0 16 20 16을 갖고,
     카드 컨테이너(§5)와는 다른 프레임). 그래서 .rt-scroll 밖, .rt-seg 다음 형제로 둔다. */
  #type-lead{
    flex:0 0 auto;
    padding:0 16px 20px 16px;
    box-sizing:border-box;
    font-size:13px;font-weight:400;line-height:20px;color:#19254D;
    text-align:center;    /* Figma 실측(§4): 가운데 정렬 */
    word-break:keep-all;
  }
  .rt-scroll{
    flex:1 1 auto;
    overflow-y:auto;
    padding:0 16px 16px;
    box-sizing:border-box;
    display:flex;
    flex-direction:column;
    gap:10px;   /* Figma 실측(§5 카드 컨테이너): 카드 사이 간격 10 (기존 20은 오차) */
  }
  .rt-card{
    background:var(--card-bg);
    border-radius:12px;
    padding:20px;
    box-sizing:border-box;
    cursor:pointer;
  }
  .rt-card[hidden]{display:none;}
  /* 펼침 상태(Figma §6/§7, 입력 화면 전용): 카드 자체는 padding:0 이고, Head/Container가
     각자 패딩을 갖는다(아래 #screen-input 스코프 규칙). is-open 클래스는 입력 화면 카드에만
     붙으므로(renderInput 참고) 스코프 없이도 안전하지만, 명확히 하기 위해 스코프를 남긴다. */
  #screen-input .rt-card.is-open{padding:0;}
  .rt-card-head{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:12px;
  }
  .rt-card-title{font-size:18px;font-weight:700;color:var(--ink);}
  /* Figma 실측(§6/§7 펼침 Head). .rt-card-head/.rt-card-title은 미리보기 화면
     (#screen-preview)의 "경로"/"요금" 카드 헤더와 이름을 공유해서, 기본 규칙(위)은 건드리지
     않고 #screen-input으로 스코프한 override만 따로 둔다. 안 그러면 미리보기 화면까지
     같이 바뀐다. */
  #screen-input .rt-card-head{
    display:flex;align-items:center;gap:12px;
    justify-content:flex-start;
    padding:20px 20px 16px 20px;
    margin-bottom:0;
    box-sizing:border-box;
  }
  /* 픽업/대절 시간 카드 펼침 머리(Figma §7 Frame 2085667123): 세로 스택, gap 4.
     새 클래스라 다른 화면과 이름이 겹치지 않는다(스코프 불필요). */
  /* #screen-input으로 스코프해 위 #screen-input .rt-card-head(gap:12)보다 명시도를 같게
     맞춘다. 스코프 없이 .rt-card-head--col만 쓰면 명시도가 낮아 gap:12에 밀려 4px로
     안 줄어든다(픽업/대절 카드 머리가 88이 아니라 96으로 커지는 원인이었다, v7에서 발견). */
  #screen-input .rt-card-head--col{
    flex-direction:column;align-items:flex-start;gap:4px;
  }
  #screen-input .rt-card-title{flex:1 1 auto;font-size:20px;font-weight:700;line-height:28px;color:#171A24;}
  /* 픽업/대절 시간 헤더 제목은 경로 헤더와 색이 다르다(Figma 실측: #262A38). 새 클래스. */
  .rt-card-title--ink2{color:#262A38;}
  .rt-card-head-value{font-size:14px;font-weight:400;line-height:20px;color:#262A38;}
  /* v10(항목 3): 대절 시간 카드 전용. Figma에 없는 요소라 기존 보조 텍스트 톤(예:
     #screen-input .rt-route-tag과 같은 13px/줄높이 20/#60667A)을 그대로 쓴다. 좌우 padding은
     카드 머리(.rt-card-head, 20 20 16 20)와 맞추고, 아래 여백은 작게 둬(.rt-wheel 자신의
     padding-top:40이 이미 큰 간격을 주므로 여기서 또 크게 벌리면 두 배로 벌어진다) 겹치지
     않게 조정했다. 카드 전체 높이가 늘어나는 건 의도된 트레이드오프다(설명 참고).
     픽업 시간 카드에는 붙지 않는다(charterWheelHtml에서만 렌더). */
  .rt-card-hint{
    display:flex;flex-direction:column;gap:2px;
    padding:0 20px 8px 20px;
    box-sizing:border-box;
    font-size:13px;font-weight:400;line-height:20px;color:#60667A;
    word-break:keep-all;
  }
  .rt-via-btn{
    appearance:none;cursor:pointer;background:transparent;
    border:none;border-radius:6px;
    display:flex;align-items:center;gap:4px;
    padding:8px 10px;
    box-sizing:border-box;
    font-size:13px;font-weight:700;line-height:20px;color:#383D4F;
  }
  /* 새 클래스(입력 화면 경로 카드 전용, §6 Container). 다른 화면과 이름이 겹치지 않는다. */
  .rt-route-container{
    display:flex;flex-direction:column;gap:10px;
    padding:0 20px 24px 20px;
    box-sizing:border-box;
  }
  .rt-route-row{
    display:flex;align-items:center;gap:12px;
    background:var(--input-bg);
    border-radius:8px;
    padding:20px 16px;
    box-sizing:border-box;
  }
  /* 미리보기 화면(#screen-preview)의 경로 행은 .rt-route-container로 감싸지 않아 이
     형제-간격 규칙으로 계속 떨어뜨린다. 입력 화면은 .rt-route-container의 gap:10이
     대신하므로, 거기서는 이 규칙이 걸리지 않게(중복 간격 방지) 아래에서 gap:0으로 되돌린다. */
  .rt-route-row + .rt-route-row{margin-top:12px;}
  .rt-route-container .rt-route-row + .rt-route-row{margin-top:0;}
  .rt-route-tag{
    flex:0 0 auto;
    width:36px;
    font-size:15px;color:var(--ink-sub);
  }
  .rt-route-text{
    flex:1 1 auto;
    font-size:16px;color:var(--ink);
    font-variant-numeric: tabular-nums;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  /* Figma 실측(§6 펼침 route_input 라벨/값). .rt-route-tag/.rt-route-text도 미리보기 화면의
     경로 행과 이름을 공유해서 #screen-input으로 스코프한다. */
  #screen-input .rt-route-tag{
    width:auto;
    font-size:14px;font-weight:400;line-height:20px;color:#60667A;
  }
  #screen-input .rt-route-text{
    font-size:15px;font-weight:400;line-height:22px;color:#000000;
  }
  .rt-route-summary{
    display:flex;align-items:center;gap:16px;
  }
  .rt-route-summary-label{
    flex:0 0 auto;font-size:15px;font-weight:500;line-height:22px;color:#60667A;
  }
  .rt-route-summary-text{
    flex:1 1 auto;
    font-size:15px;font-weight:500;line-height:22px;color:#262A38;
    text-align:right;
    font-variant-numeric: tabular-nums;
  }
  /* v10(항목 7): 접힌 카드 값의 공통 오버플로 안전장치. 값 영역이 약 232px, 15px 한글로 15자
     남짓이다. 실제 주소(예: "인천광역시 중구 공항로 272 제2여객터미널")는 반드시 넘친다.
     우측 정렬 + 그냥 오버플로면 목적지가 잘린다(중요한 쪽이 사라진다). 그래서 경로 카드는
     넘칠 때 JS(fitRouteSummaryValue)가 도착지만 남기고, 그래도 넘치면 끝(건물명 등 식별
     정보가 대개 여기 있다)이 아니라 앞을 잘라 "…"을 붙인다. 여기 있는 CSS
     text-overflow:ellipsis는 그 JS가 못 미더울 때(예: 폰트 로드 전 측정)를 위한 안전장치일
     뿐이라 끝을 자른다(정상 경로에서는 JS가 이미 안 넘치게 만들어 두므로 걸리지 않는다).
     픽업/대절 카드
     (.rt-line-value)는 값이 짧아 실제로는 안 걸리지만 같은 안전장치를 걸어 둔다.
     min-width:0이 없으면 flex item이 텍스트의 min-content 폭(줄바꿈 없이 전체 폭)만큼
     늘어나 ellipsis가 무력화된다. */
  .rt-card-value{
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;
  }
  .rt-line-card{
    display:flex;align-items:center;
    gap:16px;
  }
  .rt-line-label{flex:0 0 auto;font-size:15px;font-weight:500;line-height:22px;color:#60667A;}
  .rt-line-value{flex:1 1 auto;text-align:right;font-size:15px;font-weight:500;line-height:22px;color:#262A38;font-variant-numeric: tabular-nums;}
  .rt-line-value.is-placeholder{color:var(--ink-sub);font-weight:500;}

  @keyframes rt-card-enter{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
  }
  .rt-card.rt-enter{animation: rt-card-enter .3s ease-out;}

  /* Task 9913/9915 통합(Figma 최종판, v5): 방향에 따라 자리가 갈리던 것을 없애고 #nudge는
     항상 .rt-scroll 맨 뒤(카드와 나란히)에 고정한다(renderNudge() 참고). 고정 영역(.rt-footer)에는
     #cta만 남는다. 세로 스택(제목+본문 묶음 위, 버튼 아래)으로 바뀌면서 카드 자체에 테두리(1px
     #E3E4E8)와 radius 12(카드 radius와 동일)가 생겼다(기존엔 border 없이 radius 4였다).
     등장 애니메이션은 카드와 같은 rt-card-enter(translateY+fade)를 그대로 쓴다.
     아이콘 자리: assets_reservation_type/icons/ 에 이 자리에 맞는 아이콘이 없어 자리를
     비우고(가짜 아이콘을 그리지 않고) 텍스트만 둔다. .rt-nudge-row는 Figma의 "가로 묶음"
     (아이콘 자리+텍스트 열, gap 16) 구조를 남겨 둬 나중에 아이콘 에셋이 생기면 그 자리에
     끼워 넣을 수 있게 한다. */
  /* ---- AI 어시스트 라인 (Figma §10, 13275:20012). Figma는 Frame 2085668387로 #assist와
     #nudge를 묶어 카드 컨테이너 맨 끝, 넛지 바로 위(간격 0)에 둔다(#nudge-wrap이 한때 그
     구조를 그대로 옮겼었다). v10(디자인 비평 항목 1): 픽업 카드가 펼쳐지면 그 자리(y=540~)가
     실기기에서 화면 밖이라 "AI가 보고 있다"는 연출이 스크롤 전엔 안 보였다. 그래서 Figma의
     붙어있음 자체(래퍼)는 포기하고 #assist를 카드 컨테이너 맨 위로 올렸다(마크업 참고).
     시각적 연결은 대신 상호작용으로 만든다: 판정 결과가 있을 때 #assist를 누르면
     flashNudge()가 스크롤해 데려가 강조한다(renderAssist의 role/tabindex 토글, bindEvents의
     onAssistPress 참고). 애니메이션(별 반짝임, 텍스트 타이핑)은 Figma에 없어 여기서(v8) 새로
     정의한다. */
  #assist{
    padding:10px 4px;
    display:flex;
    gap:6px;
    align-items:center;
    box-sizing:border-box;
    min-height:40px;   /* 10(패딩)*2 + 20(줄높이) = 타이핑 중에도 줄 높이가 흔들리지 않게 고정 */
  }
  #assist[hidden]{display:none;}   /* display:flex가 hidden의 기본 display:none을 덮어쓰므로 필수 */
  /* v10(항목 1): 판정 결과가 있을 때만(renderAssist가 role="button"을 붙일 때만) 클릭 가능해
     보이게 한다. role이 없는 checking/결과없음 상태에서는 커서가 그대로(기본)다. */
  #assist[role="button"]{cursor:pointer;}
  #assist[role="button"]:focus-visible{outline:2px solid var(--navy);outline-offset:2px;border-radius:4px;}
  #assist-star{
    width:16px;height:16px;flex:0 0 auto;display:block;
  }
  #assist-star svg{width:100%;height:100%;display:block;}
  #assist-text{
    font-size:13px;line-height:20px;
    flex:1 1 auto;
    word-break:keep-all;overflow-wrap:break-word;
  }
  /* v10(항목 6): #868B9C는 배경 #E6E9EF 위에서 2.79:1로 비텍스트 대비 기준(3:1) 미달이었다.
     #6E7385로 올려 3.88:1을 확보한다. is-done의 #32A2FA(아이콘+옆 글자가 정보를 전달)는
     그대로 둔다. */
  #assist.is-checking #assist-star{color:#6E7385;}
  #assist.is-checking #assist-text{color:#60667A;}
  #assist.is-done #assist-star{color:#32A2FA;}
  #assist.is-done #assist-text{color:#31487D;}
  /* checking: 느리게 도는 맥박, 무한 반복. done: 한 번 크게 반짝(체크로 전환되는 순간에만 탄다.
     is-checking에서 is-done으로 클래스가 매번 새로 교체되므로 재실행 트릭 없이도 자연히 다시 탄다). */
  @keyframes rt-assist-spin{
    0%   { transform: rotate(0deg)   scale(.85); opacity:.55; }
    50%  { transform: rotate(180deg) scale(1);   opacity:1; }
    100% { transform: rotate(360deg) scale(.85); opacity:.55; }
  }
  @keyframes rt-assist-pop{
    0%   { transform: rotate(-90deg) scale(.4); opacity:0; }
    55%  { transform: rotate(10deg)  scale(1.3); opacity:1; }
    100% { transform: rotate(0deg)   scale(1);   opacity:1; }
  }
  /* v8 수정: 애니메이션은 .assist-anim이 붙어 있을 때만 탄다(startAssistCycle이 !assistSkipAnim()일
     때만 붙인다). ?selftest=1에서는 판정이 같은 틱 안에서 바로 끝나(checking을 그릴 새도 없이
     done으로) 문제가 없어 보이지만, rt-assist-pop은 scale(.4)로 "시작"해 애니메이션 프레임이
     한 번도 안 그려진 채로 테스트가 getBoundingClientRect()를 재면 축소된 크기(scale(.4)인
     6.4px)를 그대로 읽어 버린다(실측: expected 16 got 6). .assist-anim 게이트가 없으면
     selftest에서도 keyframe이 선언돼 있는 것만으로 애니메이션이 걸린다. */
  #assist.assist-anim.is-checking #assist-star{ animation: rt-assist-spin 1.4s ease-in-out infinite; }
  #assist.assist-anim.is-done #assist-star{ animation: rt-assist-pop .5s cubic-bezier(.2,.9,.3,1.4); }
  @media (prefers-reduced-motion: reduce){
    #assist.is-checking #assist-star,
    #assist.is-done #assist-star{ animation:none; }
  }
  /* 넛지는 타이핑이 끝날 때까지 opacity로만 숨긴다(hidden 속성·DOM 존재는 judgeNudge만 따라
     동기적으로 정해진다. 기존 93개 테스트가 그 동기성을 본다). 애니메이션을 끄는 경로
     (?selftest=1 / prefers-reduced-motion)에서는 이 클래스가 아예 걸리지 않는다(renderAssist 참고). */
  .rt-nudge-pending{ opacity:0; }
  #nudge{
    display:flex;
    flex-direction:column;
    gap:4px;
    align-items:center;   /* Figma 실측(§8): 버튼이 가운데 정렬되는 이유 */
    background:var(--nudge-bg);
    border:1px solid var(--nudge-border);
    border-radius:12px;
    padding:20px 20px 10px 20px;
    box-sizing:border-box;
  }
  /* 위의 display:flex 가 hidden 속성의 기본 display:none 을 덮어쓴다. 그대로 두면
     조건이 거짓일 때 글자만 비고 파란 띠가 남는다. 속성을 다시 이기게 한다. */
  #nudge[hidden]{display:none;}
  #nudge.rt-enter{animation: rt-card-enter .3s ease-out;}
  /* v6: 넛지가 스크롤 안으로 내려가 유저가 스크롤을 안 하면 안 보일 수 있다. 조건이 참인데
     '설정 완료'를 누르면(flashNudge, onCtaPress 참고) 배너로 스크롤해 데려온 뒤 한 번
     강조한다. 등장 애니메이션(rt-enter)과 같은 요소에 걸리므로 둘이 같이 걸리지 않게
     flashNudge()가 rt-enter를 먼저 지운다. */
  @keyframes rt-nudge-flash{
    0%   { border-color:var(--nudge-border); box-shadow:0 0 0 0 rgba(25,37,77,0); }
    15%  { border-color:var(--navy);         box-shadow:0 0 0 3px rgba(25,37,77,.18); }
    70%  { border-color:var(--navy);         box-shadow:0 0 0 3px rgba(25,37,77,.18); }
    100% { border-color:var(--nudge-border); box-shadow:0 0 0 0 rgba(25,37,77,0); }
  }
  #nudge.rt-flash{ animation: rt-nudge-flash .9s ease-out; }
  @media (prefers-reduced-motion: reduce){
    #nudge.rt-flash{ animation:none; }
    .rt-scroll{ scroll-behavior:auto; }
  }
  .rt-nudge-row{
    display:flex;
    width:100%;
    gap:16px;
    box-sizing:border-box;
  }
  .rt-nudge-illust{
    flex:0 0 auto;
    width:64px;height:64px;
    object-fit:contain;
    display:block;
  }
  #nudge-text{
    flex:1 1 auto;
    min-width:0;
    display:flex;flex-direction:column;gap:4px;
    justify-content:center;   /* Figma 실측(§8): text 열은 일러스트 높이 기준으로 세로 가운데 */
  }
  #nudge-title{
    font-size:15px;font-weight:700;line-height:22px;color:var(--navy);
    word-break:keep-all;overflow-wrap:break-word;
  }
  #nudge-body{
    font-size:13px;font-weight:400;line-height:20px;color:var(--nudge-body-ink);
    word-break:keep-all;overflow-wrap:break-word;
  }
  #nudge-cta{
    /* align-self:flex-start 제거: 부모(#nudge)의 align-items:center 를 따라 가운데 정렬된다
       (Figma 실측 §8, 버튼 글자 중심 x = 카드 중심). */
    appearance:none;border:none;background:transparent;cursor:pointer;
    font-weight:700;font-size:14px;line-height:20px;
    padding:14px 18px;border-radius:4px;
    color:var(--navy);
    margin:0;white-space:nowrap;
  }

  /* v5: 넛지가 방향과 무관하게 항상 .rt-scroll에 있으므로 .rt-footer에는 #cta만 남는다.
     flex column은 그대로 둔다(자식이 하나뿐이라도 동작에 영향 없음). */
  .rt-footer{
    flex:0 0 auto;
    box-sizing:border-box;
    display:flex;
    flex-direction:column;
  }
  /* Figma 실측(§9 reserv_button_group): padding 10 24 20 24. 버튼은 그 안을 채우므로
     폭 360 기준 x 24..336, 즉 312다. 카드(328, 좌우 16)보다 좁다. 좌우를 16으로 두면
     버튼이 카드와 같은 폭이 돼 Figma와 16px 어긋난다. */
  .rt-footer > .rt-cta{
    display:block;
    width:calc(100% - 48px);
    margin:10px 24px 20px 24px;
  }
  .rt-cta{
    width:100%;
    appearance:none;border:none;cursor:pointer;
    background:var(--navy);
    color:#ffffff;
    border-radius:4px;
    padding:14px 18px;
    font-size:17px;font-weight:700;
    box-sizing:border-box;
    font-variant-numeric: tabular-nums;
  }
  .rt-cta:disabled{opacity:.6;cursor:default;}
  /* Figma 실측(§9 reserv_button_group): 하단 CTA는 16 Bold, 높이 52(14+24+14). 기존 17px는
     오차였다. .rt-cta는 미리보기 화면(#preview-cta)과도 공유하는 클래스라 여기서 바꾸지
     않고 입력 화면 버튼(#cta)에만 스코프한다. */
  #cta{font-size:16px;line-height:24px;}
  .rt-icon-back{width:24px;height:24px;display:block;}
  .rt-icon-add{width:16px;height:16px;display:block;}
  .rt-icon-arrow{width:18px;height:18px;flex:0 0 auto;display:block;}

  /* ---- 9915 바텀시트 (Task 4): 일반예약 → 시간대절, "위험" 확인용 ---- */
  .rt-sheet-backdrop{
    position:absolute;
    inset:0;
    background:rgba(23,26,36,.4);
    z-index:9;
  }
  .rt-sheet-backdrop[hidden]{display:none;}
  .rt-sheet{
    position:absolute;
    left:0;right:0;bottom:0;
    background:var(--card-bg);
    border-radius:16px 16px 0 0;
    padding:24px 20px 20px;
    box-sizing:border-box;
    box-shadow:0 -8px 30px rgba(0,0,0,.18);
    z-index:10;
  }
  .rt-sheet[hidden]{display:none;}
  .rt-sheet-title{font-size:18px;font-weight:700;color:var(--ink);}
  .rt-sheet-body{
    font-size:15px;line-height:1.5;color:var(--ink);
    margin-top:8px;
    white-space:pre-line; /* textContent의 \n을 줄바꿈으로 보여준다(<br> 대신) */
  }
  .rt-sheet-actions{
    display:flex;flex-direction:column;gap:8px;
    margin-top:20px;
  }
  .rt-sheet-btn{
    appearance:none;border:none;cursor:pointer;
    border-radius:4px;
    padding:14px 18px;
    font-size:16px;font-weight:700;
    box-sizing:border-box;
    width:100%;
    font-variant-numeric: tabular-nums;
  }
  .rt-sheet-btn-primary{
    background:var(--navy);
    color:#ffffff;
  }
  .rt-sheet-btn-ghost{
    background:transparent;
    color:var(--ink-sub);
  }

  /* ---- 픽업 시간 / 대절 시간 휠 피커 (Task 5, Task 2에서 이관) ---- */
  .rt-wheel{
    /* 이 세 값은 JS 상수(WHEEL_ROW_H / WHEEL_PAD)와 같은 값이어야 한다. 따로 적어 두면
       한쪽만 고쳤을 때 밴드가 선택 행에서 어긋난다. 셀프테스트가 둘을 대조한다
       ('휠 선택 밴드가 JS 상수와 어긋나지 않는다'). */
    --wheel-row-h:44px;   /* = WHEEL_ROW_H */
    --wheel-pad:44px;     /* = WHEEL_PAD, (WHEEL_VISIBLE - WHEEL_ROW_H) / 2 */
    --wheel-inset:40px;   /* Figma 실측 §7: .rt-wheel padding-top */
    display:flex;
    gap:12px;
    padding:var(--wheel-inset) 24px;
    box-sizing:border-box;
    position:relative;   /* v8: 열 뒤에 깔리는 선택 밴드(.rt-wheel-band)의 포지셔닝 기준 */
  }
  /* v8(Figma 실측 §7 "선택 행 래퍼"): 선택 표시가 열마다 따로 칠해지면(.rt-wheel-item.is-selected의
     background) 열 사이 gap(12px)에 흰 틈이 보인다. Figma 원본은 행 전체가 하나의 밴드다. 이
     프로토의 휠은 열마다 따로 스크롤되는 구조라(각 .rt-wheel-col이 독립 overflow-y:auto) 밴드를
     열 "안"에 둘 수 없다. 대신 열들 뒤에 깔린 한 장짜리 배경 레이어로 만든다. 위치는 순수
     정적 값이다: top = --wheel-inset(.rt-wheel padding-top) + --wheel-pad(열 안 보이는 영역에서
     선택 행까지의 오프셋) = 84. absolute 자식의 기준은
     조상의 padding box라 .rt-wheel 자신의 padding은 이 84 계산에 이미 포함해야 한다(top:0이면
     padding을 무시하고 테두리 바로 안쪽에 붙는다). 휠 스크롤 로직(_wheelProgramTarget 등)은
     전혀 건드리지 않는다. 이 레이어는 순수 배경이고 pointer-events:none이라 클릭을 가로채지
     않는다. */
  .rt-wheel-band{
    position:absolute;
    left:24px; right:24px;
    top:calc(var(--wheel-inset) + var(--wheel-pad));
    height:var(--wheel-row-h);
    background:var(--wheel-band-bg);
    border-radius:4px;
    pointer-events:none;
    z-index:0;
  }
  .rt-wheel-col{
    flex:1 1 0;
    height:132px;   /* Figma 실측(§7): 행 44 x 3, 나머지는 위아래 padding(44)으로 흰 페이드 */
    overflow-y:auto;
    overflow-x:hidden;
    scroll-snap-type:y mandatory;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    position:relative;   /* v8: 밴드(z-index:0)보다 위에 그려지도록 자체 스태킹 컨텍스트를 만든다 */
    z-index:1;
    background:transparent;   /* Figma 실측: 열 자체는 배경 없음. 밴드가 뒤에서 보인다 */
  }
  .rt-wheel-col.is-wide{flex:1.6 1 0;}
  .rt-wheel-col::-webkit-scrollbar{display:none;}
  .rt-wheel-pad{height:44px;}
  .rt-wheel-item{
    height:44px;
    display:flex;align-items:center;justify-content:center;
    text-align:center;
    font-size:16px;font-weight:400;color:#7282A6;
    line-height:24px;
    font-variant-numeric:tabular-nums;
    scroll-snap-align:center;
    cursor:pointer;
    border-radius:4px;
    box-sizing:border-box;
    padding:10px 2px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
  }
  .rt-wheel-item.is-selected{
    /* v8: background 제거. 선택 표시는 이제 .rt-wheel-band(열 뒤 한 장 배경)가 맡는다.
       글자색·굵기는 그대로 열 안(아이템)에 남는다. */
    color:var(--wheel-band-ink);
    font-weight:500;   /* Medium, Figma 실측 */
  }
  /* ---- 차종 선택 브리지 (Task 6): Figma 2x 렌더 이미지 + 투명 히트 영역 ---- */
  .rt-vehicle-screen{background:#ffffff;}
  .rt-vehicle-scroll{
    flex:1 1 auto;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    position:relative;  /* Task 9: 뒤로가기 히트 영역을 렌더 이미지 위, 스크롤과 함께 움직이도록 얹는다 */
  }
  .rt-vehicle-img{display:block;width:100%;height:auto;}
  /* Task 9: 렌더 이미지(720×1480, 2x) 맨 위에 이미 그려진 뒤로가기 화살표 위에 얹는 히트 영역.
     원본 픽셀 좌표(≈44~75, 111~140)를 1x(÷2)로 환산해 여유를 두고 잡았다.
     좌표는 어림짐작이 아니라 scratchpad에서 이미지를 직접 열어 실측했다. */
  .rt-vehicle-back{
    appearance:none;border:none;background:transparent;padding:0;margin:0;cursor:pointer;
    position:absolute;
    left:8px;top:40px;width:44px;height:44px;
  }
  .rt-vehicle-footer{
    flex:0 0 auto;
    position:relative;
  }
  .rt-vehicle-hit{
    appearance:none;border:none;background:transparent;padding:0;margin:0;cursor:pointer;
    position:absolute;
    left:206px;top:48px;width:140px;height:62px;
  }

  /* ---- 미리보기(예약 신청) 화면 (Task 6) ---- */
  .rt-preview-head{padding:4px 0 0;}
  .rt-preview-title{font-size:22px;font-weight:700;color:var(--ink);}
  .rt-preview-sub{
    font-size:15px;color:var(--ink-sub);margin-top:8px;
    font-variant-numeric:tabular-nums;
  }
  .rt-chip-row{
    flex:0 0 auto;
    display:flex;gap:6px;
  }
  .rt-chip{
    background:var(--input-bg);color:var(--ink-sub);
    font-size:13px;font-weight:700;
    padding:6px 12px;border-radius:999px;
    white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  .rt-fare-row{
    display:flex;align-items:center;justify-content:space-between;
    font-size:15px;color:var(--ink);
    padding:4px 0;
    font-variant-numeric:tabular-nums;
  }
  .rt-fare-total{
    font-size:17px;font-weight:700;
    margin-top:8px;padding-top:12px;
    border-top:1px solid var(--input-bg);
  }
  .rt-preview-switch{
    font-size:14px;color:var(--ink-sub);text-align:center;
    padding:4px 0 8px;cursor:pointer;
    font-variant-numeric:tabular-nums;
  }
  .rt-preview-switch[hidden]{display:none;}

  /* ---- 하네스: 설정 패널 (Task 7). 폰 프레임 바깥, 기획자·디자이너용.
     시간&경로 입력 화면(폰 안)의 .rt-seg/.rt-seg-tab과는 별개 이름공간이다. ---- */
  .page{
    min-height:100vh;
    box-sizing:border-box;
    padding-top:58px;
  }
  .topbar{
    position:fixed;
    top:0;left:0;right:0;
    height:58px;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 20px;
    box-sizing:border-box;
    background:#ffffff;
    border-bottom:1px solid #E0E3E9;
    z-index:50;
  }
  .topbar-title{
    font-size:15px;font-weight:700;color:var(--ink);
  }
  .topbar-gear{
    appearance:none;cursor:pointer;
    border:1px solid #D8DCE4;background:#ffffff;
    border-radius:8px;
    padding:8px 14px;
    font-size:13px;font-weight:700;color:var(--ink);
  }
  .topbar-gear.is-active{
    border-color:var(--navy);color:var(--navy);background:#EEF1F8;
  }
  .panel{
    position:fixed;
    top:66px;right:20px;
    width:360px;max-width:calc(100vw - 40px);
    background:var(--card-bg);
    border:1px solid #E0E3E9;
    border-radius:12px;
    box-shadow:0 8px 30px rgba(0,0,0,.18);
    padding:16px;
    box-sizing:border-box;
    z-index:60;
    max-height:calc(100vh - 82px);
    overflow-y:auto;
  }
  .panel[hidden]{display:none;}
  .panel-head{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:8px;
  }
  .panel-head-title{font-size:15px;font-weight:700;color:var(--ink);}
  .panel-close{
    appearance:none;border:none;background:transparent;cursor:pointer;
    width:24px;height:24px;padding:0;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;color:var(--ink-sub);
  }
  .panel-row{
    display:flex;align-items:flex-start;gap:10px;
    padding:10px 0;
    box-sizing:border-box;
  }
  .panel-row + .panel-row{border-top:1px solid #EEF0F3;}
  .panel-label{
    flex:0 0 58px;
    font-size:13px;font-weight:700;color:var(--ink-sub);
    padding-top:7px;
    box-sizing:border-box;
  }
  /* 시나리오가 6개라 한 알약 안에 넣으면 줄바꿈에서 깨진다.
     여기서는 알약(.rt-seg)을 쓰지 않고 버튼마다 테두리를 주는 칩 묶음으로 만든다. */
  .panel-chips{
    flex:1 1 auto;
    display:flex;flex-wrap:wrap;gap:6px;
  }
  .panel-chip{
    appearance:none;cursor:pointer;
    border:1px solid #D8DCE4;background:#ffffff;
    border-radius:8px;
    padding:7px 12px;
    font-size:13px;font-weight:600;color:var(--ink);
    white-space:nowrap;
  }
  .panel-chip.is-active{
    border-color:var(--navy);color:var(--navy);
    background:#EEF1F8;font-weight:700;
  }
  .panel-reset{
    display:inline-block;
    margin-top:12px;
    font-size:13px;font-weight:700;
    color:var(--ink-sub);
    text-decoration:underline;
  }
  @media (max-width:720px){

<script>
/* ==========================================================
   reservation-type.html · 예약 유형 오선택 교정 프로토타입
   섹션 순서: 1. STATE  2. JUDGE  3. ACTIONS  4. RENDER  5. HARNESS  6. SELFTEST
   1~3은 DOM을 만지지 않는 순수 로직.
   ========================================================== */

/* ---- 1. STATE ---- */
const MIN_CHARTER_HOURS = 1;   // 확인 필요 항목(스펙 §9). 확정되면 이 값만 바꾼다.

// route: 시나리오마다 출발/목적지를 다르게 둔다(수정 1). 전에는 fresh()가 route를 고정값으로
// 만들어 시나리오와 무관하게 화면에 항상 "인천공항 제 1터미널"이 떴다. golf/longDistance
// 시나리오가 공항 도착 화면에 골프장·장거리 카피를 띄우는 모순을 만들었다(스펙 §2 비목표:
// "공항 이동은 건드리지 않는다"). short는 "48분이면 갈 경로에 3시간 대절을 잡은 상황"을
// 노리는 시나리오라 공항처럼 먼 목적지가 아니라 normal과 같은 짧은 시내 이동 경로를 쓴다.
// 공항 목적지는 airport 시나리오에만 남는다. 아래 SELFTEST의
// '전환 · 시간대절에서 일반예약으로' 테스트는 지명 리터럴이 아니라 전환 전/후 값을 비교해
// "경로가 유지되는가"만 검사하므로 시나리오의 실제 지명이 바뀌어도 영향받지 않는다.
const SCENARIOS = {
  normal:        { label:'정상',            etaMin:48, charterHours:1, flags:{airport:false,golf:false,noReturnCall:false,longDistance:false},
                   route:{ from:'강남역 2번 출구', to:'광화문광장' } },
  short:         { label:'짧은 경로',        etaMin:48, charterHours:3, flags:{airport:false,golf:false,noReturnCall:false,longDistance:false},
                   route:{ from:'강남역 2번 출구', to:'광화문광장' } },
  golf:          { label:'골프장',           etaMin:65, charterHours:3, flags:{airport:false,golf:true, noReturnCall:false,longDistance:false},
                   route:{ from:'강남역 2번 출구', to:'남서울컨트리클럽' } },
  noReturn:      { label:'복귀 불가 지역',   etaMin:80, charterHours:3, flags:{airport:false,golf:false,noReturnCall:true, longDistance:false},
                   route:{ from:'강남역 2번 출구', to:'태안 꽃지해수욕장' } },
  longDistance:  { label:'장거리',           etaMin:95, charterHours:3, flags:{airport:false,golf:false,noReturnCall:false,longDistance:true },
                   route:{ from:'강남역 2번 출구', to:'부산 해운대해수욕장' } },
  airport:       { label:'공항 (넛지 없음)', etaMin:70, charterHours:3, flags:{airport:true, golf:false,noReturnCall:false,longDistance:true },
                   route:{ from:'신세계백화점 강남점 정문', to:'인천공항 제 1터미널' } },
};

function fresh(scenarioKey, type){
  const sc = SCENARIOS[scenarioKey];
  return {
    scenario: scenarioKey,
    type: type || 'normal',          // 'normal' | 'charter'
    route: { from:sc.route.from, to:sc.route.to, vias:[] },
    pickupAt: null,                  // Date | null
    charterHours: null,              // number | null  (charter에서 '설정 완료' 후에만 채워짐)
    charterHoursPreset: sc.charterHours,
    etaMin: sc.etaMin,
    flags: { ...sc.flags },
    convertedTo: null,               // 'normal' | 'charter' | null  (왕복 방지)
    nudgeAcked: false,
    screen: 'input',                 // 'input' | 'vehicle' | 'preview'
    openCard: null,                  // null | 'none' | 'route' | 'pickup' | 'charter'  (아코디언: 하나만 열림)
                                      // null=아직 안 고름(기본값, renderInput에서 'route'로 취급),
                                      // 'none'=명시적으로 모두 접힘(수정 4, 스펙 §5.4)
  };
}

// 기본 시작 상태는 중립이다. 시나리오와 시작 탭 선택은 설정 패널(Task 7)이 소유한다.
let S = fresh('normal', 'normal');

// 순수 함수: location.search 를 읽지 않고 URLSearchParams만 받는다. DOM을 만지지 않는다.
// 알 수 없는 값이 오면 조용히 중립(normal/normal)으로 떨어진다.
function stateFromQuery(params){
  const scenario = params.get('scenario');
  const type = params.get('type');
  return {
    scenario: Object.prototype.hasOwnProperty.call(SCENARIOS, scenario) ? scenario : 'normal',
    type: (type === 'normal' || type === 'charter') ? type : 'normal',
  };
}

/* ---- 2. JUDGE ---- */
function judgeNudge(s){
  if (s.flags.airport) return null;              // 공항은 양방향 모두 제외
  if (s.convertedTo && s.convertedTo === s.type) return null;  // 왕복 방지
  // 수정 7: 경로 미입력 가드는 원래 normal 분기에만 있어, charter + charterHours=3 +
  // route.to=null이면 charter 분기를 그대로 통과해 short-trip을 반환했다(이 프로토에서는
  // 도달 불가한 조합이지만 judgeNudge는 스펙 §6 "경로 미입력 상태 → 두 방향 모두 판정 불가"의
  // 실행형이라 개발자가 그대로 옮겨 갈 코드다). 공항 가드·왕복 방지 가드 다음, 분기 갈림 전으로
  // 끌어올려 두 방향 모두에 적용되게 한다.
  if (!s.route.to) return null;                  // 경로 미입력 = 두 방향 모두 판정 불가
  if (s.type === 'charter'){
    if (s.charterHours == null) return null;     // 대절 시간 미입력 = 판정 불가
    if (s.route.vias.length > 0) return null;
    if (s.charterHours <= MIN_CHARTER_HOURS) return null;
    if (s.etaMin < s.charterHours * 60 * 0.5) return { dir:'to-normal', reason:'short-trip' };
    return null;
  }
  if (s.flags.golf)         return { dir:'to-charter', reason:'golf' };
  if (s.flags.noReturnCall) return { dir:'to-charter', reason:'no-return' };
  if (s.flags.longDistance) return { dir:'to-charter', reason:'long-distance' };
  return null;
}

// v10(항목 4): judgeNudge()가 실제로 읽는 값만의 서명. 어시스트 상태기계(renderAssist)가
// "checking"으로 돌아갈지 말지 이 서명으로만 판단한다(assistSignature를 대체). pickupAt은
// 일부러 뺐다. judgeNudge()가 안 보는 값이라, 픽업 시간만 고쳐도 매번 별이 다시 돌고 똑같은
// 문구가 나오면 "그냥 연출이구나" 하고 신뢰를 잃는다. 아래 필드 목록은 judgeNudge() 본문을
// 그대로 따라간 것이다. judgeNudge()가 바뀌면(새 조건이나 새 필드 추가 등) 이 서명도 반드시
// 같이 고쳐야 한다. 전역에 둔다: 셀프테스트가 직접 호출해 검사한다.
function judgeSignature(s){
  return [s.type, s.route.to, s.route.vias.length, s.charterHours,
          s.flags.golf, s.flags.noReturnCall, s.flags.longDistance, s.flags.airport,
          s.etaMin, s.convertedTo].join('|');
}

const COPY = {
  // title/body/cta는 바텀시트(openSheet)와 하단 고정 넛지(#nudge, 2줄: title+body) 모두가 쓴다.
  'short-trip':    { title:s=>`${s.etaMin}분이면 도착하는 경로예요`,
                     body: s=>`${s.charterHours}시간을 빌리지 않아도 일반예약으로 갈 수 있어요`,
                     cta:'일반예약으로 바꾸기' },
  'golf':          { title:()=>'라운딩 끝나고 돌아올 차가 없을 수 있어요',
                     body: ()=>'시간대절은 기사가 기다렸다가 함께 돌아와요',
                     cta:'시간대절로 바꾸기' },
  'no-return':     { title:()=>'이 지역은 돌아오는 타다를 부르기 어려워요',
                     body: ()=>'시간대절로 돌아올 차편까지 미리 확보해 두세요',
                     cta:'시간대절로 바꾸기' },
  'long-distance': { title:()=>'왕복이라면 시간대절이 더 편해요',
                     body: ()=>'돌아올 차편까지 한 번에 확보할 수 있어요',
                     cta:'시간대절로 바꾸기' },
};

/* ---- 3. ACTIONS ---- */
function setType(next){
  if (S.type === next) return;
  S.type = next;
  if (next === 'normal') S.charterHours = null;
  S.nudgeAcked = false;
  // 수정 5: 스펙 §6의 왕복 방지는 "전환으로 진입한 유형"만 억제 대상이다. 유저가 세그먼트를
  // 직접 눌러 고른 유형은 대상이 아니므로 convertedTo를 비운다. 안 비우면 예전 전환 표식이
  // 세그먼트를 몇 번 오가도 계속 남아, 유저가 직접 고른 유형에서도 넛지가 영구히 억제된다.
  S.convertedTo = null;
  render();
}

function ctaLabel(s){
  if (!s.route.to) return '경로 입력하기';
  if (!s.pickupAt) return '픽업 시간 입력하기';
  if (s.type === 'charter' && s.charterHours == null) return '대절 시간 입력하기';
  return '설정 완료';
}

// 아코디언: 경로 / 픽업 시간 / 대절 시간 카드 중 하나만 연다.
function focusCard(name){
  const current = S.openCard || 'route';
  if (current === name) return;
  S.openCard = name;
  render();
}

// CTA를 누르면 아직 채워지지 않은 항목의 카드를 연다.
// Task 4부터 '설정 완료' 상태의 실제 화면 전환은 onCtaPress()가 맡는다(아래 참고).
// 이 함수 자체는 '입력 덜 됨 → 카드 포커스' 동작만 남아 onCtaPress()에서 재사용된다.
function onCtaClick(){
  if (!S.route.to){ focusCard('route'); return; }
  if (!S.pickupAt){ focusCard('pickup'); return; }
  if (S.type === 'charter' && S.charterHours == null){ focusCard('charter'); return; }
}

// CTA 버튼의 유일한 이벤트 핸들러(bindEvents 참고). onCtaClick()을 감싸
// '입력 미완료 → 카드 포커스'와 '설정 완료 → 화면 전환(+9915 바텀시트 확인)'을
// 한 경로로 합친다.
// 마스터 Figma에는 카드 안에 확정 버튼이 없다: 휠이 열린 화면에서도 버튼은 이 CTA
// 하나뿐이고, 그 CTA가 열린 휠의 값을 확정한다. 그래서 라벨 상태(ctaLabel)와 무관하게
// 열린 카드가 휠 카드(pickup/charter)면 그 확정 경로를 최우선으로 태운다. 확정되면
// confirmPickupWheel()/confirmCharterWheel()이 S.openCard를 null로 접으므로, 이후 같은
// CTA를 다시 누르면 자연히 ctaLabel 기반 분기(카드 포커스 이동 또는 설정 완료)로 넘어간다.
// 9915 바텀시트는 '설정 완료' 상태에서만 걸려야 하므로 휠 확정 경로는 그 아래 검사를
// 절대 거치지 않고 바로 return한다.
function onCtaPress(){
  if (S.openCard === 'pickup'){ confirmPickupWheelFromCard(); return; }
  if (S.openCard === 'charter'){ confirmCharterWheelFromCard(); return; }
  if (ctaLabel(S) !== '설정 완료'){ onCtaClick(); return; }
  // v10(항목 2): 9915(to-charter: 골프/복귀불가/장거리)는 돌아갈 차가 없는 "위험"이고,
  // 9913(to-normal: 짧은 경로)은 "요금" 문제다. 심각도가 다른데 예전엔 둘 다 첫 클릭을
  // 막았다. 요금 문제를 위험과 같은 강도로 다루면 9915의 차단까지 가벼워 보인다. 게다가
  // 3시간을 일부러 빌린 사용자를 매번 막는 건 과하다. 그래서 to-charter 방향만 막는다.
  // to-normal(9913)은 배너만 뜨고 CTA는 바로 통과한다.
  const n = judgeNudge(S);
  if (n && n.dir === 'to-charter' && !S.nudgeAcked){ S.nudgeAcked = true; flashNudge(); return; }
  S.screen = 'vehicle';
  render();
}

// v6: 넛지가 스크롤 안으로 내려가면서(v5) 유저가 스크롤을 안 하면 안 보일 수 있게 됐다.
// 조건이 참인데('judgeNudge'가 참, 그리고 v10부터는 방향이 to-charter일 때만) 유저가 그냥
// '설정 완료'를 누르면, 화면을 넘기는 대신 배너로 스크롤해 데려와 한 번 강조한다. 딱 한
// 번만 막는다: S.nudgeAcked가 그 표식이다(이 예약 세션 동안 다시 막지 않는다는 뜻은
// 예전 시트 확인 플래그와 동일해 이름만 바꿔 그대로 재사용한다). judgeNudge() 자체는
// nudgeAcked를 보지 않으므로 강조 뒤에도 배너(인라인 카드)는 조건이 참인 한 계속 떠 있다.
// v10부터는 #assist를 눌러도(판정 결과가 있을 때만, onAssistPress 참고) 같은 강조를 탄다.
// 어시스트가 카드 위로 올라가며 끊긴 넛지와의 시각적 연결을 상호작용으로 대신한다.
function flashNudge(){
  const el = document.getElementById('nudge');
  if (!el || el.hidden) return;
  const scroll = document.querySelector('#screen-input .rt-scroll');
  if (!scroll) return;
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // scrollIntoView는 바깥 페이지까지 움직일 수 있어 쓰지 않는다. 넛지가 .rt-scroll의
  // 마지막 자식이므로(renderNudge 참고) 그 컨테이너를 바닥까지 스크롤하는 것으로 충분하다.
  scroll.scrollTo({ top: scroll.scrollHeight, behavior: reduceMotion ? 'auto' : 'smooth' });
  // rt-enter(등장 애니메이션)와 같은 요소에 걸리므로 먼저 지워 서로 덮어쓰지 않게 한다.
  el.classList.remove('rt-enter');
  el.classList.remove('rt-flash');
  void el.offsetWidth; // 리플로우: 재실행(remove -> add)이 실제로 애니메이션을 다시 타게 한다.
  el.classList.add('rt-flash');
  // 애니메이션이 끝나면 클래스를 지운다(재실행을 위한 remove는 위에서 이미 add 전에 했다).
  // prefers-reduced-motion에서는 애니메이션이 없어(animation:none) animationend가 안 오지만,
  // 시각적으로 아무 효과도 없는 클래스라 남아 있어도 무해하다.
  el.addEventListener('animationend', function onFlashEnd(){
    el.classList.remove('rt-flash');
    el.removeEventListener('animationend', onFlashEnd);
  }, { once: true });
}

// v5부터 CTA 경로에서는 쓰이지 않는다. 강조(flashNudge)가 대체. 되돌리려면 onCtaPress의
// flash 분기를 openSheet로 바꾸면 된다.
// 9915 방향(일반예약 → 시간대절)만 가로막는 확인 바텀시트.
// 요금이 아니라 '복귀 위험'을 확인시키는 절차라 인라인 카드로 그치지 않는다.
function openSheet(reason){
  const c = COPY[reason];
  document.getElementById('sheet-title').textContent = '돌아올 차편은 준비되셨나요?';
  document.getElementById('sheet-body').textContent  =
    c.title(S) + '\n' + '시간대절은 기사가 목적지에서 기다렸다가 함께 돌아와요.';
  document.getElementById('sheet-convert').textContent = '시간대절로 바꾸기';
  document.getElementById('sheet-go').textContent      = '그대로 진행';
  document.getElementById('sheet-convert').onclick = ()=>{ closeSheet(); convert('charter'); };
  document.getElementById('sheet-go').onclick      = dismissSheet;
  document.getElementById('sheet-backdrop').hidden = false;
  document.getElementById('sheet').hidden = false;
}
function closeSheet(){
  document.getElementById('sheet').hidden = true;
  document.getElementById('sheet-backdrop').hidden = true;
}
// '그대로 진행': 이 예약 세션 동안 다시 가로막지 않는다. 단 인라인 카드는
// judgeNudge()가 nudgeAcked를 보지 않으므로(조건이 여전히 참이면) 그대로 남는다.
function dismissSheet(){
  S.nudgeAcked = true;
  closeSheet();
  S.screen = 'vehicle';
  render();
}

// 넛지 CTA로 전환. 유저가 세그먼트를 직접 누르는 setType()과 달리 convertedTo(왕복 방지 표식)를 남긴다.
function convert(to){
  S.type = to;
  if (to === 'normal') S.charterHours = null;
  S.convertedTo = to;          // 왕복 방지 표식
  S.nudgeAcked = false;
  if (to === 'charter') S.openCard = 'charter';   // 대절 시간 카드 열린 상태로 착지
  // 수정 4: 스펙 §5.4는 시간대절 → 일반예약 착지 상태를 "카드 모두 접힘"으로 요구한다.
  // null을 넣으면 renderInput()의 `S.openCard || 'route'` 폴백에 흡수돼 경로 카드가 열려
  // 버린다(null은 "아직 아무 것도 고르지 않은 기본값"과 "명시적으로 다 접음"을 구분하지
  // 못한다). 'none' sentinel로 명시해 폴백에 흡수되지 않게 한다.
  else S.openCard = 'none';
  render();
}

// ---- Task 5: 생명주기(재판정) ----
// render()가 항상 renderNudge()를 부르므로, 상태를 바꾸는 아래 두 함수는 render()만
// 호출하면 재판정이 저절로 된다. 넛지 표시 여부를 따로 들고 있는 변수를 만들지 않는다.
function setRoute(patch){
  Object.assign(S.route, patch);
  S.nudgeAcked = false;     // 경로가 바뀌면 판단의 전제가 바뀐다
  render();
}
function setCharterHours(h){
  S.charterHours = h;
  render();
}
// 픽업 시간 설정 경로. 아직 이 상태를 바꾸는 액션이 없었으므로 Task 5에서 새로 만든다.
function setPickupAt(d){
  S.pickupAt = d;
  render();
}

// ---- Task 5: 휠 피커 확정 ----
// 휠이 스스로 render()를 부르지 않는다. 반드시 기존 setCharterHours()/setPickupAt() 경로를
// 거치게 해, 넛지 재판정(renderNudge())이 그 경로 하나로만 일어나게 한다.
function confirmPickupWheel(d){
  S.openCard = null;   // 확정되면 카드를 접는다(아코디언 규칙).
  setPickupAt(d);
}
function confirmCharterWheel(h){
  S.openCard = null;   // 위와 동일한 이유
  setCharterHours(h);
}

const NUDGE_ILLUST = {
  'golf': ILLUST_GOLF,

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[ch]));
}

function routeSummaryText(s){
  return [s.route.from, s.route.to].filter(Boolean).join(', ');
}

// ---- Task 6: 미리보기 문자열 규칙 ----
function previewTitle(s){
  return s.type === 'charter' ? `넥스트 ${s.charterHours}시간 대절` : '넥스트 일반 예약';
}
function previewSubtitle(s){
  // 실제 플로우에서는 preview 화면에 pickupAt 없이 도달할 수 없다(onCtaPress가 막는다).
  // 다만 Task 8 레이아웃 테스트처럼 screen만 직접 찍어 렌더를 검증하는 경우가 있어
  // renderPreview() 전체가 죽지 않도록 방어한다.
  if (!s.pickupAt) return '';
  const base = `${fmtDate(s.pickupAt)} ${fmtTime(s.pickupAt)}`;
  if (s.type !== 'charter') return base;
  const end = new Date(s.pickupAt.getTime() + s.charterHours*3600*1000);
  return `${base} ~ ${fmtTime(end)}`;
}
function routeChips(s){
  return s.type === 'charter'
    ? [`${s.charterHours}시간 이용`, `${s.etaMin}분 예상`]
    : [`${s.etaMin}분 예상`];
}
function fmtWon(n){
  const sign = n < 0 ? '-' : '';
  return `${sign}${Math.abs(n).toLocaleString('ko-KR')}원`;
}

// ---- Task 6: 시각 표기 정식 함수 ----
// 날짜만: "m월 n일 (요일)"
function fmtDate(d){
  const wd = ['일','월','화','수','목','금','토'][d.getDay()];
  return `${d.getMonth()+1}월 ${d.getDate()}일 (${wd})`;
}
// 시간만: "오전/오후 h시 m분", 0분이면 "정각". 오전 = 00:00~11:50, 오후 = 12:00~23:50.
function fmtTime(d){
  const h = d.getHours();
  const m = d.getMinutes();
  const ampm = h < 12 ? '오전' : '오후';
  const h12 = (h % 12 === 0) ? 12 : h % 12;
  const minPart = m === 0 ? '정각' : `${m}분`;
  return `${ampm} ${h12}시 ${minPart}`;
}
// 아래 둘은 Task 2/5부터 쓰인 기존 이름. 규칙을 두 벌 두지 않도록 fmtTime/fmtDate를 그대로 호출한다.
// (기존 셀프테스트가 fmtTimeLabel을 이름으로 검사하므로 이름은 남긴다.)
function fmtTimeLabel(d){
  return fmtTime(d);
}
function fmtPickup(d){
  return `${fmtDate(d)} ${fmtTime(d)}`;
}

function routeCardHtml(s, isOpen){
  if (!isOpen){
    // Figma 실측(§6 folded): 아이콘 없이 라벨+요약값 두 요소뿐이다(높이 20+22+20=62).
    // rt-card-value(항목 7): 실제 렌더 후 fitRouteSummaryValue()가 폭을 재서 넘치면 도착지만
    // 남긴다. 여기서는 우선 "출발, 도착" 전체를 채워 둔다(측정 전 기본값).
    return `<div class="rt-route-summary">
      <span class="rt-route-summary-label">경로</span>
      <span class="rt-route-summary-text rt-card-value">${escapeHtml(routeSummaryText(s))}</span>
    </div>`;
  }
  return `<div class="rt-card-head">
      <div class="rt-card-title">경로</div>
      <button type="button" class="rt-via-btn">${ICON_ADD}<span>경유지</span></button>
    </div>
    <div class="rt-route-container">
      <div class="rt-route-row">
        <span class="rt-route-tag">출발</span>
        <span class="rt-route-text">${escapeHtml(s.route.from || '')}</span>
        ${ICON_ARROW}
      </div>
      <div class="rt-route-row">
        <span class="rt-route-tag">도착</span>
        <span class="rt-route-text">${escapeHtml(s.route.to || '')}</span>
        ${ICON_ARROW}
      </div>
    </div>`;
}

// ---- Task 5: 휠 피커 ----
// 프로토타입에 필요한 최소한의 휠. 관성 스크롤은 흉내 내지 않는다.
// 행 높이 44px(Figma 실측 §7), 보이는 영역 132px(3행) : 위아래 44px 패딩을 둬 첫/끝
// 항목도 가운데로 스크롤될 수 있게 한다. (기존 40px/5행은 Figma 실측과 달라 카드 전체
// 높이가 300에서 크게 벗어났다. v7에서 실측값으로 바꿨다.)
const WHEEL_ROW_H = 44;
const WHEEL_VISIBLE = 132;
const WHEEL_PAD = (WHEEL_VISIBLE - WHEEL_ROW_H) / 2; // 44

function wheelColumnHtml(id, items, selectedIndex, extraClass){
  const rows = items.map((label, i) =>
    `<div class="rt-wheel-item${i === selectedIndex ? ' is-selected' : ''}" data-i="${i}">${escapeHtml(String(label))}</div>`
  ).join('');
  return `<div class="rt-wheel-col${extraClass ? ' ' + extraClass : ''}" id="${id}" data-index="${selectedIndex}">
      <div class="rt-wheel-pad"></div>
      ${rows}
      <div class="rt-wheel-pad"></div>
    </div>`;
}

function pickupWheelDates(){
  const base = new Date(); base.setHours(0,0,0,0);
  const arr = [];
  for (let i=0;i<14;i++){ const d = new Date(base); d.setDate(base.getDate()+i); arr.push(d); }
  return arr;
}
function pickupWheelHours(){
  const arr = []; for (let h=0; h<24; h++) arr.push(h); return arr;
}
function pickupWheelMinutes(){
  return [0,10,20,30,40,50];   // 분은 10분 단위
}
function hourWheelLabel(h){
  const ampm = h < 12 ? '오전' : '오후';
  const h12 = (h % 12 === 0) ? 12 : h % 12;
  return `${ampm} ${h12}시`;
}
// 아직 값이 없을 때 휠이 처음 열릴 위치: 지금 시각을 다음 10분 단위로 올림.
function defaultPickupDraft(){
  if (S.pickupAt) return new Date(S.pickupAt);
  const d = new Date(); d.setSeconds(0,0);
  const roundedM = Math.ceil(d.getMinutes()/10)*10;
  if (roundedM === 60){ d.setHours(d.getHours()+1); d.setMinutes(0); }
  else d.setMinutes(roundedM);
  return d;
}
function pickupWheelHtml(){
  const draft = defaultPickupDraft();
  const dates = pickupWheelDates();
  const hours = pickupWheelHours();
  const minutes = pickupWheelMinutes();
  let dateIdx = dates.findIndex(d => d.toDateString() === new Date(draft.getFullYear(), draft.getMonth(), draft.getDate()).toDateString());
  if (dateIdx < 0) dateIdx = 0;
  // 시·분 인덱스는 함께 정규화한다: 분을 10분 단위로 반올림했을 때 60이 되면(분 55~59)
  // 시가 넘어간 것이므로 시 인덱스도 같이 굴려야 한다. 따로 계산하면 휠이 한 시간 뒤처져 보인다.
  let hourIdx = draft.getHours();
  let roundedMinutes = Math.round(draft.getMinutes()/10)*10;
  if (roundedMinutes === 60){ roundedMinutes = 0; hourIdx = (hourIdx + 1) % 24; }
  let minuteIdx = minutes.indexOf(roundedMinutes);
  if (minuteIdx < 0) minuteIdx = 0;
  // Figma 실측(§7 펼침 head, Frame 2085667123): 제목 아래 현재 드래프트 값이 한 줄 더 있다.
  const draftValue = fmtPickup(new Date(dates[dateIdx].getFullYear(), dates[dateIdx].getMonth(), dates[dateIdx].getDate(), hours[hourIdx], minutes[minuteIdx]));
  return `<div class="rt-card-head rt-card-head--col">
      <div class="rt-card-title rt-card-title--ink2">픽업 시간</div>
      <div class="rt-card-head-value">${escapeHtml(draftValue)}</div>
    </div>
    <div class="rt-wheel">
      <div class="rt-wheel-band"></div>
      ${wheelColumnHtml('wheel-pickup-date', dates.map(fmtDate), dateIdx, 'is-wide')}
      ${wheelColumnHtml('wheel-pickup-hour', hours.map(hourWheelLabel), hourIdx)}
      ${wheelColumnHtml('wheel-pickup-minute', minutes.map(m => m===0 ? '정각' : m+'분'), minuteIdx)}
    </div>`;
}

const CHARTER_MAX_HOURS = 12;
function charterWheelHours(){
  const arr = []; for (let h=MIN_CHARTER_HOURS; h<=CHARTER_MAX_HOURS; h++) arr.push(h); return arr;
}
// v10(항목 3): 대절 시간을 고르기 전에 판단 근거를 준다. 오선택을 사후에 교정하는 넛지(9913)는
// 이미 있지만, 정작 "몇 시간을 빌려야 하나"에는 아무 힌트가 없어 예방보다 교정에 기댔다.
// 사용자가 3시간을 고른 뒤에야 "3시간 안 빌려도 된다"고 말하면 sunk cost가 걸린다. 판정
// (judgeNudge)에는 영향이 없는, 순수한 표시용 문구라 여기 따로 둔다.
function charterCardHintHtml(s){
  const lines = [`이 경로는 편도 ${s.etaMin}분이에요`];
  if (s.flags.golf) lines.push('골프장은 보통 5~6시간 빌려요');
  return `<div class="rt-card-hint">${lines.map(t => `<div>${escapeHtml(t)}</div>`).join('')}</div>`;
}
function charterWheelHtml(){
  const hours = charterWheelHours();
  const draft = S.charterHours != null ? S.charterHours : S.charterHoursPreset;
  let idx = hours.indexOf(draft);
  if (idx < 0) idx = 0;
  // 픽업 시간 카드와 같은 머리 구조(제목 + 현재 드래프트 값)로 맞춘다. 힌트(rt-card-hint)는
  // 대절 시간 카드에만 붙는다(픽업 시간 카드는 pickupWheelHtml, 별도 함수라 여기 안 걸린다).
  return `<div class="rt-card-head rt-card-head--col">
      <div class="rt-card-title rt-card-title--ink2">대절 시간</div>
      <div class="rt-card-head-value">${hours[idx]}시간</div>
    </div>
    ${charterCardHintHtml(S)}
    <div class="rt-wheel">
      <div class="rt-wheel-band"></div>
      ${wheelColumnHtml('wheel-charter-hour', hours.map(h=>h+'시간'), idx)}
    </div>`;
}

// 선택된 인덱스는 colEl.dataset.index 라는 명시적 상태로만 산다. 확정 버튼은 이 값을
// 읽을 뿐, 스크롤 위치에서 다시 계산하지 않는다(재계산하면 아래 경쟁이 되살아난다).
//
// 코드로 휠을 smooth 스크롤시키면(행 클릭) 그 사이에도 브라우저가 여러 번 scroll 이벤트를
// 쏜다. 예전에는 "프로그램 스크롤 중"을 고정 360ms 타이머로 추측해 그동안 스크롤 리스너를
// 죽였는데, 시(24행) 열처럼 스크롤 거리가 길면 네이티브 smooth scroll이 360ms를 넘겨 애니메이션
// 도중 값이 풀리고, 그 사이 scroll 이벤트가 중간 scrollTop으로 dataset.index를 덮어썼다.
// 지금은 시간 대신 위치로 판정한다: 클릭한 행이 colEl._wheelProgramTarget(목표 scrollTop)에
// 저장되고, 실제 scrollTop이 그 목표에 충분히 가까워지면(또는 scrollend가 오면) 프로그램
// 스크롤이 끝난 것으로 보고 target을 비운다. target이 남아있는 동안의 scroll 이벤트는
// "유저가 직접 스크롤한 것"이 아니므로 선택 상태를 절대 갱신하지 않는다.
const WHEEL_SETTLE_EPS = 1; // px. scrollTop이 목표와 이 이하로 가까우면 도착으로 본다.

function wheelNearestIndex(colEl){
  const raw = Math.round(colEl.scrollTop / WHEEL_ROW_H);
  const count = colEl.querySelectorAll('.rt-wheel-item').length;
  return Math.max(0, Math.min(count - 1, raw));
}
function wheelSelectIndex(colEl, idx){
  colEl.dataset.index = String(idx);
  colEl.querySelectorAll('.rt-wheel-item').forEach((el, i) => {
    el.classList.toggle('is-selected', i === idx);
  });
}
function bindWheelColumn(colEl){
  // 렌더 시 이미 계산된 선택 인덱스에 스크롤 위치를 동기화(애니메이션 없이).
  colEl.scrollTop = Number(colEl.dataset.index || 0) * WHEEL_ROW_H;
  colEl._wheelProgramTarget = null; // 진행 중인 프로그램 스크롤의 목표 scrollTop(없으면 null)
  let debounceT = null;

  function settle(){
    const target = colEl._wheelProgramTarget;
    if (target != null){
      // 프로그램 스크롤 구간의 이벤트: 위치가 목표에 도달했으면 구간만 닫고, 선택 상태는
      // 손대지 않는다(이미 클릭 시점에 올바른 값으로 갱신돼 있다).
      if (Math.abs(colEl.scrollTop - target) <= WHEEL_SETTLE_EPS) colEl._wheelProgramTarget = null;
      return;
    }
    wheelSelectIndex(colEl, wheelNearestIndex(colEl)); // 유저가 직접 스크롤을 멈춘 경우에만 반영
  }

  colEl.addEventListener('scroll', () => {
    clearTimeout(debounceT);
    debounceT = setTimeout(settle, 120); // 스크롤이 멈출 때까지 기다렸다 한 번만 반영(디바운스)
  });
  // 지원 브라우저에서는 scrollend로 프로그램 스크롤 종료를 더 빨리 알아챈다. 없어도
  // 위 위치 기반 판정(settle)만으로 동작하므로 필수는 아니다.
  colEl.addEventListener('scrollend', () => { colEl._wheelProgramTarget = null; });

  colEl.querySelectorAll('.rt-wheel-item').forEach((item, idx) => {
    item.addEventListener('click', (e) => {
      e.stopPropagation();     // 카드 클릭(focusCard)으로 버블링되지 않게
      wheelSelectIndex(colEl, idx);                          // 값·UI는 즉시(애니메이션과 무관하게) 갱신
      colEl._wheelProgramTarget = idx * WHEEL_ROW_H;
      colEl.scrollTo({ top: colEl._wheelProgramTarget, behavior: 'smooth' });
    });
  });
}
function bindPickupWheelEvents(){
  ['wheel-pickup-date','wheel-pickup-hour','wheel-pickup-minute'].forEach(id => {
    const el = document.getElementById(id);
    if (el) bindWheelColumn(el);
  });
}
function bindCharterWheelEvents(){
  const el = document.getElementById('wheel-charter-hour');
  if (el) bindWheelColumn(el);
}

// 마스터 Figma에는 카드 안 확정 버튼이 없다. 휠이 열린 채로 눌리는 버튼은 하단 전역
// CTA 하나뿐이라, 그 값 읽기·확정 호출을 카드 안 버튼 핸들러에서 여기로 옮겼다.
// confirmPickupWheel()/confirmCharterWheel() 자체는 그대로 두고 호출부만 onCtaPress()로 옮긴다.
function confirmPickupWheelFromCard(){
  const dateEl = document.getElementById('wheel-pickup-date');
  const hourEl = document.getElementById('wheel-pickup-hour');
  const minEl  = document.getElementById('wheel-pickup-minute');
  if (!dateEl || !hourEl || !minEl) return;   // 카드가 열려 있지 않으면 아무것도 안 함
  const dates = pickupWheelDates();
  const hours = pickupWheelHours();
  const minutes = pickupWheelMinutes();
  const d = new Date(dates[Number(dateEl.dataset.index)]);
  d.setHours(hours[Number(hourEl.dataset.index)]);
  d.setMinutes(minutes[Number(minEl.dataset.index)]);
  d.setSeconds(0,0);
  confirmPickupWheel(d);
}
function confirmCharterWheelFromCard(){
  const hourEl = document.getElementById('wheel-charter-hour');
  if (!hourEl) return;
  const hours = charterWheelHours();
  confirmCharterWheel(hours[Number(hourEl.dataset.index)]);
}

function pickupCardHtml(s, isOpen){
  if (isOpen) return pickupWheelHtml();
  const hasValue = !!s.pickupAt;
  // rt-card-value(항목 7): 값이 짧아 실제로는 안 걸리는 안전장치다.
  return `<div class="rt-line-card">
      <span class="rt-line-label">픽업 시간</span>
      <span class="rt-line-value rt-card-value${hasValue ? '' : ' is-placeholder'}">${hasValue ? escapeHtml(fmtPickup(s.pickupAt)) : '언제 출발하세요?'}</span>
    </div>`;
}

function charterCardHtml(s, isOpen){
  if (isOpen) return charterWheelHtml();
  const hasValue = s.charterHours != null;
  // rt-card-value(항목 7): 값이 짧아 실제로는 안 걸리는 안전장치다.
  return `<div class="rt-line-card">
      <span class="rt-line-label">대절 시간</span>
      <span class="rt-line-value rt-card-value${hasValue ? '' : ' is-placeholder'}">${hasValue ? escapeHtml(s.charterHours + '시간') : '얼마나 이용하세요?'}</span>
    </div>`;
}

// Figma 최종판: pill 칩. 선택 표시는 칩 배경, 글자색, 굵기(전부 CSS의 [aria-selected="true"]
// 룰이 맡는다)만으로 하고, 여기서는 버튼 텍스트와 aria-selected만 채운다.
function renderTypeTab(btn, title, isActive){
  btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
  btn.textContent = title;
}

// 선택된 유형의 보조 문구. 칩을 누르면 이 줄이 바뀐다(컨트롤은 칩, 결과는 #type-lead).
const TYPE_LEAD = {
  normal:  '목적지까지 한 번에 이동할 때',
  charter: '이동해서 기다리거나 왕복할 때',
};

// v10(항목 7): 접힌 경로 카드는 Figma의 한 줄 우측 정렬 레이아웃을 유지하되, 값이 실제로
// 넘치면 도착지만 남긴다(우측 정렬 + 그냥 잘리면 도착지가 사라지는데, 정작 중요한 쪽이
// 사라지는 셈이라 최악이다). scrollWidth/clientWidth는 실제 레이아웃이 잡힌 뒤에만 믿을 수
// 있어 routeCardHtml(문자열 생성)이 아니라 여기서, DOM에 붙인 뒤 잰다.
// 도착지만으로도 넘치면(실제 주소는 반드시 넘친다) 문자열 자체를 줄인다. CSS
// text-overflow:ellipsis(.rt-card-value에 안전장치로 남아 있다)에 맡기지 않는 이유는 두
// 가지다. (1) 그 규칙은 끝을 자르는데, 한국 주소는 건물명 같은 식별 정보가 대개 맨 끝에
// 있어(예: "...공항로 272 제2여객터미널") 끝을 자르면 정작 중요한 조각이 사라진다. 그래서
// 여기서는 앞을 잘라 "…"을 붙인다. (2) overflow:hidden 상태에서도 scrollWidth 자체는 줄지
// 않는다(시각적으로 가려질 뿐 "잘린" 게 아니다). 그래서 실제로 문자열 길이를 줄여야
// scrollWidth가 clientWidth 밑으로 내려간다.
function fitRouteSummaryValue(el, s){
  if (!el) return;
  const full = routeSummaryText(s);
  el.textContent = full;
  if (el.scrollWidth <= el.clientWidth + 1) return;          // "출발, 도착"이 들어간다
  const dest = s.route.to || '';
  el.textContent = dest;
  if (el.scrollWidth <= el.clientWidth + 1) return;          // 도착지만으로 들어간다
  let cut = dest;
  while (cut.length > 1 && el.scrollWidth > el.clientWidth + 1){
    cut = cut.slice(1);           // 앞에서부터 잘라 뒤(건물명 등)를 살린다
    el.textContent = '…' + cut;
  }
}

function renderInput(){
  const openName = S.openCard || 'route';

  renderTypeTab(document.getElementById('seg-normal'), '일반예약', S.type === 'normal');
  renderTypeTab(document.getElementById('seg-charter'), '시간대절', S.type === 'charter');
  document.getElementById('type-lead').textContent = TYPE_LEAD[S.type];

  const routeEl = document.getElementById('card-route');
  const isRouteOpen = openName === 'route';
  routeEl.classList.toggle('is-open', isRouteOpen);
  routeEl.innerHTML = routeCardHtml(S, isRouteOpen);
  if (!isRouteOpen) fitRouteSummaryValue(routeEl.querySelector('.rt-card-value'), S);

  const pickupEl = document.getElementById('card-pickup');
  const isPickupOpen = openName === 'pickup';
  pickupEl.classList.toggle('is-open', isPickupOpen);
  pickupEl.innerHTML = pickupCardHtml(S, isPickupOpen);
  if (isPickupOpen) bindPickupWheelEvents();

  const charterEl = document.getElementById('card-charter');
  const showCharter = S.type === 'charter';
  const wasHidden = charterEl.hidden;
  const isCharterOpen = openName === 'charter';
  charterEl.hidden = !showCharter;
  charterEl.classList.toggle('is-open', isCharterOpen);
  if (showCharter){
    charterEl.innerHTML = charterCardHtml(S, isCharterOpen);
    if (isCharterOpen) bindCharterWheelEvents();
    if (wasHidden){
      // 새 카드 등장: translateY(20px)->0 + opacity, 300ms. 사라짐은 즉시(hidden 속성으로 바로 사라짐).
      charterEl.classList.remove('rt-enter');
      void charterEl.offsetWidth; // 애니메이션 재시작을 위한 리플로우
      charterEl.classList.add('rt-enter');
    }
  }

  renderAssist();
  renderNudge();

  document.getElementById('cta').textContent = ctaLabel(S);
}

// ---- AI 어시스트 라인 (Figma §10) ----
// 판정 전제(경로, 픽업 시간, 대절 시간, 유형)가 바뀔 때마다 "판정 중" -> 900ms -> "판정 완료"로
// 도는 상태기계. 실제 판정(judgeNudge)은 절대 건드리지 않는다. 이 모듈은 그 결과를 어떻게
// '보여주는가'만 다룬다.
const ASSIST_CHECK_MS = 900;
const ASSIST_TYPE_MS = 34;   // 글자당 타이핑 속도

// ?selftest=1(기존 파일 안 방식을 그대로 재사용, stateFromQuery 등은 건드리지 않는다) 또는
// prefers-reduced-motion에서는 타이머 없이 즉시 최종 상태로 간다.
function assistSkipAnim(){
  if (new URLSearchParams(location.search).has('selftest')) return true;
  return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
}

// v10(항목 4): "판정 전제가 바뀌었는가"는 이제 judgeSignature()(JUDGE 섹션)로 본다. 예전
// assistSignature()는 pickupAt도 포함해, 픽업 시간만 고쳐도 매번 "확인 중"이 다시 900ms
// 돌고 똑같은 결론이 나왔다. 두세 번 겪으면 "그냥 연출이구나" 하고 신뢰를 잃는다.
// judgeSignature()는 judgeNudge()가 실제로 읽는 값만 담아, 판정에 안 쓰는 입력으로는
// 다시 돌지 않는다. assist는 route.to만 있으면(pickupAt 없이도) 바로 뜬다는 동작은
// 그대로다. 그건 아래 renderAssist()의 `!S.route.to` 가드가 이미 담당하지, 서명이
// 담당하는 몫이 아니다.

let assistGen = 0;              // 세대 토큰: 이 값이 바뀌면 이전 타이머/타이핑은 전부 무효
let assistSig = null;           // 마지막으로 처리한 judgeSignature()
let assistTimer = null;         // "확인 중" -> "완료" 900ms 타이머
let assistTypeTimer = null;     // 타이핑 tick 타이머
let assistRevealReady = true;   // true면 넛지가 지금 바로 등장 애니메이션을 타도 된다(타이핑 완료/스킵)

// v10(항목 1): 판정 결과가 있고("판정 완료" 상태) 그 결과를 보여주는 동안에만 어시스트를
// 누를 수 있게 한다. 체크 중이거나 결과가 없으면(라인이 숨음) role/tabindex를 지운다.
// 클릭 가능해 "보이지" 않아야 스크린리더도 헷갈리지 않는다.
function setAssistClickable(el, clickable){
  if (clickable){
    el.setAttribute('role', 'button');
    el.setAttribute('tabindex', '0');
  } else {
    el.removeAttribute('role');
    el.removeAttribute('tabindex');
  }
}
// 어시스트를 눌렀을 때: 넛지로 스크롤해 강조한다(flashNudge, onCtaPress와 같은 강조).
// role="button"이 없으면(=클릭 불가 상태) 아무 것도 하지 않는다(hidden 요소가 다른
// 이벤트로 클릭될 일은 없지만, 방어적으로 상태를 한 번 더 확인한다).
function onAssistPress(){
  const el = document.getElementById('assist');
  if (el.getAttribute('role') !== 'button') return;
  flashNudge();
}

function clearAssistTypeTimer(){
  if (assistTypeTimer){ clearTimeout(assistTypeTimer); assistTypeTimer = null; }
}

// 한 글자씩 채운다. myGen이 현재 세대(assistGen)와 달라지면(전제가 다시 바뀌어 새 사이클이
// 시작됨) 그 자리에서 멈춘다. 타이머 핸들을 지우는 것만으론 부족하다(§C.2 경고): 이미
// 큐에 들어간 tick이 실행될 수 있으므로 매 tick마다 세대를 다시 확인한다.
function typeAssistText(fullText, myGen, skipAnim, onDone){
  const textEl = document.getElementById('assist-text');
  clearAssistTypeTimer();
  if (skipAnim){
    textEl.textContent = fullText;
    onDone();
    return;
  }
  let i = 0;
  textEl.textContent = '';
  (function tick(){
    if (myGen !== assistGen) return;   // 세대가 바뀌었으면 이 타이핑은 무효
    i++;
    textEl.textContent = fullText.slice(0, i);
    if (i < fullText.length){
      assistTypeTimer = setTimeout(tick, ASSIST_TYPE_MS);
    } else {
      assistTypeTimer = null;
      onDone();
    }
  })();
}

// 타이핑이 끝난 뒤: 넛지가 이미 hidden=false로 화면에 있는데 아직 등장 애니메이션을
// 못 탄 상태(pending)라면, 여기서 기존 rt-card-enter로 나타나게 한다(§C.3). #nudge의
// hidden 속성 자체는 건드리지 않는다. judgeNudge만 그걸 정한다.
function revealPendingNudge(){
  const el = document.getElementById('nudge');
  if (el.hidden || !el.classList.contains('rt-nudge-pending')) return;
  el.classList.remove('rt-nudge-pending');
  el.classList.remove('rt-enter');
  void el.offsetWidth; // 리플로우: 애니메이션이 실제로 다시 타게 한다.
  el.classList.add('rt-enter');
}

function assistApplyChecking(el){
  el.classList.remove('is-done');
  el.classList.add('is-checking');
  document.getElementById('assist-text').textContent = '예약 내용 확인 중';
  setAssistClickable(el, false);   // 항목 1: 체크 중에는 누를 수 없다
}

// v10(항목 5): 어시스트 문구는 결론(예: "시간대절이 필요해보여요")이 아니라 발견을 말한다.
// 결론은 넛지 제목이 이미 말하므로, 어시스트가 결론을 먼저 던지면 읽는 사람이 "왜?"를
// 찾아 아래로 내려가야 한다. 발견 → 문제(넛지 제목) → 해결(넛지 본문) → 행동(넛지 버튼)
// 순서로 만들려고 dir이 아니라 reason으로 고른다.
const ASSIST_DISCOVERY = {
  'golf':          '목적지가 골프장이에요',
  'no-return':     '복귀 차량이 드문 지역이에요',
  'long-distance': '장거리 경로예요',
  'short-trip':    '대절 시간이 경로보다 길어요',
};

function finishAssistCycle(el, myGen, skipAnim){
  assistTimer = null;
  const n = judgeNudge(S);
  if (!n){
    // 판정 결과가 없으면(§B) 라인을 통째로 숨긴다.
    el.hidden = true;
    el.classList.remove('is-checking', 'is-done');
    setAssistClickable(el, false);   // 항목 1: 결과가 없으면 누를 수 없다
    assistRevealReady = true;
    return;
  }
  el.classList.remove('is-checking');
  el.classList.add('is-done');
  setAssistClickable(el, true);   // 항목 1: 판정이 끝나고 결과가 있으면 넛지로 가는 점프가 된다
  const text = ASSIST_DISCOVERY[n.reason];
  typeAssistText(text, myGen, skipAnim, function(){
    if (myGen !== assistGen) return;
    assistRevealReady = true;
    revealPendingNudge();
  });
}

function startAssistCycle(el){
  assistGen++;
  const myGen = assistGen;
  clearTimeout(assistTimer); assistTimer = null;
  clearAssistTypeTimer();
  assistRevealReady = false;   // 이번 판정이 끝나기 전까지는 넛지를 등장시키지 않는다
  el.hidden = false;
  assistApplyChecking(el);

  const skipAnim = assistSkipAnim();
  // .assist-anim이 있을 때만 별 애니메이션(css)이 걸린다. skipAnim(즉시 최종 상태 경로)에서는
  // 붙이지 않는다. 안 그러면 done으로 곧장 뛰어도 rt-assist-pop이 scale(.4)로 "시작"해 그
  // 순간의 getBoundingClientRect()가 축소된 크기를 보고한다(§C.4 요구사항: 애니메이션 자체가
  // 없어야 한다).
  el.classList.toggle('assist-anim', !skipAnim);
  function proceed(){
    if (myGen !== assistGen) return;
    finishAssistCycle(el, myGen, skipAnim);
  }
  if (skipAnim) proceed();
  else assistTimer = setTimeout(proceed, ASSIST_CHECK_MS);
}

function renderAssist(){
  const el = document.getElementById('assist');
  if (!S.route.to){
    // 경로가 없으면 판정 대상이 아니다. 진행 중이던 사이클을 전부 무효화하고 숨긴다.
    assistGen++;
    clearTimeout(assistTimer); assistTimer = null;
    clearAssistTypeTimer();
    assistSig = null;
    assistRevealReady = true;
    el.hidden = true;
    el.classList.remove('is-checking', 'is-done');
    setAssistClickable(el, false);
    return;
  }
  // v10(항목 4): judgeNudge()가 실제로 보는 값만의 서명(judgeSignature, JUDGE 섹션)이 바뀔
  // 때만 "확인 중"으로 되돌린다. pickupAt처럼 판정에 안 쓰는 입력이 바뀌어도 다시 돌지 않는다.
  const sig = judgeSignature(S);
  if (sig !== assistSig){
    assistSig = sig;
    startAssistCycle(el);
  }
}

function renderNudge(){
  const el = document.getElementById('nudge');
  const n = judgeNudge(S);
  if (!n){ el.hidden = true; el.classList.remove('rt-nudge-pending'); return; }
  // v5(Figma 최종판): 방향에 따라 자리를 옮기던 분기를 없앴다. 9913(to-normal)·9915(to-charter)
  // 모두 카드 흐름 안, 스크롤 영역(.rt-scroll) 맨 뒤에 둔다. v10: #nudge-wrap이 없어지면서
  // #nudge는 이제 마크업에 고정된 .rt-scroll의 마지막 자식이라(항목 1) 더 이상 DOM을 옮길
  // 필요가 없다. card-route 등 다른 카드처럼 자리를 그대로 두고 내용/hidden만 갱신한다.
  const c = COPY[n.reason];
  document.getElementById('nudge-illust').src = NUDGE_ILLUST[n.reason];
  document.getElementById('nudge-title').textContent = c.title(S);
  document.getElementById('nudge-body').textContent = c.body(S);
  const cta = document.getElementById('nudge-cta');
  cta.textContent = n.dir === 'to-normal' ? '일반예약으로 변경하기' : '시간대절로 변경하기';
  cta.onclick = ()=> convert(n.dir === 'to-normal' ? 'normal' : 'charter');
  const wasHidden = el.hidden;
  el.hidden = false;
  if (wasHidden && !assistRevealReady){
    // 어시스트가 아직 "확인 중"이거나 타이핑 중이면(§B "타이핑이 끝나면 넛지 카드가 나타난다")
    // hidden만 동기적으로 풀고 시각적으로는 숨겨 둔다(opacity:0, .rt-nudge-pending). 실제 등장은
    // revealPendingNudge()가 타이핑 완료 시점에 맡는다. ?selftest=1/reduced-motion에서는
    // assistRevealReady가 항상 true라 이 분기를 타지 않는다(기존 동작과 동일하게 즉시 등장).
    el.classList.remove('rt-enter');
    el.classList.add('rt-nudge-pending');
    return;
  }
  if (wasHidden){
    el.classList.remove('rt-nudge-pending');
    if (assistSkipAnim()){
      // §C.4: 애니메이션을 끄는 경로에서는 타이머뿐 아니라 등장 애니메이션 자체도 없어야
      // 한다. rt-card-enter는 translateY(20px)에서 시작하므로, 클래스를 걸고 바로 재는
      // 테스트(예: 어시스트-넛지 인접 검사)가 그 20px 오프셋을 그대로 읽어 버린다.
      el.classList.remove('rt-enter');
    } else {
      // 등장: translateY(20px)->0 + opacity, 300ms. 사라짐은 즉시(hidden 속성으로 바로 사라짐).
      el.classList.remove('rt-enter');
      void el.offsetWidth; // 애니메이션 재시작을 위한 리플로우
      el.classList.add('rt-enter');
    }
  }
}

// ---- Task 6: 차종 선택 브리지 ----
// 이번 안이 손대지 않는 화면이라 Figma 2x 렌더 이미지를 깐다(nodeId 48558:155628).
// 상태에 따라 달라지는 내용이 없으므로 renderVehicle()은 히트 영역의 클릭 핸들러만
// (다른 render*와 같은 패턴으로) 매번 다시 건다.
function renderVehicle(){
  document.getElementById('vehicle-hit').onclick = ()=>{ S.screen = 'preview'; render(); };
  // 수정 3: 렌더 이미지에 이미 그려진 뒤로가기 화살표 위에 얹은 히트 영역. 스펙이 이미 정의한
  // "차종 선택 화면에서 뒤로가기로 진입 시" 상태(경로 필드 열린 상태, CTA 항상 '설정 완료')로
  // 입력 화면에 착지한다.
  document.getElementById('vehicle-back').onclick = ()=>{
    S.screen = 'input';
    S.openCard = 'route';
    render();
  };
}

// ---- Task 6: 미리보기 ----
function previewRouteRowsHtml(s){
  return `<div class="rt-route-row">
      <span class="rt-route-tag">출발</span>
      <span class="rt-route-text">${escapeHtml(s.route.from || '')}</span>
    </div>
    <div class="rt-route-row">
      <span class="rt-route-tag">도착</span>
      <span class="rt-route-text">${escapeHtml(s.route.to || '')}</span>
    </div>`;
}

// 프로토타입용 목업 요금. 실제 값은 서버 계산이라 이 태스크 범위 밖이다.
// 줄 순서: 기본요금 → 통행료 → 서비스이용료 → (시간대절만) 시간 추가요금 → 거리 추가요금 → 할인 → 총 예상요금.
function fareRowsHtml(s){
  const rows = [
    ['기본요금', 95000],
    ['통행료', 2000],
    ['서비스이용료', 3000],
  ];
  if (s.type === 'charter'){
    rows.push(['시간 추가요금', 15000]);
    rows.push(['거리 추가요금', 10000]);
  }
  rows.push(['할인', -5000]);
  const total = rows.reduce((sum, [, v]) => sum + v, 0);
  const rowsHtml = rows.map(([label, v]) => `<div class="rt-fare-row">
      <span class="rt-fare-label">${escapeHtml(label)}</span>
      <span class="rt-fare-value">${fmtWon(v)}</span>
    </div>`).join('');
  return rowsHtml + `<div class="rt-fare-row rt-fare-total">
      <span class="rt-fare-label">총 예상요금</span>
      <span class="rt-fare-value">${fmtWon(total)}</span>
    </div>`;
}

function renderPreview(){
  document.getElementById('preview-title').textContent = previewTitle(S);
  document.getElementById('preview-sub').textContent = previewSubtitle(S);
  document.getElementById('route-chips').innerHTML =
    routeChips(S).map(t => `<span class="rt-chip">${escapeHtml(t)}</span>`).join('');
  document.getElementById('preview-route-rows').innerHTML = previewRouteRowsHtml(S);
  document.getElementById('fare-rows').innerHTML = fareRowsHtml(S);
  renderPreviewSwitch();
}

// 요금 카드 아래 전환 줄. 9913 조건(대절 → 일반)이 아직 살아 있을 때만 보인다.
// 입력 화면에서 이미 인라인 넛지를 지나쳐 온 경우의 마지막 안전망이다.
// 9915 방향(일반 → 대절)은 입력 화면 바텀시트로 이미 한 번 가로막았으므로 여기 두지 않는다.
function renderPreviewSwitch(){
  const el = document.getElementById('preview-switch');
  const n = judgeNudge(S);
  if (!n || n.dir !== 'to-normal'){ el.hidden = true; return; }
  el.textContent = `${S.etaMin}분 경로에 ${S.charterHours}시간을 빌리고 있어요 · 예약 유형 바꾸기`;
  el.onclick = ()=>{
    convert('normal');
    S.screen = 'input';
    S.openCard = 'route';          // Figma '차종 선택에서 뒤로가기' 변형. convert()가 openCard를 'none'
                                    // (카드 모두 접힘)으로 두므로 반드시 그 다음에 덮어쓴다. 순서를 바꾸지 말 것.
    render();
  };
  el.hidden = false;
}

function render(){
  document.getElementById('screen-input').hidden    = S.screen !== 'input';
  document.getElementById('screen-vehicle').hidden   = S.screen !== 'vehicle';
  document.getElementById('screen-preview').hidden   = S.screen !== 'preview';
  if (S.screen === 'input') renderInput();
  else if (S.screen === 'vehicle') renderVehicle();
  else if (S.screen === 'preview') renderPreview();
}

function bindEvents(){
  document.getElementById('seg-normal').addEventListener('click', () => setType('normal'));
  document.getElementById('seg-charter').addEventListener('click', () => setType('charter'));
  document.getElementById('cta').addEventListener('click', onCtaPress);
  document.getElementById('card-route').addEventListener('click', () => focusCard('route'));
  document.getElementById('card-pickup').addEventListener('click', () => focusCard('pickup'));
  document.getElementById('card-charter').addEventListener('click', () => focusCard('charter'));
  // v10(항목 1): 판정 결과가 있을 때만(role="button", setAssistClickable 참고) 어시스트를
  // 눌러 넛지로 점프한다. 그 외 상태에서는 onAssistPress()가 role을 다시 확인해 아무 것도
  // 안 한다. 마우스뿐 아니라 키보드(Enter/Space, role="button" + tabindex="0")도 받는다.
  const assistEl = document.getElementById('assist');
  assistEl.addEventListener('click', onAssistPress);
  assistEl.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar'){
      e.preventDefault();
      onAssistPress();
    }
  });
  document.getElementById('preview-back').addEventListener('click', () => { S.screen = 'vehicle'; render(); });
  // 프로토타입 흐름은 미리보기에서 끝난다. 새 화면을 만드는 대신, 눌러도 반응이
  // 없어 보이지 않도록 버튼에 최소한의 피드백만 주고 원래 상태로 되돌린다.
  document.getElementById('preview-cta').addEventListener('click', function(){
    const btn = this;
    if (btn.disabled) return;
    const original = btn.textContent;
    btn.disabled = true;
    btn.textContent = '프로토타입은 여기까지입니다';
    setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 1500);
  });
}

// 쿼리 파라미터(?scenario=&type=)로 초기 상태를 정한다(Task 3에서 이관).
// 파라미터가 없으면 stateFromQuery()가 중립을 돌려주므로 전역 기본값(fresh('normal','normal'))과 동일하다.
function applyQueryToState(){
  const params = new URLSearchParams(location.search);
  const q = stateFromQuery(params);
  S = primeForHarness(fresh(q.scenario, q.type));

  // ---- Task 6: ?screen=vehicle|preview로 바로 열기(QA·스크린샷 전용) ----
  const screen = params.get('screen');
  if (screen === 'vehicle' || screen === 'preview'){
    S.screen = screen;
    // 실제 플로우라면 입력 화면에서 CTA가 '설정 완료'가 될 때까지 픽업 시간(과 시간대절이면
    // 대절 시간)이 이미 채워져 있다. 쿼리로 두 화면을 바로 열 때도 같은 전제를 맞춰 둔다
    // (scenario=normal은 위 분기에서 pickupAt을 안 채우므로 여기서 보정하지 않으면 미리보기가
    // null Date를 만나 그린다).
    if (!S.pickupAt) S.pickupAt = new Date();
    if (S.type === 'charter' && S.charterHours == null) S.charterHours = S.charterHoursPreset;
  }
}

document.addEventListener('DOMContentLoaded', function(){
  applyQueryToState();
  bindEvents();
  render();
  buildPanel();
  bindPanelEvents();
  renderPanel();
});

/* ---- 5. HARNESS ---- */
// 하네스 전용 프라이밍: 시나리오를 고르자마자(패널 클릭이든 ?scenario= 쿼리든) 그 시나리오가
// 노리는 넛지 경로를 바로 볼 수 있도록, 유저가 아직 고르지 않았을 픽업 시간을 하네스가
// 미리 채워 넣는다. fresh()는 pickupAt: null로 "아직 안 고름"을 표현하는 게 계약인데,
// 이 함수는 그 계약을 의도적으로 건너뛴다. 실제 플로우라면 픽업 화면에서 시간을 넣어야
// 넛지·시트가 뜨지만(판정과 렌더 모두 S.pickupAt를 요구한다), 시나리오 전환만으로 그
// 상태를 재현하기 위한 지름길이다.
// 조건은 정상(normal)을 제외한 모든 시나리오다. 9913(short), 9915 계열(golf/noReturn/
// longDistance)뿐 아니라 airport도 포함한다. airport는 judgeNudge가 항상 null을 돌려주므로
// 채워도 넛지가 뜨지는 않지만, 채워 두는 것 자체는 무해하고 "정상만 예외"가 조건을 가장
// 단순하게 표현하므로 굳이 시나리오별로 갈라 적지 않는다.
// 수정 9: 그냥 new Date()를 넣으면 "오후 4시 36분"처럼 휠(10분 단위)이 표현 못 하는 값이
// 화면에 뜬다. 기획자가 캡처해 돌려 보는 화면이라 픽업 시간도 10분 단위여야 한다.
// 규칙(스펙): 초 버림 → +30분 → 10분 올림.
function roundedPickupNow(){
  const d = new Date();
  d.setSeconds(0, 0);                              // 초 버림
  d.setMinutes(d.getMinutes() + 30);                // +30분
  const roundedM = Math.ceil(d.getMinutes() / 10) * 10;  // 10분 올림
  if (roundedM === 60){ d.setHours(d.getHours() + 1); d.setMinutes(0); }
  else d.setMinutes(roundedM);
  return d;
}
function primeForHarness(s){
  if (s.scenario !== 'normal') s.pickupAt = roundedPickupNow();
  return s;
}

// 설정 패널: 폰 프레임 바깥, 기획자·디자이너가 시나리오를 갈아 끼우며 보는 용도.
// 즉시 반영(적용 버튼 없음), 스크림 없음(패널을 열어 둔 채로 폰 조작 가능),
// ⚙ 토글 / ✕ / 바깥 클릭 / Esc로 닫는다. 되돌리기는 '처음으로' 링크(href="?")가 맡는다.
let panelOpen = false;

// SCENARIOS의 키·라벨을 그대로 써서 칩을 만든다(라벨을 여기 다시 적지 않는다).
function buildPanel(){
  const wrap = document.getElementById('panel-scenarios');
  Object.keys(SCENARIOS).forEach(function(key){
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'panel-chip';
    btn.dataset.scenario = key;
    btn.textContent = SCENARIOS[key].label;
    wrap.appendChild(btn);
  });
}

// 현재 S를 기준으로 칩의 is-active만 갱신한다(패널 자체 상태는 이것뿐).
function renderPanel(){
  document.querySelectorAll('#panel [data-scenario]').forEach(function(btn){
    btn.classList.toggle('is-active', btn.dataset.scenario === S.scenario);
  });
  document.querySelectorAll('#panel [data-type]').forEach(function(btn){
    btn.classList.toggle('is-active', btn.dataset.type === S.type);
  });
}

function openPanel(){
  panelOpen = true;
  document.getElementById('panel').hidden = false;
  document.getElementById('gear').classList.add('is-active');
}
function closePanel(){
  panelOpen = false;
  document.getElementById('panel').hidden = true;
  document.getElementById('gear').classList.remove('is-active');
}
function togglePanel(){
  if (panelOpen) closePanel(); else openPanel();
}

// 시나리오를 바꾸면 그 시나리오로 상태를 새로 만든다(fresh(key, S.type)). 유저가 고른
// 시작 탭은 유지한다. primeForHarness()가 applyQueryToState()와 같은 이유로 픽업 시간을
// 채워, 패널에서 시나리오만 눌러도 넛지·시트를 바로 볼 수 있게 한다.
function panelSelectScenario(key){
  S = primeForHarness(fresh(key, S.type));
  render();
  renderPanel();
}
// 시작 탭을 바꾸면 시나리오는 유지한 채 그 탭으로 상태를 새로 만든다(fresh(S.scenario, type)).
// 시나리오와 시작 탭은 서로의 값을 건드리지 않는다(대칭).
function panelSelectType(type){
  S = primeForHarness(fresh(S.scenario, type));
  render();
  renderPanel();
}

function bindPanelEvents(){
  const gear = document.getElementById('gear');
  const panel = document.getElementById('panel');
  const phone = document.getElementById('phone');
  gear.addEventListener('click', function(e){
    e.stopPropagation();
    togglePanel();
  });
  document.getElementById('panel-close').addEventListener('click', closePanel);
  panel.addEventListener('click', function(e){
    const scBtn = e.target.closest('[data-scenario]');
    if (scBtn){ panelSelectScenario(scBtn.dataset.scenario); return; }
    const typeBtn = e.target.closest('[data-type]');
    if (typeBtn){ panelSelectType(typeBtn.dataset.type); return; }
  });
  // 스크림이 없으므로 "바깥 클릭으로 닫기"는 문서 전체 클릭을 듣는다. 여기서 "바깥"은
  // 패널과 폰 프레임을 뺀 나머지다. 폰을 클릭해도 패널이 닫히면 안 된다(패널을 열어
  // 둔 채로 폰을 여러 번 조작하며 비교하는 것이 이 하네스의 존재 이유다).
  document.addEventListener('click', function(e){
    if (!panelOpen) return;
    if (panel.contains(e.target) || e.target === gear || phone.contains(e.target)) return;
    closePanel();
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && panelOpen) closePanel();
  });
}

const T = [];
// 테스트끼리 전역 S / #sheet DOM 상태를 공유하므로, 앞 테스트가 열어 둔 시트나
// 넛지가 뒤 테스트로 새지 않도록 매 테스트 실행 전에 초기 상태로 되돌린다.
function resetForTest(){
  closeSheet();
  const nudgeEl = document.getElementById('nudge');
  nudgeEl.hidden = true;
  nudgeEl.classList.remove('rt-enter');
  nudgeEl.classList.remove('rt-flash');   // v6: 강조 애니메이션 클래스도 테스트 간에 새지 않게 한다.
  nudgeEl.classList.remove('rt-nudge-pending');   // v8: 어시스트 대기 클래스도 테스트 간에 새지 않게 한다.
  // v8: 어시스트 라인도 세대 토큰을 올려 이전 테스트의 타이머(있다면)를 전부 무효화하고
  // 초기 상태(숨김)로 되돌린다.
  assistGen++;
  clearTimeout(assistTimer); assistTimer = null;
  clearAssistTypeTimer();
  assistSig = null;
  assistRevealReady = true;
  const assistEl = document.getElementById('assist');
  assistEl.hidden = true;
  assistEl.classList.remove('is-checking', 'is-done');
  setAssistClickable(assistEl, false);   // v10: role/tabindex도 테스트 간에 새지 않게 한다.
  // 휠의 "프로그램 스크롤 진행 중" 표식(열마다 colEl._wheelProgramTarget)도 초기화한다.
  // 남아 있으면 앞 테스트가 만든 표식이 뒤 테스트의 스크롤 판정에 새어 들어갈 수 있다.
  document.querySelectorAll('.rt-wheel-col').forEach(el => { el._wheelProgramTarget = null; });
  // 설정 패널(Task 7)도 열린 채로 새면 안 된다. 앞 테스트가 열어 둔 패널이 뒤 테스트의
  // "바깥 클릭으로 닫힘" 판정이나 DOM 탐색에 섞여 들어갈 수 있다.
  closePanel();
}
function test(name, fn){
  try { resetForTest(); fn(); T.push('PASS ' + name); }
  catch(e){ T.push('FAIL ' + name + ' :: ' + e.message); }
}
function eq(actual, expected, what){
  if (actual !== expected) throw new Error(`${what||''} expected ${JSON.stringify(expected)} got ${JSON.stringify(actual)}`);
}

  });

  test('카피에 실제 값이 들어감', ()=>{

    const s = fresh('short','charter'); s.charterHours = 3; s.route.to = null;

  });
}
function runInputTests(){
  test('CTA · 경로 없으면 경로 입력하기', ()=>{
    const s = fresh('normal','normal'); s.route.to = null; eq(ctaLabel(s), '경로 입력하기');
  });
  test('CTA · 픽업 시간 없으면 픽업 시간 입력하기', ()=>{
    const s = fresh('normal','normal'); eq(ctaLabel(s), '픽업 시간 입력하기');
  });
  test('CTA · 시간대절은 대절 시간까지 있어야 설정 완료', ()=>{
    const s = fresh('normal','charter'); s.pickupAt = new Date();
    eq(ctaLabel(s), '대절 시간 입력하기');
    s.charterHours = 3; eq(ctaLabel(s), '설정 완료');
  });
  test('유형을 일반으로 바꾸면 대절 시간이 버려짐', ()=>{
    S = fresh('short','charter'); S.charterHours = 3; setType('normal');
    eq(S.charterHours, null);
  });
  // 수정 8: innerText는 CSS로 안 보이는(.rt-screen[hidden]{display:none}) 화면을 건너뛴다.
  // 원래 테스트는 항상 화면 하나(입력)만 켜진 상태에서 innerText를 봤기 때문에, 미리보기나
  // 차종 화면에만 심은 위반(예: previewTitle()이 "시간예약"을 반환)을 절대 못 잡았다.
  // 세 화면을 차례로 렌더해 실제 DOM에 각자의 마크업을 채운 뒤, display 여부와 무관하게
  // 전체 텍스트 노드를 보는 textContent로 검사한다.
  test('폰 프레임 안에 "시간예약"이라는 문자열이 없다', ()=>{
    S = fresh('short','charter'); S.pickupAt = new Date(); S.charterHours = 3;
    S.screen = 'input';   render();
    S.screen = 'vehicle'; render();
    S.screen = 'preview'; render();
    const txt = document.getElementById('phone').textContent;
    if (txt.includes('시간예약')) throw new Error('found 시간예약 in phone frame');
    S.screen = 'input'; render();
  });
  test('세그먼트 라벨이 일반예약 / 시간대절', ()=>{
    // Figma 최종판(pill 칩)은 라벨을 감싸는 별도 span이 없다. 버튼 자신의 textContent를 읽는다
    // (설명은 칩이 아니라 #type-lead가 보여준다).
    eq(document.getElementById('seg-normal').textContent.trim(), '일반예약');
    eq(document.getElementById('seg-charter').textContent.trim(), '시간대절');
  });
  test('유형 카드 두 개는 높이가 같다', ()=>{
    S = fresh('normal','normal'); render();
    const a = document.getElementById('seg-normal').getBoundingClientRect().height;
    const b = document.getElementById('seg-charter').getBoundingClientRect().height;
    if (Math.abs(a-b) > 1) throw new Error(`heights differ: ${a} vs ${b}`);
  });
  // '헤드라인이 선택된 유형의 설명을 보여 준다'는 #type-headline(칩 구성) 전용이었다.
  // pill 칩 + #type-lead 구조에서는 '보조 문구가 선택된 유형을 따라간다'로 대체한다
  // (아래, 원래 문구 "목적지까지 한 번에" → "목적지까지 한 번에 이동할 때"로도 바뀌었다).
  test('보조 문구가 선택된 유형을 따라간다', ()=>{
    S = fresh('normal','normal'); render();
    eq(document.getElementById('type-lead').textContent.trim(), '목적지까지 한 번에 이동할 때');
    setType('charter');
    eq(document.getElementById('type-lead').textContent.trim(), '이동해서 기다리거나 왕복할 때');
  });
  // '칩이 헤드라인보다 위에 있다'는 같은 .rt-seg 안 세로 배치를 봤다. 지금은 칩 줄(.rt-seg)과
  // 보조 문구(#type-lead)가 서로 다른 컨테이너(.rt-seg vs .rt-scroll)에 있지만, 칩이 여전히
  // 보조 문구보다 위에 그려져야 한다는 요구는 남아 있어 같은 방식으로 확인한다.
  test('칩이 보조 문구보다 위에 있다', ()=>{
    S = fresh('normal','normal'); render();
    const chip = document.getElementById('seg-normal').getBoundingClientRect();
    const lead = document.getElementById('type-lead').getBoundingClientRect();
    if (!(chip.bottom <= lead.top)) throw new Error(`chip bottom ${chip.bottom} > lead top ${lead.top}`);
  });
  // 언더라인 탭이던 시절 '탭 터치 타깃이 44 이상이다'였다. Figma 최종판은 pill 칩 높이가
  // 38로 실측돼(44 미만) 그 단언이 더는 성립하지 않는다. 44 기준을 지우는 대신, 실측값
  // 38을 하한으로 낮춰 그 밑으로 줄어드는 회귀만 잡는다(44 이상을 요구하지 않는다).
  test('칩 높이가 38 이상이다(Figma 실측)', ()=>{
    S = fresh('normal','normal'); render();
    for (const id of ['seg-normal','seg-charter']) {
      const h = document.getElementById(id).getBoundingClientRect().height;
      if (h < 38) throw new Error(id + ' height ' + h);

  });
  test('aria-selected 가 선택 상태를 따라간다', ()=>{
    S = fresh('normal','normal'); render();
    eq(document.getElementById('seg-normal').getAttribute('aria-selected'), 'true');
    eq(document.getElementById('seg-charter').getAttribute('aria-selected'), 'false');
    setType('charter');
    eq(document.getElementById('seg-charter').getAttribute('aria-selected'), 'true');
  });
  // 선택 표시가 언더라인(별도 .rt-seg-tab-underline 요소)에서 다시 칩 채움(배경색)으로
  // 돌아갔다. 언더라인은 더 이상 DOM에 없으므로 '선택된 탭만 언더라인을 가진다'는 그
  // 구조를 그대로 옮겨 검사할 수 없어, 칩 자신의 배경색으로 같은 의도("선택된 쪽만 채워짐")를
  // 검사하는 테스트로 대체한다.
  test('선택된 칩만 채워진다', ()=>{
    S = fresh('normal','normal'); render();
    const bg = id => getComputedStyle(document.getElementById(id)).backgroundColor;
    eq(bg('seg-normal'), 'rgb(49, 72, 125)');
    eq(bg('seg-charter'), 'rgb(255, 255, 255)');
    setType('charter');
    eq(bg('seg-charter'), 'rgb(49, 72, 125)');
    eq(bg('seg-normal'), 'rgb(255, 255, 255)');
  });
}
