<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>타다 · 목적지 랜드마크 스냅 선택 프로토타입</title>
<style>
  :root{
    color-scheme: light;
    --white:#ffffff;
    --blue-500:#0094f9; --blue-600:#0086ea; --tada-blue:#32a2fa;
    --navy:#19254d; --navy-marker:#293f71; --navy-ico:#283873;
    --gray-950:#171a24; --gray-900:#262a38; --gray-600:#60667a; --gray-400:#868b9c;
    --gray-100:#d5d7dc; --gray-80:#e3e4e8; --gray-30:#f5f6f7;
    --btn-disabled-bg:#99a5c0; --btn-disabled-tx:#c0c8d9;
    /* naver-map-like palette (sampled from real map) */
    --map-bg:#f7f8f9; --map-block:#e7e8ea; --map-block2:#eceef0; --map-road:#ffffff; --map-road-casing:#e5e7ea;
    --map-rail-zone:#efe9f1; --map-rail:#a9adcf; --map-water:#7cc0e8; --map-water-edge:#addaf1;
    --map-green:#d9e8d4; --map-green2:#cfe3c6; --map-route:#243585; --map-route-casing:#8790c4;
    --poi-subway:#12a7de; --poi-yellow:#f5b301; --poi-red:#f2724b;
    --snap-dur:.42s;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none;}
  body{font-family:"Spoqa Han Sans Neo",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:#eef1f5;color:var(--gray-950);-webkit-font-smoothing:antialiased;}
  .stage{min-height:100dvh;display:flex;align-items:center;justify-content:center;}

  /* mobile-first: fill the actual screen height (no clipping) */
  .phone{position:relative;overflow:hidden;background:#fff;flex:0 0 auto;
    width:100vw;max-width:520px;height:100dvh;}
  /* desktop / roomy viewport: restore the framed phone look */
  @media (min-width:520px) and (min-height:860px){
    .stage{padding:24px;}
    .phone{width:393px;height:820px;border-radius:40px;border:1px solid #e6eaf0;
      box-shadow:0 24px 60px rgba(20,30,55,.22);}
  }
  .screen{position:absolute;inset:0;overflow:hidden;background:var(--map-bg);touch-action:none;}

  /* ── status bar ── */
  .statusbar{position:absolute;top:0;left:0;right:0;height:36px;z-index:40;
    display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 24px;pointer-events:none;}
  .statusbar .time{font-size:13px;letter-spacing:-.2px;color:#000;font-weight:500;}
  .statusbar .sysico{display:flex;align-items:center;gap:5px;}
  .statusbar .sig{width:17px;height:11px;background:linear-gradient(90deg,#000 0 70%,#b9bcc4 70%);border-radius:2px;}
  .statusbar .wifi{width:16px;height:11px;background:#000;
    -webkit-mask:radial-gradient(circle at 50% 100%, #000 32%, transparent 33%) bottom/100% 100% no-repeat;}
  .statusbar .bat{width:24px;height:12px;border:1px solid #000;border-radius:3px;position:relative;}
  .statusbar .bat::before{content:"";position:absolute;inset:1.5px;width:70%;background:#000;border-radius:1px;}
  .statusbar .bat::after{content:"";position:absolute;right:-3px;top:3.5px;width:2px;height:5px;background:#000;border-radius:0 2px 2px 0;}

  /* ── pannable world (translate + zoom, origin top-left) — sized to the real map image aspect ── */
  .world{position:absolute;top:0;left:0;width:1040px;height:1613px;will-change:transform;transform-origin:0 0;--inv:1;}
  .world.snapping{transition:transform var(--snap-dur) cubic-bezier(.22,.61,.36,1);}

  .mapart{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;
    -webkit-user-select:none;user-select:none;-webkit-user-drag:none;pointer-events:none;}

  /* candidate markers — Figma ic_number_blue_stroke3: white fill + navy ring (hollow).
     counter-scaled (var(--inv)) so they keep constant screen size while the map zooms. */
  .cand{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;
    background:#fff;border:3px solid var(--navy-marker);
    box-shadow:0 2px 5px rgba(20,30,55,.20);
    transform:scale(var(--inv,1));
    transition:width .16s ease, height .16s ease, border-width .16s ease, box-shadow .16s ease;}
  .cand.near{width:20px;height:20px;margin:-10px 0 0 -10px;border-width:5px;
    box-shadow:0 4px 12px rgba(20,30,55,.34);}

  /* my location (ic_gps) — constant screen size while zooming */
  .myloc{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;transform:scale(var(--inv,1));}
  .myloc .halo{position:absolute;inset:-14px;border-radius:50%;background:rgba(50,162,250,.20);border:1px solid var(--tada-blue);}
  .myloc .dot{position:absolute;inset:0;border-radius:50%;background:var(--tada-blue);border:1.5px solid #fff;box-shadow:0 1px 4px rgba(20,30,55,.3);}

  /* ── fixed reticle (badge + pin) at anchor — left/top set by JS layout() ── */
  .reticle{position:absolute;left:50%;top:44%;z-index:30;transform:translate(-50%,0);pointer-events:none;}

  /* settled: 목적지 badge with stem, tip at anchor */
  .badge-wrap{position:absolute;left:0;bottom:0;transform:translate(-50%,0);
    display:flex;flex-direction:column;align-items:center;
    transition:opacity .16s ease, transform .18s ease;}
  .badge{background:var(--blue-500);border:1px solid var(--blue-600);border-radius:24px;
    padding:3px 10px;color:#fff;font-weight:700;font-size:13px;line-height:1.5;white-space:nowrap;
    box-shadow:0 4px 10px rgba(0,134,234,.35);}
  .badge-stem{width:3px;height:16px;background:var(--blue-500);}

  /* dragging: floating balloon pin, tip at anchor */
  .pin-wrap{position:absolute;left:0;bottom:0;transform:translate(-50%,0);
    display:flex;flex-direction:column;align-items:center;
    opacity:0;transition:opacity .16s ease, transform .2s cubic-bezier(.22,.61,.36,1);}
  .pin-head{width:26px;height:26px;border-radius:50%;background:var(--tada-blue);
    display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(50,162,250,.5);}
  .pin-head::after{content:"";width:9px;height:9px;border-radius:50%;background:#fff;}
  .pin-stem{width:3px;height:13px;background:var(--tada-blue);}
  .pin-base{width:10px;height:4px;border-radius:50%;background:var(--tada-blue);opacity:.55;margin-top:2px;}

  /* state toggles */
  .phone.dragging .badge-wrap,
  .phone.snapping .badge-wrap{opacity:0;}
  .phone.dragging .pin-wrap,
  .phone.snapping .pin-wrap{opacity:1;}
  .phone.dragging .pin-wrap{transform:translate(-50%,-6px);} /* lift while floating */

  /* ── current-location button ── */
  .cloc{position:absolute;right:16px;z-index:35;width:40px;height:40px;border-radius:20px;background:#fff;
    box-shadow:0 4px 12px rgba(20,30,55,.18);display:flex;align-items:center;justify-content:center;
    bottom:196px;/* set by JS layout() */}
  .cloc svg{display:block;}

  /* ── bottom sheet ── */
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:38;background:#fff;
    border-radius:12px 12px 0 0;box-shadow:0 -8px 24px rgba(20,30,55,.10);}
  .sheet .info{padding:25px 25px 20px;}
  .sheet .title{font-size:18px;font-weight:700;color:#000;line-height:1.35;
    transition:opacity .16s ease;}
  .sheet .addr{font-size:14px;font-weight:400;color:#000;line-height:1.4;margin-top:5px;
    transition:opacity .16s ease;}
  .phone.dragging .sheet .title,
  .phone.dragging .sheet .addr{opacity:.35;}
  .sheet .btnwrap{padding:10px 24px calc(10px + env(safe-area-inset-bottom, 0px));}
  .cta{width:100%;border:0;border-radius:4px;background:var(--navy);color:#fff;
    font-family:inherit;font-weight:700;font-size:16px;line-height:1;padding:16px 12px;
    transition:background .18s ease, color .18s ease;cursor:pointer;}
  .phone.dragging .cta{background:var(--btn-disabled-bg);color:var(--btn-disabled-tx);pointer-events:none;}

  .hint{position:absolute;left:50%;top:60px;transform:translateX(-50%);z-index:36;
    background:rgba(23,26,36,.82);color:#fff;font-size:12.5px;font-weight:500;
    padding:7px 14px;border-radius:16px;white-space:nowrap;pointer-events:none;
    transition:opacity .3s ease;box-shadow:0 4px 12px rgba(0,0,0,.2);}
  .phone.dragging .hint{opacity:0;}
</style>
</head>

  ];

  var world   = document.getElementById('world');
  var phone   = document.getElementById('phone');
  var screen  = document.getElementById('screen');
  var poiName = document.getElementById('poiName');
  var poiAddr = document.getElementById('poiAddr');
  var reticle = document.getElementById('reticle');
  var cloc    = document.querySelector('.cloc');
  var sheet   = document.querySelector('.sheet');
  var STATUSBAR_H = 36;

  var tx=0, ty=0, scale=1;    // world translate + zoom
  var MINZ=0.75, MAXZ=2.6;
  var selected = 0, nearIdx = 0, snapTimer=null, wheelTimer=null;

  // build candidate marker elements
  var dots = CANDS.map(function(c){
    var el = document.createElement('div');
    el.className = 'cand';
    el.style.left = c.wx + 'px';
    el.style.top  = c.wy + 'px';
    world.appendChild(el);
    return el;
  });

  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
  function applyTransform(){
    world.style.transform = 'translate('+tx+'px,'+ty+'px) scale('+scale+')';
    world.style.setProperty('--inv', (1/scale).toFixed(4));   // keep markers constant size
  }

  // center a candidate under the anchor (respecting zoom)
  function centerOn(i){ tx = ANCHOR.x - CANDS[i].wx*scale; ty = ANCHOR.y - CANDS[i].wy*scale; applyTransform(); }

  // nearest candidate to the anchor for the current transform
  function nearestToAnchor(){
    var best=0, bd=Infinity;
    for(var i=0;i<CANDS.length;i++){
      var sx = CANDS[i].wx*scale + tx, sy = CANDS[i].wy*scale + ty;
      var d = (sx-ANCHOR.x)*(sx-ANCHOR.x) + (sy-ANCHOR.y)*(sy-ANCHOR.y);
      if(d<bd){bd=d;best=i;}
    }
    return best;
  }

  // zoom keeping the world point under (fx,fy) fixed on screen
  function zoomAround(newScale, fx, fy){
    newScale = clamp(newScale, MINZ, MAXZ);
    if(newScale===scale) return;
    tx = fx - (fx - tx) * (newScale/scale);
    ty = fy - (fy - ty) * (newScale/scale);
    scale = newScale;
    applyTransform();
  }

  function markNear(i){
    if(i===nearIdx) return;
    dots[nearIdx].classList.remove('near');
    nearIdx = i;
    dots[nearIdx].classList.add('near');
  }
  function setSheet(i){ poiName.textContent = CANDS[i].name; poiAddr.textContent = CANDS[i].addr; }
  function setSelected(i){ dots[selected].classList.remove('selected'); selected = i; dots[selected].classList.add('selected'); }

  // ── responsive layout: anchor follows real screen height ──

    var w = screen.clientWidth, h = screen.clientHeight;
    var sheetH = sheet.offsetHeight;
    ANCHOR.x = Math.round(w / 2);
    ANCHOR.y = Math.round(STATUSBAR_H + (h - STATUSBAR_H - sheetH) / 2);
    reticle.style.left = ANCHOR.x + 'px';
    reticle.style.top  = ANCHOR.y + 'px';
    cloc.style.bottom  = (sheetH + 16) + 'px';
    centerOn(selected);            // keep the selected candidate under the anchor
  }

  // ── init ──
  setSelected(0); setSheet(0);
  dots[0].classList.add('near'); nearIdx = 0;
  layout();
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function(){ setTimeout(layout, 250); });

  // ── gestures: 1 pointer = pan→snap, 2 pointers = pinch zoom, wheel = zoom ──
  var pointers = new Map();
  var mode = null;                 // 'pan' | 'pinch'
  var panStart = null;             // {x,y,tx,ty}
  var pinchStart = null;           // {dist, scale}

  function localPt(e){ var r = screen.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
  function pts(){ return Array.from(pointers.values()); }
  function distOf(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

  function beginGestureVisual(){
    if(snapTimer){ clearTimeout(snapTimer); snapTimer=null; }
    world.removeEventListener('transitionend', onWorldTE);
    world.classList.remove('snapping');
    phone.classList.remove('snapping');
    phone.classList.add('dragging');
  }
  function startPan(){ var p = pts()[0]; panStart = {x:p.x, y:p.y, tx:tx, ty:ty}; mode='pan'; }
  function startPinch(){ var a = pts(); pinchStart = {dist:Math.max(1,distOf(a[0],a[1])), scale:scale}; mode='pinch'; }

  function onDown(e){
    if(e.target.closest('.sheet') || e.target.closest('.cloc')) return;
    pointers.set(e.pointerId, localPt(e));
    try{ if(e.pointerId!=null && screen.setPointerCapture) screen.setPointerCapture(e.pointerId); }catch(_){}
    beginGestureVisual();
    if(pointers.size === 1) startPan();
    else if(pointers.size === 2) startPinch();
    if(e.cancelable) e.preventDefault();
  }
  function onMove(e){
    if(!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, localPt(e));
    if(mode === 'pan'){
      var p = pointers.get(e.pointerId);
      tx = panStart.tx + (p.x - panStart.x);
      ty = panStart.ty + (p.y - panStart.y);
      applyTransform();
    } else if(mode === 'pinch'){
      var a = pts(); if(a.length < 2) return;
      var mid = {x:(a[0].x+a[1].x)/2, y:(a[0].y+a[1].y)/2};
      zoomAround(pinchStart.scale * (distOf(a[0],a[1]) / pinchStart.dist), mid.x, mid.y);
    }
    markNear(nearestToAnchor());
    if(e.cancelable) e.preventDefault();
  }
  function onUp(e){
    if(!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    try{ if(e.pointerId!=null && screen.releasePointerCapture) screen.releasePointerCapture(e.pointerId); }catch(_){}
    if(pointers.size === 1) startPan();          // pinch→pan handoff without jump
    else if(pointers.size >= 2) startPinch();
    else { mode=null; doSnap(); }                // all fingers up → snap to nearest
  }

  function finishSnap(){
    world.classList.remove('snapping');
    phone.classList.remove('snapping');          // → badge 복귀
    world.removeEventListener('transitionend', onWorldTE);
    if(snapTimer){ clearTimeout(snapTimer); snapTimer=null; }
  }
  function onWorldTE(e){ if(e.propertyName==='transform') finishSnap(); }

  function doSnap(){
    var target = nearestToAnchor();
    var tTx = ANCHOR.x - CANDS[target].wx*scale, tTy = ANCHOR.y - CANDS[target].wy*scale;
    var changed = (Math.abs(tx-tTx) > 0.5 || Math.abs(ty-tTy) > 0.5);
    phone.classList.remove('dragging');
    phone.classList.add('snapping');
    world.classList.add('snapping');
    setSelected(target); markNear(target); setSheet(target);   // 주소 갱신
    world.addEventListener('transitionend', onWorldTE);
    centerOn(target);
    snapTimer = setTimeout(finishSnap, changed ? 520 : 0);
  }

  screen.addEventListener('pointerdown', onDown);
  screen.addEventListener('pointermove', onMove);
  screen.addEventListener('pointerup', onUp);
  screen.addEventListener('pointercancel', onUp);
  if(!window.PointerEvent){    // mouse fallback (no pointer events)
    screen.addEventListener('mousedown', function(e){ e.pointerId='m'; onDown(e); });
    window.addEventListener('mousemove', function(e){ if(pointers.size){ e.pointerId='m'; onMove(e); } });
    window.addEventListener('mouseup',   function(e){ e.pointerId='m'; onUp(e); });
  }

  // wheel zoom (desktop) — zoom toward cursor, then settle-snap
  screen.addEventListener('wheel', function(e){
    e.preventDefault();
    var p = localPt(e);
    beginGestureVisual();
    zoomAround(scale * Math.exp(-e.deltaY * 0.0015), p.x, p.y);
    markNear(nearestToAnchor());
    if(wheelTimer) clearTimeout(wheelTimer);
    wheelTimer = setTimeout(function(){ if(pointers.size===0){ mode=null; doSnap(); } }, 240);
  }, {passive:false});

  // CTA
  document.getElementById('cta').addEventListener('click', function(){
    var el = this, prev = el.textContent;
    el.textContent = '✓ ' + CANDS[selected].name.split(' ')[0] + ' 하차지 설정됨';
    setTimeout(function(){ el.textContent = prev; }, 1400);
  });
})();
</script>
</body>
</html>
